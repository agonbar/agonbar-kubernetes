# Wall panel for the old Mi MIX 2, shown by the VACA app on Home Assistant aya.
# The phone sits in landscape (2160x1080, ~785x393 css px), which fits two
# section columns. kiosk-mode (HACS) hides the header and sidebar for non-admin
# users only, i.e. for the "panel" user the phone logs in as; admins still get
# the normal UI on this dashboard.
#
# Apply (creates the dashboard on first run, overwrites its config after):
#   scripts/ha-panel-mix2.sh
title: Panel
kiosk_mode:
  non_admin_settings:
    kiosk: true
views:
  - title: Casa
    path: casa
    icon: mdi:home
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          # Voice satellite indicator: a thin animated bar pinned to the top edge
          # while VACA is not idle (VACA itself draws nothing). Needs card-mod
          # (HACS) for the fixed positioning. One static card per state because
          # card-mod templates go through render_template, which HA only allows
          # for admins, and the phone logs in as the non-admin "panel" user.
          # Blue = listening, amber = thinking, green = speaking.
          - type: conditional
            conditions:
              - condition: state
                entity: assist_satellite.vaca_a203991c0
                state: listening
            card:
              type: markdown
              content: "&nbsp;"
              card_mod:
                style: |
                  ha-card {
                    position: fixed !important; inset: 0 0 auto 0 !important; z-index: 9;
                    height: 8px !important; min-height: 0 !important; max-height: 8px !important; padding: 0; overflow: hidden;
                    border: none; border-radius: 0;
                    background: linear-gradient(90deg, #03a9f4, #7c4dff, #03a9f4, #7c4dff);
                    background-size: 200% 100%;
                    animation: va-slide 1.2s linear infinite;
                  }
                  @keyframes va-slide { from { background-position: 0 0; } to { background-position: 200% 0; } }
          - type: conditional
            conditions:
              - condition: state
                entity: assist_satellite.vaca_a203991c0
                state: processing
            card:
              type: markdown
              content: "&nbsp;"
              card_mod:
                style: |
                  ha-card {
                    position: fixed !important; inset: 0 0 auto 0 !important; z-index: 9;
                    height: 8px !important; min-height: 0 !important; max-height: 8px !important; padding: 0; overflow: hidden;
                    border: none; border-radius: 0;
                    background: linear-gradient(90deg, #ffb300, #ff6f00, #ffb300, #ff6f00);
                    background-size: 200% 100%;
                    animation: va-slide 1.2s linear infinite;
                  }
                  @keyframes va-slide { from { background-position: 0 0; } to { background-position: 200% 0; } }
          - type: conditional
            conditions:
              - condition: state
                entity: assist_satellite.vaca_a203991c0
                state: responding
            card:
              type: markdown
              content: "&nbsp;"
              card_mod:
                style: |
                  ha-card {
                    position: fixed !important; inset: 0 0 auto 0 !important; z-index: 9;
                    height: 8px !important; min-height: 0 !important; max-height: 8px !important; padding: 0; overflow: hidden;
                    border: none; border-radius: 0;
                    background: linear-gradient(90deg, #00e676, #00bfa5, #00e676, #00bfa5);
                    background-size: 200% 100%;
                    animation: va-slide 1.2s linear infinite;
                  }
                  @keyframes va-slide { from { background-position: 0 0; } to { background-position: 200% 0; } }
          - type: markdown
            text_only: true
            content: >-
              # {{ now().strftime('%H:%M') }}

              {{ ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'][now().weekday()] }},
              {{ now().day }} de {{ ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][now().month - 1] }}
          - type: weather-forecast
            entity: weather.forecast_home
            forecast_type: daily
            show_current: true
            show_forecast: true

      - type: grid
        cards:
          - type: heading
            heading: Modo de VMs
            icon: mdi:server
          - type: tile
            entity: sensor.vm_mode
            name: Modo actual
            grid_options: { columns: full }
          - type: button
            name: Gaming
            icon: mdi:gamepad-variant
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target: { entity_id: script.modo_gaming }
              confirmation: { text: "¿Cambiar a Gaming (TINY11-FULL)?" }
          - type: button
            name: Encoding
            icon: mdi:video-vintage
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target: { entity_id: script.modo_encoding }
              confirmation: { text: "¿Cambiar a Encoding (WORK-00-ENCODE)?" }
          - type: button
            name: Híbrido
            icon: mdi:monitor-multiple
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target: { entity_id: script.modo_both }
              confirmation: { text: "¿Cambiar a Híbrido (WORK-00 + Bazzite)?" }
          - type: button
            name: "Off"
            icon: mdi:power
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target: { entity_id: script.modo_off }
              confirmation: { text: "¿Apagar todas las VMs?" }

      - type: grid
        cards:
          - type: heading
            heading: Tele
            icon: mdi:television-ambient-light
          - type: tile
            entity: light.tele
            name: Ambilight
            grid_options: { columns: full }
            features:
              - type: light-brightness
          - type: picture-entity
            entity: camera.tele
            camera_view: auto
            show_name: false
            show_state: false
            grid_options: { columns: full }

      - type: grid
        cards:
          - type: heading
            heading: Cámara del panel
            icon: mdi:cctv
          - type: picture-entity
            entity: camera.mix2
            camera_view: auto
            show_name: false
            show_state: false
            grid_options: { columns: full }
          - type: tile
            entity: switch.mix2_front_facing_camera
            name: Frontal
          - type: tile
            entity: switch.mix2_torch
            name: Linterna

      - type: grid
        cards:
          - type: heading
            heading: Sistema
            icon: mdi:chart-box-outline
          - type: tile
            entity: sensor.tdarr_active_workers
            name: Tdarr workers
          - type: tile
            entity: sensor.tdarr_total_fps
            name: Tdarr FPS
          - type: tile
            entity: sensor.node_proxmox_agb00_cpu_used
            name: agb00 CPU
          - type: tile
            entity: sensor.node_proxmox_agb00_memory_used_percentage
            name: agb00 RAM
          - type: tile
            entity: switch.pi_hole
            name: Pi-hole
          - type: tile
            entity: sensor.pi_hole_ads_blocked
            name: Anuncios bloqueados

      - type: grid
        cards:
          - type: heading
            heading: Satélite
            icon: mdi:microphone-message
          - type: tile
            entity: switch.vaca_a203991c0_mute
            name: Micro silenciado
          - type: tile
            entity: sensor.vaca_a203991c0_battery
            name: Batería
          - type: tile
            entity: number.vaca_a203991c0_voice_volume
            name: Volumen voz
            grid_options: { columns: full }
            features:
              - type: numeric-input
                style: slider
