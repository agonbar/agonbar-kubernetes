# Wall panel for the old Mi MIX 2, shown by the VACA app on Home Assistant aya.
# The phone sits in landscape (2160x1080, ~785x393 css px), which fits two
# section columns. kiosk-mode (HACS) hides the header and sidebar for non-admin
# users only, i.e. for the "panel" user the phone logs in as; admins still get
# the normal UI on this dashboard.
#
# Apply (creates the dashboard on first run, overwrites its config after):
#   scripts/ha-panel-mix2.sh
title: Panel
kiosk_mode:
  non_admin_settings:
    kiosk: true
views:
  - title: Casa
    path: casa
    icon: mdi:home
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: markdown
            text_only: true
            content: >-
              # {{ now().strftime('%H:%M') }}

              {{ ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'][now().weekday()] }},
              {{ now().day }} de {{ ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][now().month - 1] }}
              · {{ state_attr('weather.forecast_home', 'temperature') | round(0) }} °C
              · {{ {'sunny':'despejado','clear-night':'despejado','partlycloudy':'parcialmente nublado','cloudy':'nublado','rainy':'lluvia','pouring':'lluvia fuerte','fog':'niebla','windy':'viento','snowy':'nieve','lightning-rainy':'tormenta'}.get(states('weather.forecast_home'), states('weather.forecast_home')) }}
          # work-vm-00, from console-panel's /state.json (scripts/ha-panel-mix2-work.yaml).
          # Hidden in desktop mode, when the endpoint doesn't exist.
          - type: tile
            entity: sensor.rtx_3090_uso
            name: 3090
            visibility: &encoding
              - condition: state
                entity: sensor.work_vm_00
                state_not: unavailable
          - type: tile
            entity: sensor.rtx_3090_vram
            name: VRAM
            visibility: *encoding
          - type: tile
            entity: sensor.rtx_3090_consumo
            name: Consumo
            visibility: *encoding
          - type: tile
            entity: sensor.rtx_3090_temperatura
            name: Temperatura
            visibility: *encoding
          - type: markdown
            visibility: *encoding
            content: >-
              {% set l = state_attr('sensor.work_vm_00', 'llm') %}
              {% set d = state_attr('sensor.work_vm_00', 'docling') %}
              **LLM** {{ 'trabajando' if l.busy else 'en espera' }} · {{ l.busy }}/{{ l.slots }} slots
              · {{ l.gen_tps | round(0) }} tok/s · {{ l.requests_last_hour }}/h
              <br>**docling** {{ 'trabajando' if d.active else 'en espera' }} · {{ d.requests_last_hour }}/h
              · disco libre {{ states('sensor.work_vm_00_disco_libre') }} GB

      - type: grid
        cards:
          - type: heading
            heading: Modo de VMs
            icon: mdi:server
          - type: tile
            entity: sensor.vm_mode
            name: Modo actual
            grid_options: { columns: full }
          - type: button
            name: Gaming
            icon: mdi:gamepad-variant
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target: { entity_id: script.modo_gaming }
              confirmation: { text: "¿Cambiar a Gaming (TINY11-FULL)?" }
          - type: button
            name: Encoding
            icon: mdi:video-vintage
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target: { entity_id: script.modo_encoding }
              confirmation: { text: "¿Cambiar a Encoding (WORK-00-ENCODE)?" }
          - type: button
            name: Híbrido
            icon: mdi:monitor-multiple
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target: { entity_id: script.modo_both }
              confirmation: { text: "¿Cambiar a Híbrido (WORK-00 + Bazzite)?" }
          - type: button
            name: "Off"
            icon: mdi:power
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target: { entity_id: script.modo_off }
              confirmation: { text: "¿Apagar todas las VMs?" }

      - type: grid
        cards:
          - type: heading
            heading: Tdarr
            icon: mdi:movie-cog
          - type: markdown
            visibility:
              - condition: state
                entity: sensor.work_vm_00
                state_not: unavailable
            content: >-
              {% set t = state_attr('sensor.work_vm_00', 'tdarr') %}
              **{{ t.queue }}** en cola · **{{ t.fps | round(0) }}** fps · {{ t.workers | count }} workers
              {% for w in t.workers | sort(attribute='node') %}

              **{{ w.node }}** · {{ w.kind }} · {{ w.pct | round(0) | int }} % · {{ w.eta }}<br>
              <code>{{ '█' * ((w.pct / 10) | int) }}{{ '░' * (10 - (w.pct / 10) | int) }}</code>
              {{ w.file | regex_replace(' WEBDL.*| WEB-DL.*| \\[.*', '') | truncate(48, true, '…') }}
              {%- endfor %}

      - type: grid
        cards:
          - type: heading
            heading: Tele
            icon: mdi:television-ambient-light
          - type: tile
            entity: light.tele
            name: Ambilight
            grid_options: { columns: full }
            features:
              - type: light-brightness
          - type: picture-entity
            entity: camera.tele
            camera_view: auto
            show_name: false
            show_state: false
            grid_options: { columns: full }

      - type: grid
        cards:
          - type: heading
            heading: Cámara del panel
            icon: mdi:cctv
          - type: picture-entity
            entity: camera.mix2
            camera_view: auto
            show_name: false
            show_state: false
            grid_options: { columns: full }
          - type: tile
            entity: switch.mix2_front_facing_camera
            name: Frontal
          - type: tile
            entity: switch.mix2_torch
            name: Linterna

      - type: grid
        cards:
          - type: weather-forecast
            entity: weather.forecast_home
            name: Tiempo
            forecast_type: daily
            show_current: false
            show_forecast: true

      - type: grid
        cards:
          - type: heading
            heading: Sistema
            icon: mdi:chart-box-outline
          - type: tile
            entity: sensor.node_proxmox_agb00_cpu_used
            name: agb00 CPU
          - type: tile
            entity: sensor.node_proxmox_agb00_memory_used_percentage
            name: agb00 RAM
          - type: tile
            entity: switch.pi_hole
            name: Pi-hole
          - type: tile
            entity: sensor.pi_hole_ads_blocked
            name: Anuncios bloqueados

      - type: grid
        cards:
          - type: heading
            heading: Satélite
            icon: mdi:microphone-message
          - type: tile
            entity: switch.vaca_a203991c0_mute
            name: Micro silenciado
          - type: tile
            entity: sensor.vaca_a203991c0_battery
            name: Batería
          - type: tile
            entity: number.vaca_a203991c0_voice_volume
            name: Volumen voz
            grid_options: { columns: full }
            features:
              - type: numeric-input
                style: slider
          # Voice satellite indicator: a thin animated bar pinned to the bottom edge
          # while VACA is not idle (VACA itself draws nothing). Needs card-mod
          # (HACS) for the fixed positioning. One static card per state: the
          # first, templated version didn't style on the phone and static cards
          # did; not chased further.
          # Blue = listening, amber = thinking, green = speaking.
          # The bar is position:fixed, but the card still takes a grid cell when it
          # shows up, so these cards live at the very end of the last section: the
          # cell opens below everything else and nothing visible moves.
          - type: conditional
            conditions:
              - condition: state
                entity: assist_satellite.vaca_a203991c0
                state: listening
            grid_options: { columns: full, rows: auto }
            card:
              type: markdown
              content: "&nbsp;"
              card_mod:
                style: |
                  ha-card {
                    position: fixed !important; inset: auto 0 0 0 !important; z-index: 9;
                    height: 8px !important; min-height: 0 !important; max-height: 8px !important; padding: 0; overflow: hidden;
                    border: none; border-radius: 0;
                    background: linear-gradient(90deg, #03a9f4, #7c4dff, #03a9f4, #7c4dff);
                    background-size: 200% 100%;
                    animation: va-slide 1.2s linear infinite;
                  }
                  @keyframes va-slide { from { background-position: 0 0; } to { background-position: 200% 0; } }
          - type: conditional
            conditions:
              - condition: state
                entity: assist_satellite.vaca_a203991c0
                state: processing
            grid_options: { columns: full, rows: auto }
            card:
              type: markdown
              content: "&nbsp;"
              card_mod:
                style: |
                  ha-card {
                    position: fixed !important; inset: auto 0 0 0 !important; z-index: 9;
                    height: 8px !important; min-height: 0 !important; max-height: 8px !important; padding: 0; overflow: hidden;
                    border: none; border-radius: 0;
                    background: linear-gradient(90deg, #ffb300, #ff6f00, #ffb300, #ff6f00);
                    background-size: 200% 100%;
                    animation: va-slide 1.2s linear infinite;
                  }
                  @keyframes va-slide { from { background-position: 0 0; } to { background-position: 200% 0; } }
          - type: conditional
            conditions:
              - condition: state
                entity: assist_satellite.vaca_a203991c0
                state: responding
            grid_options: { columns: full, rows: auto }
            card:
              type: markdown
              content: "&nbsp;"
              card_mod:
                style: |
                  ha-card {
                    position: fixed !important; inset: auto 0 0 0 !important; z-index: 9;
                    height: 8px !important; min-height: 0 !important; max-height: 8px !important; padding: 0; overflow: hidden;
                    border: none; border-radius: 0;
                    background: linear-gradient(90deg, #00e676, #00bfa5, #00e676, #00bfa5);
                    background-size: 200% 100%;
                    animation: va-slide 1.2s linear infinite;
                  }
                  @keyframes va-slide { from { background-position: 0 0; } to { background-position: 200% 0; } }
