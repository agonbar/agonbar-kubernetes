---
# node-autotaint
#
# Pragmatic homelab alternative to medik8s/node-healthcheck-operator.
# Watches all nodes; for any node with Ready=Unknown/False for longer than
# UNREADY_THRESHOLD_SECONDS, applies node.kubernetes.io/out-of-service=:NoExecute
# so the CSI/attach-detach controllers force-detach RWO volumes and
# Terminating pods get force-deleted. When a node returns to Ready=True,
# the taint is removed.
#
# This is the "Layer 1" automation discussed in the runbook
# `runbooks/node-out-of-service-taint.md`. Outgrowth path: replace with
# NHC + SNR (see `runbooks/node-healthcheck-operator-migration.md`).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-autotaint
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-autotaint
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-autotaint
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-autotaint
subjects:
  - kind: ServiceAccount
    name: node-autotaint
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-autotaint-script
  namespace: kube-system
data:
  reconcile.sh: |
    #!/bin/sh
    set -eu

    TAINT_KEY="node.kubernetes.io/out-of-service"
    UNREADY_THRESHOLD_SECONDS="${UNREADY_THRESHOLD_SECONDS:-300}"

    NOW=$(date -u +%s)

    kubectl get nodes -o json | jq -r '
      .items[] |
      . as $n |
      ($n.spec.taints // [] | map(select(.key=="'"$TAINT_KEY"'")) | length) as $has_taint |
      ($n.status.conditions[] | select(.type=="Ready")) as $cond |
      "\($n.metadata.name)\t\($cond.status)\t\($cond.lastTransitionTime | fromdateiso8601)\t\($has_taint)"
    ' | while IFS="$(printf '\t')" read -r name status transition_epoch has_taint; do
      age=$((NOW - transition_epoch))

      case "$status" in
        True)
          if [ "$has_taint" = "1" ]; then
            echo "[recover] $name is Ready; removing $TAINT_KEY taint"
            kubectl taint node "$name" "${TAINT_KEY}-" || true
          fi
          ;;
        Unknown|False)
          if [ "$age" -gt "$UNREADY_THRESHOLD_SECONDS" ] && [ "$has_taint" = "0" ]; then
            echo "[evict] $name Ready=$status for ${age}s (> $UNREADY_THRESHOLD_SECONDS); applying $TAINT_KEY"
            kubectl taint node "$name" "${TAINT_KEY}=:NoExecute" --overwrite || true
          else
            echo "[wait]  $name Ready=$status for ${age}s, taint_present=$has_taint"
          fi
          ;;
      esac
    done
---
# A long-running loop rather than a CronJob. The CronJob created and deleted a
# pod every 2 minutes, and every pod change makes the k3s network policy
# controller (kube-router) rebuild iptables and ipsets on every node, and made
# ArgoCD refresh this app ~25 times per run. On ovh02 that burst stalled the
# Satisfactory server's tick for 1-2 s every couple of minutes (measured
# 2026-10-20). The loop does the same check at the same cadence with no pod
# churn. The short tolerations move it off a dead node in ~30 s, so it is not
# stuck on the very node it has to taint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-autotaint
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-autotaint
  template:
    metadata:
      labels:
        app: node-autotaint
    spec:
      serviceAccountName: node-autotaint
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      containers:
        - name: reconcile
          image: alpine/k8s:1.30.0
          command:
            - /bin/sh
            - -c
            - while true; do /bin/sh /script/reconcile.sh || echo "reconcile failed"; sleep 120; done
          env:
            - name: UNREADY_THRESHOLD_SECONDS
              value: "300"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /script
      volumes:
        - name: script
          configMap:
            name: node-autotaint-script
            defaultMode: 0555
