apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # How often Argo CD polls Git. There is no GitHub webhook on this repo, so
  # this is the only way a push reaches the cluster. 1h (2026-07-08) left
  # commits undeployed for up to an hour; 5m keeps the poll cheaper than the
  # 3m default. The controller and repo-server read this at startup only:
  # after changing it, `kubectl -n argocd rollout restart
  # statefulset/argocd-application-controller deploy/argocd-repo-server`.
  # The repo-server also keeps the repo's ls-remote result in redis
  # (git-refs|<repo>) for this long, so a stale entry outlives the restart.
  timeout.reconciliation: 5m
  # Annotation tracking, the 3.x default. Switched on 2.14 first (2026-11-17)
  # so the 3.x upgrade itself does not also change how resources are tracked.
  application.resourceTrackingMethod: annotation
  # The v3.6.1 default resource.exclusions, minus core/v1 Endpoints:
  # deployments/lamg/herdr-web.yaml ships a hand-written Endpoints object that
  # ArgoCD has to keep managing. Re-copy the defaults on each minor upgrade.
  resource.exclusions: |
    ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter
    - apiGroups:
      - discovery.k8s.io
      kinds:
      - EndpointSlice
    ### Internal Kubernetes resources excluded reduce the number of watched events
    - apiGroups:
      - coordination.k8s.io
      kinds:
      - Lease
    ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
    - apiGroups:
      - authentication.k8s.io
      - authorization.k8s.io
      kinds:
      - SelfSubjectReview
      - TokenReview
      - LocalSubjectAccessReview
      - SelfSubjectAccessReview
      - SelfSubjectRulesReview
      - SubjectAccessReview
    ### Intermediate Certificate Request excluded reduce the number of watched events
    - apiGroups:
      - certificates.k8s.io
      kinds:
      - CertificateSigningRequest
    - apiGroups:
      - cert-manager.io
      kinds:
      - CertificateRequest
    ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumIdentity
      - CiliumEndpoint
      - CiliumEndpointSlice
    ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
    - apiGroups:
      - kyverno.io
      - reports.kyverno.io
      - wgpolicyk8s.io
      kinds:
      - PolicyReport
      - ClusterPolicyReport
      - EphemeralReport
      - ClusterEphemeralReport
      - AdmissionReport
      - ClusterAdmissionReport
      - BackgroundScanReport
      - ClusterBackgroundScanReport
      - UpdateRequest
