---
# Credencial de repositorio para ArgoCD. El argocd-repo-server corre en ovh02, y
# GitHub estrangula el git anonimo desde esa IP de datacenter: 2 de 10 ls-remote
# funcionaban, y repos ajenos fallaban igual, asi que no era ni el repo ni la
# frecuencia. Autenticado son 10 de 10.
#
# La etiqueta argocd.argoproj.io/secret-type: repository es lo que hace que ArgoCD
# mire este Secret. Sin ella existe y no sirve de nada.
#
# El token es un fine-grained PAT de solo lectura sobre repos publicos. Cuando
# caduque, ArgoCD NO dira que expiro: vuelve al camino anonimo y el sintoma sera
# "could not read Username for https://github.com". Rotarlo con
# scripts/wizard-argocd-github-token.sh
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: repo-github-agonbar-kubernetes
  namespace: argocd
spec:
  encryptedData:
    password: 
    type: 
    url: 
    username: 
  template:
    metadata:
      labels:
        argocd.argoproj.io/secret-type: repository
      name: repo-github-agonbar-kubernetes
      namespace: argocd
    type: Opaque
