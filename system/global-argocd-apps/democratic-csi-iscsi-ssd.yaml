apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: democratic-csi-iscsi-ssd
  namespace: argocd
spec:
  project: default
  source:
    chart: democratic-csi
    repoURL: https://democratic-csi.github.io/charts/
    targetRevision: 0.14.7
    helm:
      releaseName: democratic-csi-iscsi-ssd
      valuesObject:
        csiDriver:
          name: "org.democratic-csi.truenas-iscsi-ssd"

        storageClasses:
          - name: truenas-iscsi-ssd
            defaultClass: false
            reclaimPolicy: Delete
            volumeBindingMode: Immediate
            allowVolumeExpansion: true
            parameters:
              fsType: ext4
            mountOptions: []
            secrets:
              provisioner-secret:
              controller-publish-secret:
              node-stage-secret:
              node-publish-secret:
              controller-expand-secret:

        volumeSnapshotClasses:
          - name: truenas-iscsi-ssd
            deletionPolicy: Delete
            parameters: {}

        driver:
          existingConfigSecret: democratic-csi-iscsi-ssd-driver-config
          config:
            driver: freenas-api-iscsi

        node:
          priorityClassName: system-node-critical
          driver:
            resources: {requests: {cpu: 20m, memory: 96Mi}}
          driverRegistrar:
            resources: {requests: {cpu: 5m, memory: 10Mi}}
          tolerations:
            - key: dedicated
              operator: Equal
              value: media
              effect: NoSchedule

        # Requests measured 2026-10-22 (kubectl top --containers, max across nodes).
        # With none set these pods were BestEffort, the first thing the kubelet
        # evicts under memory pressure, and losing them takes every volume on the
        # node down. Priority keeps them ahead of the workloads they serve.
        controller:
          priorityClassName: system-cluster-critical
          driver:
            resources: {requests: {cpu: 10m, memory: 64Mi}}
          externalAttacher:
            resources: {requests: {cpu: 5m, memory: 16Mi}}
          externalProvisioner:
            resources: {requests: {cpu: 5m, memory: 16Mi}}
          externalResizer:
            resources: {requests: {cpu: 5m, memory: 32Mi}}
          externalSnapshotter:
            resources: {requests: {cpu: 5m, memory: 16Mi}}
        csiProxy:
          resources: {requests: {cpu: 2m, memory: 8Mi}}
  destination:
    name: in-cluster
    namespace: democratic-csi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - Validate=false
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m0s
