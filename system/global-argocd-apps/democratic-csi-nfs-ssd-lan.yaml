# LAN twin of democratic-csi-nfs-ssd. Same nas02, same SSD/k8s/nfs datasets,
# but reached over the wired LAN (192.168.0.29) instead of the tailscale
# address. Mirrors what democratic-csi-iscsi-ssd-lan did for iSCSI after the
# 2026-09-02 outage, where a tunnel stall aborted five ext4 journals at once.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: democratic-csi-nfs-ssd-lan
  namespace: argocd
spec:
  project: default
  source:
    chart: democratic-csi
    repoURL: https://democratic-csi.github.io/charts/
    targetRevision: 0.14.7
    helm:
      releaseName: democratic-csi-nfs-ssd-lan
      valuesObject:
        csiDriver:
          name: "org.democratic-csi.truenas-nfs-ssd-lan"
          fsGroupPolicy: File

        storageClasses:
          - name: truenas-nfs-ssd-lan
            defaultClass: false
            reclaimPolicy: Delete
            volumeBindingMode: Immediate
            allowVolumeExpansion: true
            parameters:
              fsType: nfs
            mountOptions:
              - noatime
              - nfsvers=4
            secrets:
              provisioner-secret:
              controller-publish-secret:
              node-stage-secret:
              node-publish-secret:
              controller-expand-secret:

        # The controller already runs external-snapshotter; without this class
        # nothing can take a VolumeSnapshot of an NFS volume, so the nightly job
        # could not cover them. Same shape as the iscsi classes.
        volumeSnapshotClasses:
          - name: truenas-nfs-ssd-lan
            deletionPolicy: Delete
            parameters: {}

        # The LAN address is only routable from lamg nodes, so both the controller
        # (which talks to the nas02 API) and the node plugin have to live there.
        # Without this the controller lands on ovh02 and every probe times out.
        # It also enforces that LAN volumes can only mount on lamg nodes, which is
        # exactly the intended invariant.
        controller:
          nodeSelector:
            svccontroller.k3s.cattle.io/lbpool: lamg

        node:
          nodeSelector:
            svccontroller.k3s.cattle.io/lbpool: lamg
          tolerations:
            - key: dedicated
              operator: Equal
              value: media
              effect: NoSchedule

        driver:
          existingConfigSecret: democratic-csi-nfs-ssd-lan-driver-config
          config:
            driver: freenas-api-nfs
  destination:
    name: in-cluster
    namespace: democratic-csi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - Validate=false
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m0s
