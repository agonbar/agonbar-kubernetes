# Nightly mariadb-dump of desguace-staging (the desguaces-sandias staging shop,
# applied by hand from that project's staging-k8s.yaml). Replaces the file-level
# copy of its db-data PVC in backup.yaml: a live MariaDB datadir copied with rsync
# over NFS-over-tailnet from ovh02 never finished inside the job's 1 h deadline,
# and InnoDB rewrites its .ibd files so the copy never converged either.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: desguace-db-dump
  namespace: desguace-staging
spec:
  # 03:20, between dawarich (03:05) / immich (03:15) and the PVC run at 04:00.
  schedule: "20 3 * * *"
  timeZone: Europe/Madrid
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          # LAN pool, which reaches the NAS on 192.168.0.29 directly.
          nodeSelector:
            svccontroller.k3s.cattle.io/lbpool: lamg
          containers:
            - name: dump
              # Same image as the server, so mariadb-dump matches its version.
              image: mariadb:11.4
              env:
                - name: MARIADB_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db
                      key: MARIADB_ROOT_PASSWORD
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  dir=/backup/desguace-staging/db-dump
                  mkdir -p "$dir"
                  rm -f "$dir"/*.tmp
                  out="$dir/desguace-$(date +%Y%m%d-%H%M%S).sql.gz"
                  # ps_layered_filter_block is the faceted-search module's cache
                  # (70 GB of the 72 GB database on 2026-11-26) and the module
                  # rebuilds it: keep its structure, skip its rows.
                  cache=prestashop.ps_layered_filter_block
                  { mariadb-dump -h db -uroot -p"$MARIADB_ROOT_PASSWORD" \
                      --single-transaction --routines --events --all-databases \
                      --ignore-table="$cache" --skip-dump-date
                    mariadb-dump -h db -uroot -p"$MARIADB_ROOT_PASSWORD" --no-data \
                      prestashop ps_layered_filter_block
                  } | gzip > "$out.tmp"
                  # Each dump ends with a completion trailer; one cut short does not.
                  # Two dumps went in, so two trailers or the file is refused.
                  [ "$(zcat "$out.tmp" | grep -c '^-- Dump completed')" = 2 ] || {
                    echo "FATAL: $out.tmp is incomplete"; rm -f "$out.tmp"; exit 1; }
                  mv "$out.tmp" "$out"
                  echo "ok -> $out ($(stat -c %s "$out") bytes)"
                  find "$dir" -name 'desguace-*.sql.gz' -mtime +14 -print -delete
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: backup
              nfs:
                server: 192.168.0.29
                path: /mnt/RAID/docker/backups-iscsi
