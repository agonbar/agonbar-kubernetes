apiVersion: v1
kind: Namespace
metadata:
  name: backup
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pvc-backup
  namespace: backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pvc-backup
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["create", "delete", "get", "list", "watch"]
  # Read-only: the script checks a VolumeSnapshotClass exists before using it,
  # so a class typo or a driver that was never installed fails loudly instead of
  # producing a snapshot nobody can restore.
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pvc-backup
subjects:
  - kind: ServiceAccount
    name: pvc-backup
    namespace: backup
roleRef:
  kind: ClusterRole
  name: pvc-backup
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-script
  namespace: backup
data:
  backup.sh: |
    #!/bin/sh
    set -e

    NFS_SERVER="192.168.0.29"
    # Misma maquina (nas02), la otra pata. Los volumenes local-path viven todos en
    # ovh02, que no enruta a 192.168.0.29 en absoluto: el 2049 se rechaza desde
    # alli y esta abierto en 100.72.0.41. Solo lo usa backup_local_path_pvc.
    NFS_SERVER_TAILNET="100.72.0.41"
    NFS_BACKUP_PATH="/mnt/RAID/docker/backups-iscsi"
    TIMESTAMP=$(date +%Y%m%d-%H%M%S)
    FAILED=0

    # The snapshot class is derived per-PVC below, never hardcoded. It used to be
    # a global "truenas-iscsi-ssd", which silently produced unrestorable backups
    # for the 17 PVCs on truenas-iscsi-ssd-lan: the snapshot succeeds and reports
    # readyToUse (both drivers reach the same nas02 pool), but restoring it into
    # the volume's own class fails with "snapshot ... not bound", because the
    # provisioner will not accept a dataSource from a different driver. Found
    # 2026-09-01 while trying to recover tachidesk, which is exactly when you do
    # not want to discover it.

    # Optional: BACKUP_ONLY="ns/pvc ns/pvc" runs just those, so a single volume
    # can be re-run on demand instead of sitting through the whole 8h sweep.
    BACKUP_ONLY="${BACKUP_ONLY:-}"

    # Per-PVC rsync deadline. plex-config is ~166k small files over NFS and does
    # not finish in 90 minutes, which failed the whole run every night.
    deadline_for() {
      case "$1/$2" in
        lamg/plex-config-lan) echo 18000 ;;
        *)                echo 5400 ;;
      esac
    }

    # Per-PVC rsync excludes. Everything listed here is regenerated by the app on
    # next start, so copying it nightly buys nothing and costs most of the files.
    excludes_for() {
      case "$1/$2" in
        lamg/plex-config-lan)
          echo "--exclude=Cache --exclude='Crash Reports' --exclude=Logs --exclude=Diagnostics --exclude=Updates"
          ;;
        *) echo "" ;;
      esac
    }

    # Retention must run even when the backup fails: a PVC that errors every
    # night (deleted PVC, snapshot never ready) would otherwise never be pruned
    # and leaks snapshots forever.
    enforce_retention() {
      NS="$1"
      PVC="$2"
      echo "[${NS}/${PVC}] Enforcing snapshot retention (keep last 7)..."
      SNAPS=$(kubectl get volumesnapshots -n "${NS}" \
        --sort-by=.metadata.creationTimestamp \
        -o jsonpath='{.items[?(@.spec.source.persistentVolumeClaimName=="'"${PVC}"'")].metadata.name}')
      COUNT=0
      TOTAL=0
      for s in $SNAPS; do TOTAL=$((TOTAL + 1)); done
      for s in $SNAPS; do
        COUNT=$((COUNT + 1))
        if [ $((TOTAL - COUNT)) -ge 7 ]; then
          echo "[${NS}/${PVC}] Deleting old snapshot: ${s}"
          kubectl delete volumesnapshot "${s}" -n "${NS}" 2>/dev/null || true
        fi
      done
    }

    backup_pvc() {
      NS="$1"
      PVC="$2"
      SNAP_NAME="backup-${PVC}-${TIMESTAMP}"
      TEMP_PVC="backup-temp-${PVC}"
      JOB_NAME="backup-rsync-${PVC}"

      if [ -n "${BACKUP_ONLY}" ]; then
        case " ${BACKUP_ONLY} " in
          *" ${NS}/${PVC} "*) ;;
          *) return ;;
        esac
      fi

      echo "=== [${NS}/${PVC}] Starting backup ==="

      # The snapshot and the temp PVC must both use the source PVC's own class,
      # or the temp PVC binds but the snapshot is useless for a real restore.
      SNAPSHOT_CLASS=$(kubectl get pvc "${PVC}" -n "${NS}" \
        -o jsonpath='{.spec.storageClassName}' 2>/dev/null)
      if [ -z "${SNAPSHOT_CLASS}" ]; then
        echo "[${NS}/${PVC}] ERROR: PVC not found or has no storageClassName, skipping"
        FAILED=1
        return
      fi
      if ! kubectl get volumesnapshotclass "${SNAPSHOT_CLASS}" >/dev/null 2>&1; then
        echo "[${NS}/${PVC}] ERROR: no VolumeSnapshotClass named ${SNAPSHOT_CLASS}, skipping"
        FAILED=1
        return
      fi
      echo "[${NS}/${PVC}] class: ${SNAPSHOT_CLASS}"

      RSYNC_DEADLINE=$(deadline_for "${NS}" "${PVC}")
      RSYNC_EXCLUDES=$(excludes_for "${NS}" "${PVC}")

      # cleanup any leftover resources from previous failed runs
      kubectl delete job "${JOB_NAME}" -n "${NS}" --ignore-not-found 2>/dev/null || true
      kubectl delete pvc "${TEMP_PVC}" -n "${NS}" --ignore-not-found 2>/dev/null || true

      # 1. create snapshot
      echo "[${NS}/${PVC}] Creating snapshot ${SNAP_NAME}..."
      cat <<SNAP_EOF | kubectl apply -f -
    apiVersion: snapshot.storage.k8s.io/v1
    kind: VolumeSnapshot
    metadata:
      name: ${SNAP_NAME}
      namespace: ${NS}
    spec:
      volumeSnapshotClassName: ${SNAPSHOT_CLASS}
      source:
        persistentVolumeClaimName: ${PVC}
    SNAP_EOF

      # 2. wait for snapshot ready
      echo "[${NS}/${PVC}] Waiting for snapshot to be ready..."
      if ! kubectl wait "volumesnapshot/${SNAP_NAME}" -n "${NS}" \
        --for=jsonpath='{.status.readyToUse}'=true --timeout=300s; then
        echo "[${NS}/${PVC}] ERROR: Snapshot not ready, skipping"
        kubectl delete volumesnapshot "${SNAP_NAME}" -n "${NS}" --ignore-not-found 2>/dev/null || true
        FAILED=1
        enforce_retention "${NS}" "${PVC}"
        return
      fi

      # 3. get restore size
      RESTORE_SIZE=$(kubectl get volumesnapshot "${SNAP_NAME}" -n "${NS}" \
        -o jsonpath='{.status.restoreSize}')
      echo "[${NS}/${PVC}] Snapshot ready, restore size: ${RESTORE_SIZE}"

      # 4. create temp PVC from snapshot
      cat <<PVC_EOF | kubectl apply -f -
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ${TEMP_PVC}
      namespace: ${NS}
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: ${SNAPSHOT_CLASS}
      resources:
        requests:
          storage: ${RESTORE_SIZE}
      dataSource:
        name: ${SNAP_NAME}
        kind: VolumeSnapshot
        apiGroup: snapshot.storage.k8s.io
    PVC_EOF

      # 5. wait for temp PVC bound
      echo "[${NS}/${PVC}] Waiting for temp PVC to be bound..."
      if ! kubectl wait "pvc/${TEMP_PVC}" -n "${NS}" \
        --for=jsonpath='{.status.phase}'=Bound --timeout=300s; then
        echo "[${NS}/${PVC}] ERROR: Temp PVC not bound, cleaning up"
        kubectl delete pvc "${TEMP_PVC}" -n "${NS}" --ignore-not-found 2>/dev/null || true
        kubectl delete volumesnapshot "${SNAP_NAME}" -n "${NS}" --ignore-not-found 2>/dev/null || true
        FAILED=1
        enforce_retention "${NS}" "${PVC}"
        return
      fi

      # 6. create rsync job
      echo "[${NS}/${PVC}] Starting rsync job..."
      cat <<JOB_EOF | kubectl apply -f -
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: ${JOB_NAME}
      namespace: ${NS}
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: ${RSYNC_DEADLINE}
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: rsync
              image: alpine:latest
              command:
                - sh
                - -c
                - |
                  # set -e matters more than it looks: this used to end on
                  # echo "Backup complete", so the container exited 0 whatever
                  # rsync did. lamg/plex-config reported a green backup every
                  # night while its destination sat unchanged since 2026-07-30.
                  set -e
                  apk add --no-cache rsync
                  mkdir -p "/backup/${NS}/${PVC}"
                  set +e
                  rsync -av --delete ${RSYNC_EXCLUDES} /source/ "/backup/${NS}/${PVC}/"
                  # \$ escapado a proposito: este heredoc NO lleva comillas, asi
                  # que sin la barra el shell de FUERA se come estas tres lineas al
                  # generar el Job. Se generaba "RC=0 / echo rsync exit= / exit", y
                  # exit sin argumento devuelve el codigo del echo, o sea 0.
                  # El set -e de arriba no salva nada porque hay un set +e
                  # justo antes del rsync. Resultado: el fallo que este bloque
                  # dice haber arreglado seguia vivo, solo que una capa mas abajo.
                  RC=\$?
                  echo "rsync exit=\${RC}"
                  exit \${RC}
              volumeMounts:
                - name: source
                  mountPath: /source
                  readOnly: true
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "2"
                  # 256Mi was tight for a 165k-file tree; an OOM-killed rsync
                  # was indistinguishable from a successful one before set -e.
                  memory: 1Gi
          volumes:
            - name: source
              persistentVolumeClaim:
                claimName: ${TEMP_PVC}
            - name: backup
              nfs:
                server: ${NFS_SERVER}
                path: ${NFS_BACKUP_PATH}
          nodeSelector:
            svccontroller.k3s.cattle.io/lbpool: lamg
    JOB_EOF

      # 7. wait for rsync job
      echo "[${NS}/${PVC}] Waiting for rsync to complete..."
      if ! kubectl wait "job/${JOB_NAME}" -n "${NS}" \
        --for=condition=complete --timeout="${RSYNC_DEADLINE}s"; then
        echo "[${NS}/${PVC}] ERROR: Rsync job failed"
        FAILED=1
      fi

      # 8. cleanup temp resources (keep the snapshot for quick restores)
      echo "[${NS}/${PVC}] Cleaning up temp resources..."
      kubectl delete job "${JOB_NAME}" -n "${NS}" --ignore-not-found 2>/dev/null || true
      kubectl delete pvc "${TEMP_PVC}" -n "${NS}" --ignore-not-found 2>/dev/null || true

      # 9. retention: keep only last 7 snapshots per PVC, delete older ones
      enforce_retention "${NS}" "${PVC}"

      echo "=== [${NS}/${PVC}] Backup finished ==="
    }

    # local-path no tiene snapshotter CSI, asi que el baile de snapshot + PVC
    # temporal de arriba no sirve. Estos volumenes son un directorio normal en un
    # nodo concreto, asi que se copian montando la claim directamente: el PV de
    # local-path lleva nodeAffinity, y eso clava el Job en el nodo que tiene los
    # datos sin que haya que averiguar cual es.
    #
    # No hace falta parar la app: local-path es RWO por nodo, y el pod de la app y
    # este Job conviven en la misma maquina.
    backup_local_path_pvc() {
      NS="$1"
      PVC="$2"
      JOB_NAME="backup-local-${PVC}"

      if [ -n "${BACKUP_ONLY}" ]; then
        case " ${BACKUP_ONLY} " in
          *" ${NS}/${PVC} "*) ;;
          *) return ;;
        esac
      fi

      echo "=== [${NS}/${PVC}] Starting local-path backup ==="

      # Si alguna vez vuelve a una clase CSI tiene que ir por backup_pvc, que si
      # hace snapshot. Copiarlo aqui en silencio seria perder esa copia sin avisar.
      SC=$(kubectl get pvc "${PVC}" -n "${NS}" -o jsonpath='{.spec.storageClassName}' 2>/dev/null)
      if [ "${SC}" != "local-path" ]; then
        echo "[${NS}/${PVC}] ERROR: expected local-path, got '${SC}'; use backup_pvc"
        FAILED=1
        return
      fi

      kubectl delete job "${JOB_NAME}" -n "${NS}" --ignore-not-found >/dev/null 2>&1 || true
      cat <<LOCAL_EOF | kubectl apply -f -
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: ${JOB_NAME}
      namespace: ${NS}
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: alpine:latest
              command:
                - sh
                - -c
                - |
                  set -e
                  apk add --no-cache rsync sqlite
                  DEST="/backup/${NS}/${PVC}"
                  mkdir -p "\$DEST"
                  set +e
                  # Las SQLite se excluyen aqui y se copian abajo con sqlite3.
                  # --delete no toca en destino lo que esta excluido, asi que los
                  # .db que deja sqlite3 sobreviven a la pasada siguiente.
                  rsync -av --delete --exclude='*.db' --exclude='*.db-wal' --exclude='*.db-shm' /source/ "\$DEST/"
                  RC=\$?
                  echo "rsync exit=\$RC"
                  [ \$RC -eq 0 ] || exit \$RC
                  # Copiar en crudo una SQLite viva con WAL da un fichero que
                  # restaura como "malformed", que es justo el estado del que hubo
                  # que sacar houndarr. El dot-command .backup si es consistente en
                  # caliente (nada de backticks en este heredoc: lo ejecuta el shell
                  # de fuera al generar el Job) y
                  # ahorra tener que parar el servicio cada noche.
                  for db in /source/*.db; do
                    [ -e "\$db" ] || continue
                    echo "sqlite backup: \$(basename "\$db")"
                    sqlite3 "\$db" ".backup '\$DEST/\$(basename "\$db")'" || exit 1
                  done
                  exit 0
              volumeMounts:
                - name: source
                  mountPath: /source
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
          volumes:
            - name: source
              persistentVolumeClaim:
                claimName: ${PVC}
            - name: backup
              nfs:
                server: ${NFS_SERVER_TAILNET}
                path: ${NFS_BACKUP_PATH}
    LOCAL_EOF

      # Sondeo en vez de `kubectl wait --for=condition=complete`: con backoffLimit 0
      # un Job que falla en 30 s dejaria a wait esperando su timeout entero, y son
      # tres volumenes. Aqui un fallo se ve en cuanto ocurre.
      echo "[${NS}/${PVC}] Waiting for local-path backup..."
      END=$(( $(date +%s) + 3660 ))
      DONE=""
      while [ "$(date +%s)" -lt "${END}" ]; do
        CONDS=$(kubectl get job "${JOB_NAME}" -n "${NS}" \
          -o jsonpath='{.status.conditions[?(@.status=="True")].type}' 2>/dev/null)
        case "${CONDS}" in
          *Complete*) DONE="ok"; break ;;
          *Failed*)   DONE="fail"; break ;;
        esac
        sleep 10
      done
      if [ "${DONE}" != "ok" ]; then
        echo "[${NS}/${PVC}] ERROR: local-path backup ${DONE:-timed out}"
        kubectl logs "job/${JOB_NAME}" -n "${NS}" --tail=20 2>/dev/null || true
        FAILED=1
      fi

      kubectl delete job "${JOB_NAME}" -n "${NS}" --ignore-not-found >/dev/null 2>&1 || true
      echo "=== [${NS}/${PVC}] Backup finished ==="
    }

    echo "========================================="
    echo "PVC Backup Run - ${TIMESTAMP}"
    echo "========================================="

    # agonbar namespace
    backup_pvc agonbar homarr-appdata
    backup_pvc agonbar minio-data
    backup_pvc agonbar paperless-redis
    backup_pvc agonbar paperless-data
    backup_pvc agonbar reactive-resume-postgres
    backup_pvc agonbar reactive-resume-uploads

    # dawarich namespace
    backup_pvc dawarich dawarich-db-data

    # games namespace
    backup_pvc games enshrouded-data
    backup_pvc games factorio-data
    # local-path: sin snapshotter CSI, van por backup_local_path_pvc. Los tres
    # viven en ovh02 y hasta 2026-09-02 no tenian ninguna copia.
    backup_local_path_pvc games palworld-data
    backup_local_path_pvc games satisfactory-data

    # OJO: estos nombres son PVC concretos, no descubrimiento automatico. Al mover
    # un volumen de clase (2026-09-02: los cuatro `-lan`) hay que cambiarlos aqui
    # tambien. El PVC viejo sobrevive como rollback, asi que si no se toca esto el
    # backup copia el volumen congelado y da verde. Y ojo con los `case` de
    # deadline_for y excludes_for de arriba, que van por nombre.

    # immich namespace
    backup_pvc immich immich-db-data-lan

    # knowledge namespace
    backup_pvc knowledge vault-data
    backup_pvc knowledge vault-state

    # trek namespace
    backup_pvc trek trek-data
    backup_pvc trek trek-uploads

    # lamg namespace
    backup_pvc lamg homeassistant-config-lan
    backup_pvc lamg influxdb-data
    backup_pvc lamg plex-config-lan
    backup_pvc lamg scrutiny-config
    backup_pvc lamg vscode-config-lan
    backup_pvc lamg zigbee2mqtt-config

    # piracy namespace
    backup_pvc piracy anisub-data
    backup_pvc piracy bazarr-config
    backup_pvc piracy cruncharr-config
    backup_pvc piracy emulerr-config
    # houndarr salio de iSCSI a local-path el 2026-09-02 (f2da258) porque su
    # SQLite se corrompio dos veces. El PVC viejo `houndarr-data` sigue existiendo
    # y ya no lo monta nadie: seguir copiandolo daria verde sobre datos congelados.
    # Lo critico aqui no es solo houndarr.db, es houndarr.masterkey (44 bytes), que
    # cifra las credenciales: sin el, restaurar la base de datos no sirve de nada.
    backup_local_path_pvc piracy houndarr-data-local
    backup_pvc piracy jellyfin-config
    backup_pvc piracy lidarr-config
    backup_pvc piracy prowlarr-config
    backup_pvc piracy qbittorrent-config
    backup_pvc piracy qui-config
    backup_pvc piracy radarr-config
    backup_pvc piracy seerr-config
    backup_pvc piracy slskd-config
    backup_pvc piracy sonarr-config
    backup_pvc piracy soularr-config
    backup_pvc piracy tachidesk-data
    backup_pvc piracy tdarr-config
    backup_pvc piracy tdarr-server

    echo "========================================="
    if [ "$FAILED" -eq 1 ]; then
      echo "BACKUP COMPLETED WITH ERRORS"
      exit 1
    else
      echo "ALL BACKUPS COMPLETED SUCCESSFULLY"
    fi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-backup
  namespace: backup
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 28800
      template:
        spec:
          serviceAccountName: pvc-backup
          restartPolicy: Never
          containers:
            - name: backup
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - /scripts/backup.sh
              volumeMounts:
                - name: script
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: backup-script
                defaultMode: 0755
