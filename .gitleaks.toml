# gitleaks config for this public repo. Used by .githooks/pre-commit and by CI.
# Default rules, plus one allowlist: SealedSecret ciphertext. Those values only
# decrypt with the cluster's sealing key, so they are meant to live in git.
[extend]
useDefault = true

[[allowlists]]
description = "SealedSecret encryptedData values (ciphertext starts with Ag)"
regexTarget = "line"
regexes = ['''^\s*[\w.-]+:\s*Ag[A-Za-z0-9+/]{200,}={0,2}\s*$''']
