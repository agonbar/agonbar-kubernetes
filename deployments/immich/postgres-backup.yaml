# The immich database used to be covered by the nightly VolumeSnapshot in
# system/snapshots/backup.yaml. It moved to local-path on 2026-09-23 and
# local-path has no CSI snapshotter, so the backup has to be logical from here
# on. This is that backup. If this CronJob stops running, nothing else is
# holding a copy of the database.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-pg-backups
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-nfs-raid
  resources:
    requests:
      storage: 10Gi

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-postgres-backup
  namespace: immich
  labels:
    app: immich-postgres-backup
spec:
  # 03:15, ahead of piracy-postgres-backup at 03:30 and the PVC snapshots at
  # 04:00, so the three do not compete for the same NAS at the same minute.
  schedule: "15 3 * * *"
  timeZone: Europe/Madrid
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          # Pin to the pool, never to a single host: piracy's backup died
          # unnoticed for four days in August 2026 because it named nas00 and
          # nas00 went NotReady.
          nodeSelector:
            svccontroller.k3s.cattle.io/lbpool: lamg
          containers:
            - name: pg-dump
              # Same major as the server. The client only has to be >= the
              # server, but matching it means the dump is exactly what the
              # immich postgres image would produce itself.
              image: postgres:14
              imagePullPolicy: IfNotPresent
              env:
                - name: PGHOST
                  value: postgre.immich.svc.cluster.local
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: immich
                      key: dbUser
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich
                      key: dbPassword
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  ts="$(date +%Y%m%d-%H%M%S)"
                  out="/backups/immich-${ts}.dump"
                  check=immich_restorecheck

                  cleanup() { psql -d postgres -qc "DROP DATABASE IF EXISTS $check" >/dev/null 2>&1 || true; }
                  trap cleanup EXIT

                  # Custom format, not plain SQL, because this database cannot be
                  # restored as a straight psql replay. See the TOC filter below.
                  pg_dump --dbname=immich -Fc -f "$out"

                  # The only honest test of a backup is restoring it, and at 12MB
                  # that costs seconds. immich's own DatabaseBackup job was failing
                  # silently since at least March 2026 -- the evidence is a row in
                  # this very database -- and nobody noticed, because nothing ever
                  # tried to read a dump back.
                  #
                  # The filter drops TOC entries for types whose name starts with
                  # an underscore. Postgres reserves that prefix for the array type
                  # it creates alongside every table, and this database carries one
                  # -- _naturalearth_countries -- whose element type was dropped out
                  # from under it by an old geodata migration. pg_dump emits it as a
                  # standalone base type that refers to itself, so the restore dies
                  # on `type "_naturalearth_countries" does not exist`. The catalog
                  # row is deliberately left alone; removing it means deleting from
                  # pg_depend by hand on the live photo database.
                  pg_restore --list "$out" \
                    | grep -vE "^[0-9]+; [0-9]+ [0-9]+ TYPE [^ ]+ _" > "/tmp/toc-${ts}.list"

                  psql -d postgres -qc "DROP DATABASE IF EXISTS $check" >/dev/null
                  psql -d postgres -qc "CREATE DATABASE $check" >/dev/null
                  pg_restore --use-list "/tmp/toc-${ts}.list" -d "$check" \
                    --single-transaction --exit-on-error "$out"

                  n=$(psql -d "$check" -tAc "select count(*) from asset")
                  v=$(psql -d "$check" -tAc "select count(*) from pg_extension where extname='vchord'")
                  [ "$n" -gt 0 ] && [ "$v" = "1" ] || {
                    echo "FATAL: restored $out has assets=$n vchord=$v"; rm -f "$out"; exit 1; }
                  # du reports allocated blocks, and this NFS export answers 512
                  # for every file regardless of size. Ask for the real length.
                  echo "ok -> $out ($(stat -c %s "$out") bytes), restore verified: $n assets"

                  find /backups -name 'immich-*.dump' -mtime +14 -print -delete
                  echo "=== current backups ==="; ls -lh /backups

                  # RESTORE, into a postgres running the immich image:
                  #   pg_restore --list immich-<ts>.dump \
                  #     | grep -vE "^[0-9]+; [0-9]+ [0-9]+ TYPE [^ ]+ _" > toc.list
                  #   pg_restore --use-list toc.list -d immich \
                  #     --single-transaction --exit-on-error immich-<ts>.dump
                  # That is the same pair of commands this job runs every night
                  # against a scratch database, so it is known to work.
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
              volumeMounts:
                - mountPath: /backups
                  name: backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: immich-pg-backups
