apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: machine-learning
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
  annotations:
    keel.sh/pollSchedule: "@every 72h"
  name: machine-learning
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: machine-learning 
  template:
    metadata:
      labels:
        app: machine-learning 
    spec:
      containers:
        - image: ghcr.io/immich-app/immich-machine-learning:v3.0.3
          name: machine-learning 
          env:
            - name: DB_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: immich
                  key: dbHost
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: immich
                  key: dbUser
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich
                  key: dbPassword
            - name: DB_DATABASE_NAME
              value: "immich"
            - name: REDIS_HOSTNAME
              value: "redis"
            - name: LOG_LEVEL
              value: "simple"
            - name: MACHINE_LEARNING_PORT
              value: "3003"
          ports:
            - containerPort: 3003
              name: machinelearning 
              protocol: TCP
          volumeMounts:
            - name: upload
              mountPath: /usr/src/app/upload
            - name: cache
              mountPath: /cache
          resources:
            requests:
              # Measured 2026-09-02: 3m CPU / 238Mi at rest. It is a model server,
              # so it climbs past a core while inferring; this is sized for that,
              # not for idle. The old 5m/30Mi was not a request, it was a lie to
              # the scheduler, and it is why this landed on nas00 and starved it.
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: upload
          nfs:
            server: 192.168.0.29
            path: /mnt/RAID/docker/immich/upload
        - name: cache
          nfs:
            server: 192.168.0.29
            path: /mnt/RAID/docker/immich/models
      # nas00 is 2 cores / 3.4Gi and cannot host anything real. On 2026-09-02 this
      # pod pushed it under the 250Mi eviction threshold; the kubelet evicted the
      # democratic-csi iscsi-ssd-lan controller, home-assistant's volume flipped to
      # read-only, and HA was down for three hours. Same reason as the affinity
      # server and postgre already carry (6d20abb).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nas00
      nodeSelector:
        svccontroller.k3s.cattle.io/lbpool: lamg

---
kind: Service
apiVersion: v1
metadata:
  name: machine-learning 
  namespace: immich
spec:
  type: NodePort

  selector:
    app: machine-learning 

  ports:
    - protocol: TCP
      port: 3003
      targetPort: 3003
      name: machinelearning



