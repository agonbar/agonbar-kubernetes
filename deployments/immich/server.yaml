apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: server
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
  annotations:
    keel.sh/pollSchedule: "@every 72h"
  name: server
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server 
  template:
    metadata:
      labels:
        app: server 
    spec:
      containers:
        - image: ghcr.io/immich-app/immich-server:v3.0.3
          name: server 
          # command: ["/bin/sh"]
          # args: ["./start-server.sh"]
          securityContext:
            runAsUser: 950
            runAsGroup: 950
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOSTNAME
              value: "postgre.immich.svc.cluster.local"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: immich
                  key: dbUser
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich
                  key: dbPassword
            - name: DB_DATABASE_NAME
              value: "immich"
            - name: REDIS_HOSTNAME
              value: "redis.immich.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: LOG_LEVEL
              value: "log"
            - name: IMMICH_PORT
              value: "2283"
            # The ML Service in this namespace is called "machine-learning", but
            # immich defaults to "http://immich-machine-learning:3003" (see
            # server/dist/config.js). Without this the server logs "Machine
            # learning server became unhealthy" and silently skips smart search
            # and face detection.
            - name: IMMICH_MACHINE_LEARNING_URL
              value: "http://machine-learning.immich.svc.cluster.local:3003"
          ports:
            - containerPort: 2283
              name: server 
              protocol: TCP
          volumeMounts:
            - name: upload
              mountPath: /usr/src/app/upload
          resources:
            requests:
              # Measured 2026-09-01: 18m CPU / 647Mi at rest, and ~820m CPU
              # while the geodata import runs at boot. The old 5m/30Mi made the
              # scheduler treat this pod as free, which is how it landed on
              # nas00 and pinned that box at 100% CPU with load 22.
              cpu: 100m
              memory: 768Mi
      volumes:
        - name: upload
          nfs:
            server: 192.168.0.29
            path: /mnt/RAID/docker/immich/upload
      # nas00 is 2 cores / 3.4Gi and flaps under load; homeassistant already
      # keeps off it for the same reason. On 2026-09-01 immich landed there and
      # saturated the node, which starved the democratic-csi node pods until
      # every CSI driver deregistered and no volume on nas00 could mount.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nas00
      nodeSelector:
        svccontroller.k3s.cattle.io/lbpool: lamg

---
kind: Service
apiVersion: v1
metadata:
  name: server 
  namespace: immich
spec:
  type: NodePort
  selector:
    app: server 
  ports:
    - protocol: TCP
      port: 2283
      targetPort: 2283
      name: server
---
kind: Service
apiVersion: v1
metadata:
  name: server-lb
  namespace: immich
spec:
  type: LoadBalancer
  selector:
    app: server 
  ports:
    - protocol: TCP
      port: 2283
      targetPort: 2283
      name: server

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-https
  namespace: immich
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: immich.${BASE_DOMAIN}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: server
                port:
                  number: 2283
  tls:
    - secretName: immich.${BASE_DOMAIN}
      hosts:
        - immich.${BASE_DOMAIN}

