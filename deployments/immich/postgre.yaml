apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: postgre
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
  annotations:
    keel.sh/pollSchedule: "@every 72h"
  name: postgre
  namespace: immich
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: postgre
  template:
    metadata:
      labels:
        app: postgre
    spec:
      containers:
        - image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3
          securityContext:
            runAsUser: 950
          name: postgre
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich
                  key: dbPassword
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: immich
                  key: dbUser
            - name: POSTGRES_DB
              value: immich
            # initdb args only apply the first time a data directory is created,
            # and this cluster predates the line: it ran with checksums off until
            # 2026-09-23, when scripts/pg-enable-checksums.sh turned them on
            # offline. Do not read this env as proof they are on -- read
            # `pg_controldata -D /var/lib/postgresql/data | grep checksum`.
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            - name: DB_STORAGE_TYPE
              value: "SSD"
            - name: PG_DATA
              value: /var/lib/postgresql/data
          ports:
            - containerPort: 5432
              name: postgre
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              # Measured 2026-09-01: 8m CPU / 104Mi at rest. Same reason as the
              # server: 5m/30Mi is not a request, it is a lie to the scheduler.
              cpu: 50m
              memory: 256Mi
      securityContext:
        fsGroup: 950
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-db-data-local
      # The data is a local-path volume, so it exists on exactly one node and the
      # pod has to follow it. The label says what the node gives us -- a local
      # disk this database can live on -- instead of naming the box. nas00 has
      # no business carrying it either way: it is 2 cores / 3.4Gi and flaps under
      # load (see server.yaml for the day it took the CSI drivers down with it).
      nodeSelector:
        storage/local-db: "true"

---
kind: Service
apiVersion: v1
metadata:
  name: postgre
  namespace: immich
spec:
  type: NodePort

  selector:
    app: postgre 

  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
      name: postgre

---
# The live database, on the local disk of the node labelled storage/local-db.
# No iSCSI, no NFS, no portal to stall: the only way this volume goes away is
# with the node itself. That trades the daily VolumeSnapshot for a pg_dump,
# which postgres-backup.yaml takes over -- local-path has no snapshot support.
#
# 10Gi is a label, not a limit. local-path is a bind mount off the node's
# filesystem and enforces nothing; the database measured 497Mi at the move.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-db-data-local
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
