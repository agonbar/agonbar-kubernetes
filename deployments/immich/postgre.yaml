apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: postgre
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
  annotations:
    keel.sh/pollSchedule: "@every 72h"
  name: postgre
  namespace: immich
spec:
  strategy:
    type: Recreate
  replicas: 0
  selector:
    matchLabels:
      app: postgre
  template:
    metadata:
      labels:
        app: postgre
    spec:
      containers:
        - image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3
          securityContext:
            runAsUser: 950
          name: postgre
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich
                  key: dbPassword
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: immich
                  key: dbUser
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            - name: DB_STORAGE_TYPE
              value: "SSD"
            - name: PG_DATA
              value: /var/lib/postgresql/data
          ports:
            - containerPort: 5432
              name: postgre
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              # Measured 2026-09-01: 8m CPU / 104Mi at rest. Same reason as the
              # server: 5m/30Mi is not a request, it is a lie to the scheduler.
              cpu: 50m
              memory: 256Mi
      securityContext:
        fsGroup: 950
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-db-data-lan
      # nas00 is 2 cores / 3.4Gi and flaps under load; homeassistant already
      # keeps off it for the same reason. On 2026-09-01 immich landed there and
      # saturated the node, which starved the democratic-csi node pods until
      # every CSI driver deregistered and no volume on nas00 could mount.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nas00
      nodeSelector:
        svccontroller.k3s.cattle.io/lbpool: lamg

---
kind: Service
apiVersion: v1
metadata:
  name: postgre
  namespace: immich
spec:
  type: NodePort

  selector:
    app: postgre 

  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
      name: postgre

---
# Rollback for the 2026-09-02 storage class migration: holds the data as it was
# before the cutover. Nothing mounts it. Kept declared on purpose, because ArgoCD
# prunes what leaves git. Delete this block once the -lan volume has proven itself.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-db-data
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-ssd
  resources:
    requests:
      storage: 5Gi

---
# Moved off truenas-iscsi-ssd on 2026-09-02, same reason as
# homeassistant-config: that class reaches nas02 over tailscale and a 120s
# tunnel stall aborts the ext4 journal. This one takes the LAN path to the
# same box. See deployments/lamg/homeassistant.yaml for the full story.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-db-data-lan
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-ssd-lan
  resources:
    requests:
      storage: 5Gi
