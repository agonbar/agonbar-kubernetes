apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: scrutiny
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
  annotations:
    keel.sh/pollSchedule: "@every 72h"
  name: scrutiny
  namespace: lamg
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: scrutiny
  template:
    metadata:
      labels:
        app: scrutiny
    spec:
      containers:
        - image: ghcr.io/analogj/scrutiny:master-web
          name: scrutiny
          env:
            - name: TZ
              value: Europe/Madrid
            - name: SCRUTINY_WEB_INFLUXDB_HOST
              value: 'influxdb'
          ports:
            - containerPort: 8080
              name: scrutiny
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /opt/scrutiny/config
          resources:
            requests:
              cpu: 5m
              memory: 30Mi
      volumes:
        - name: config
          persistentVolumeClaim:
              claimName: scrutiny-config
      nodeSelector:
        svccontroller.k3s.cattle.io/lbpool: lamg

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scrutiny-config
  namespace: lamg
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-ssd
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: scrutiny
  namespace: lamg
  labels:
    svccontroller.k3s.cattle.io/lbpool: lamg
spec:
  type: LoadBalancer
  ports:
    - name: scrutiny
      protocol: TCP
      port: 8686
      targetPort: 8080
  selector:
    app: scrutiny
---
# scrutiny is pinned to the home pool, so it takes the LAN path to nas02.
# Note deployments/scrutiny has no ArgoCD Application: this file is applied by
# hand, so adding a resource here does not create it in the cluster.
#
# Moved off truenas-iscsi-ssd on 2026-09-24. That class is block storage reached
# over the WAN and it has already destroyed three filesystems in this cluster;
# when the link drops an NFS mount blocks and comes back instead. The old volume
# is kept declared until the copy is verified, then removed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scrutiny-config-nfs
  namespace: lamg
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-nfs-ssd-lan
  resources:
    requests:
      storage: 1Gi
