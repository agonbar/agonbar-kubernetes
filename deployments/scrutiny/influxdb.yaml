apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: influxdb
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
  annotations:
    keel.sh/pollSchedule: "@every 72h"
  name: influxdb
  namespace: lamg
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      containers:
        - image: influxdb:2.2
          name: influxdb
          ports:
            - containerPort: 8086
              name: influxdb
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/influxdb2
          resources:
            requests:
              cpu: 5m
              memory: 30Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: influxdb-data-lan
      nodeSelector:
        svccontroller.k3s.cattle.io/lbpool: lamg

---
# Rollback for the 2026-09-03 storage class migration. Nothing mounts it. Kept
# declared on purpose, because ArgoCD prunes what leaves git. Delete once the
# -lan volume has proven itself.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: influxdb-data
  namespace: lamg
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-ssd
  resources:
    requests:
      storage: 5Gi
---
# Moved off truenas-iscsi-ssd on 2026-09-03. Both classes point at the same
# TrueNAS box: that one reaches it over tailscale, this one over the LAN. On
# 2026-09-02 every tailnet iSCSI session on orange-pi5 ping-timed-out in the same
# second, recovery gave up after 120s, and three ext4 journals aborted. The LAN
# sessions to the very same target never blinked.
#
# This volume was missed in that migration because it had not broken yet. It
# turned up when scripts/audit-storage-classes.sh asked the question the other
# way round -- which pods are still on the tunnel -- and it was the only one on a
# node that has a LAN route to nas02 and was taking the tunnel anyway.
#
# iSCSI rather than NFS because InfluxDB is a live database: TSM files plus a
# bolt index, memory-mapped and fsync'd. That wants a block device.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: influxdb-data-lan
  namespace: lamg
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-ssd-lan
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: lamg
  labels:
    svccontroller.k3s.cattle.io/lbpool: lamg
spec:
  type: LoadBalancer
  ports:
    - name: influxdb
      protocol: TCP
      port: 8086
      targetPort: 8086
  selector:
    app: influxdb