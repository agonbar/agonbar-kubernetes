# Music Assistant server for HA aya. HA's "Music Assistant" integration talks
# to it in-cluster at http://music-assistant.aya.svc.cluster.local:8095.
#
# Deliberately not on hostNetwork and not exposed: no player discovery, players
# get added by hand. Players outside the cluster that pull audio from the stream
# server (8097) will need a kube-vip LoadBalancer like homeassistant's; until
# then the web UI is reached with
#   kubectl --context lamg -n aya port-forward svc/music-assistant 8095
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: music-assistant-data
  namespace: aya
spec:
  accessModes:
    - ReadWriteOnce
  # MA keeps its SQLite library DB in /data; local disk, not NFS.
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: music-assistant
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
  annotations:
    keel.sh/pollSchedule: "@every 72h"
  name: music-assistant
  namespace: aya
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: music-assistant
  template:
    metadata:
      labels:
        app: music-assistant
    spec:
      containers:
        - image: ghcr.io/music-assistant/server:latest
          name: music-assistant
          ports:
            - containerPort: 8095
              name: http
              protocol: TCP
            - containerPort: 8097
              name: stream
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            tcpSocket:
              port: 8095
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: 8095
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 300Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: music-assistant-data
      # local-path pins the volume to one node; work-vm-00 gets switched off.
      nodeSelector:
        kubernetes.io/hostname: rpi-01
      tolerations:
        - {key: dedicated, operator: Equal, value: media, effect: NoSchedule}

---
kind: Service
apiVersion: v1
metadata:
  name: music-assistant
  namespace: aya
spec:
  type: ClusterIP
  selector:
    app: music-assistant
  ports:
    - protocol: TCP
      port: 8095
      targetPort: 8095
      name: http
    - protocol: TCP
      port: 8097
      targetPort: 8097
      name: stream
