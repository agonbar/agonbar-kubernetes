# Music Assistant server for HA aya. HA's "Music Assistant" integration talks
# to it in-cluster at http://music-assistant.aya.svc.cluster.local:8095.
#
# Not on hostNetwork: no player discovery, players get added by hand (the Android
# TVs come in through HA's cast integration). Players on the aya LAN pull audio
# from the stream server, so MA is also on the kube-vip-aya VIP 192.168.1.26
# (music-assistant-aya below): UI http://192.168.1.26:8095, stream 8098.
# The stream port is 8098, not MA's default 8097, because svclb-jellyfin
# (ns media) holds hostPort 8097 on every node. MA's own settings must match:
# streams bind_port 8098, publish_ip 192.168.1.26.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: music-assistant-data
  namespace: aya
spec:
  accessModes:
    - ReadWriteOnce
  # MA keeps its SQLite library DB in /data; local disk, not NFS.
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: music-assistant
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
  annotations:
    keel.sh/pollSchedule: "@every 72h"
  name: music-assistant
  namespace: aya
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: music-assistant
  template:
    metadata:
      labels:
        app: music-assistant
    spec:
      containers:
        - image: ghcr.io/music-assistant/server:latest
          name: music-assistant
          ports:
            - containerPort: 8095
              name: http
              protocol: TCP
            - containerPort: 8098
              name: stream
              protocol: TCP
            # Sendspin server (/sendspin): the work-vm-00 voice satellite plays MA
            # music through it, connecting to the ClusterIP from the k3s node.
            - containerPort: 8927
              name: sendspin
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            tcpSocket:
              port: 8095
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: 8095
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 300Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: music-assistant-data
      # local-path pins the volume to one node; work-vm-00 gets switched off.
      nodeSelector:
        kubernetes.io/hostname: rpi-01
      tolerations:
        - {key: dedicated, operator: Equal, value: media, effect: NoSchedule}

---
kind: Service
apiVersion: v1
metadata:
  name: music-assistant
  namespace: aya
spec:
  type: ClusterIP
  selector:
    app: music-assistant
  ports:
    - protocol: TCP
      port: 8095
      targetPort: 8095
      name: http
    - protocol: TCP
      port: 8098
      targetPort: 8098
      name: stream
    - protocol: TCP
      port: 8927
      targetPort: 8927
      name: sendspin

---
# LAN-facing copy on the kube-vip-aya VIP (192.168.1.26), same pattern as
# homeassistant: the Android TVs (cast) fetch the stream from here.
kind: Service
apiVersion: v1
metadata:
  name: music-assistant-aya
  namespace: aya
  labels:
    svccontroller.k3s.cattle.io/lbpool: aya
  annotations:
    # svclb pods must also run on work-vm-00 so the kube-vip-aya VIP works there.
    svccontroller.k3s.cattle.io/tolerations: '[{"key":"dedicated","operator":"Equal","value":"media","effect":"NoSchedule"}]'
spec:
  type: LoadBalancer
  selector:
    app: music-assistant
  ports:
    - protocol: TCP
      port: 8095
      targetPort: 8095
      name: http
    - protocol: TCP
      port: 8098
      targetPort: 8098
      name: stream
