apiVersion: apps/v1
kind: Deployment
metadata:
    name: pihole-ha-deployment # <--- change this
    namespace: aya
    labels:
        app: pihole-ha # <--- change this to match label on the pod
spec:
    replicas: 1
    selector:
        matchLabels:
            app: pihole-ha # <--- change this to match label on the pod
    template: # => from here down copy and paste the pods metadata: and spec: sections
        metadata:
            labels:
                app: pihole-ha
        spec:
            containers:
                - name: pihole-ha
                  # https://hub.docker.com/r/pihole/pihole/tags
                  image: pihole/pihole:2026.07.2
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: TZ
                        value: "Europe/Madrid"
                      # Pi-hole v6 renamed WEBPASSWORD -> FTLCONF_webserver_api_password.
                      - name: FTLCONF_webserver_api_password
                        valueFrom:
                          secretKeyRef:
                            name: aya
                            key: piholePassword
                      # No persistent volume: pin the upstream so DNS resolves
                      # deterministically after every restart (v5 used 8.8.8.8).
                      - name: FTLCONF_dns_upstreams
                        value: "8.8.8.8"
                      # The default LOCAL mode drops queries from outside the pod's
                      # /24, i.e. everything svclb forwards from another node, so the
                      # VIP answered DNS only while it sat on the pod's own node.
                      - name: FTLCONF_dns_listeningMode
                        value: "ALL"
                  ports:
                      - containerPort: 53
                        protocol: TCP
                      - containerPort: 53
                        protocol: UDP
                      - containerPort: 80
                        protocol: TCP
                      - containerPort: 443
                        protocol: TCP
                  resources:
                      requests:
                          memory: 128Mi
                          cpu: 100m
                      limits:
                          memory: 2Gi
                          cpu: 1000m
            nodeSelector:
                svccontroller.k3s.cattle.io/lbpool: aya
            tolerations:
                - {key: dedicated, operator: Equal, value: media, effect: NoSchedule}

---
apiVersion: v1
kind: Service
metadata:
  name: pihole-ha
  namespace: aya
  labels:
    svccontroller.k3s.cattle.io/lbpool: aya
  annotations:
    # svclb pods must also run on work-vm-00 so the kube-vip-aya VIP works there.
    svccontroller.k3s.cattle.io/tolerations: '[{"key":"dedicated","operator":"Equal","value":"media","effect":"NoSchedule"}]'
spec:
  type: LoadBalancer
  ports:
    - name: pihole-1
      protocol: TCP
      port: 53
      targetPort: 53
    - name: pihole-2
      protocol: UDP
      port: 53
      targetPort: 53
    - name: pihole-3
      protocol: TCP
      port: 1080
      targetPort: 80
    - name: pihole-4
      protocol: TCP
      port: 1443
      targetPort: 443
  selector:
    app: pihole-ha