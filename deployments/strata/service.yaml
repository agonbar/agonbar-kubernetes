apiVersion: v1
kind: Service
metadata:
  name: strata
  namespace: strata
  labels:
    app: strata
spec:
  type: ClusterIP
  selector:
    app: strata
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    # Pide clave (strata-api-key). Solo lo usa el proxy del tailnet (tailnet.yaml).
    - name: keyed
      port: 8082
      targetPort: keyed
      protocol: TCP
