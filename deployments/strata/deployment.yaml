# Strata (github.com/Niko1221/Strata): Qwen3.8-Flash-Next IQ3_XXS a 256K de
# contexto en la A2000 de kubernetes-10. Los modelos y la config que escribe el
# setup del primer arranque viven en el SSD raíz del nodo (/var/lib/strata-ssd).
# No en el HDD (scsi1, /var/lib/strata): el prefill lee el shard PLE con E/S
# directa, y con prompts largos el raidz2 mecánico dejaba al motor 60 s sin
# avanzar, y el vigilante de Strata lo reiniciaba.
# Con 70 GiB de VM el setup no usa el modo low-RAM: copia los ~43 GB de expertos
# a RAM fijada (mlock, por eso k3s corre con LimitMEMLOCK=infinity) en cada
# arranque, de ahí la startupProbe larga.
# Imagen construida en el propio nodo (código CPU nativo de Zen 4, sm_86).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: strata
  namespace: strata
  labels:
    app: strata
spec:
  replicas: 0  # parado mientras se copia el modelo al SSD; volver a 1
  strategy:
    type: Recreate  # una GPU y un hostPath
  selector:
    matchLabels:
      app: strata
  template:
    metadata:
      labels:
        app: strata
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: kubernetes-10
      imagePullSecrets:
        - name: ghcr-agonbar
      terminationGracePeriodSeconds: 60
      containers:
        - name: strata
          image: ghcr.io/agonbar/strata:296b59d2
          env:
            - name: MODEL
              value: IQ3_XXS
            - name: CONTEXT
              value: "262144"
            - name: VISION
              value: "yes"
            - name: GPU
              value: "0"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 180  # 90 min: el primer arranque monta el MTP y lee 76 GB del HDD
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "4"
              memory: 60Gi
              nvidia.com/gpu: 1
            limits:
              memory: 66Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /var/lib/strata-ssd/data
            type: Directory
