# Strata (github.com/Niko1221/Strata): Qwen3.8-Flash-Next IQ3_XXS a 256K de
# contexto en la A2000 de kubernetes-10. Los modelos y la config que escribe el
# setup del primer arranque viven en el SSD raíz del nodo (/var/lib/strata-ssd).
# No en el HDD (scsi1, /var/lib/strata): el prefill lee el shard PLE con E/S
# directa, y con prompts largos el raidz2 mecánico dejaba al motor 60 s sin
# avanzar, y el vigilante de Strata lo reiniciaba.
# Con 70 GiB de VM el setup no usa el modo low-RAM: copia los ~43 GB de expertos
# a RAM fijada (mlock, por eso k3s corre con LimitMEMLOCK=infinity) en cada
# arranque, de ahí la startupProbe larga.
# Imagen construida en el propio nodo con scripts/strata-build-image.sh (v0.2.13,
# motor 0.1.59, sm_86). El entrypoint de la v0.2.x (strata launch) movería
# /data/models, packs y mtp a /data/Strata-data y rompería la vuelta a 296b59d2,
# así que el contenedor arranca serve/server.py directamente con una config de
# /data/config. Las del motor nuevo son *-v0213.json y strata-heretic-v2.json;
# strata-iq3_xxs.json y /data/mtp son de la imagen vieja y no se tocan. Modelos y
# packs van en solo lectura; el MTP del motor nuevo es una copia (/data/mtp-v0213).
# Vuelta atrás: imagen 296b59d2 con MODEL/CONTEXT/VISION/GPU/PORT y sin command.
# Strata atiende una generación cada vez. Delante, en el mismo pod, va
# strata-gateway (scripts/strata-gateway): sirve el 8080 del Service y deja pasar
# las peticiones por prioridad de cliente (cabecera X-Strata-Priority:
# hot|batch|research|junior, sin ella hot). Strata escucha en el 8081 (PORT).
# El gateway abre además el 8082 (AUTH_PORT), que pide la clave del Secret
# strata-api-key: es el que publica tailnet.yaml en el tailnet. El 8080 sigue
# sin clave para el clúster, donde el 8081 de Strata está abierto de todos modos.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: strata
  namespace: strata
  labels:
    app: strata
spec:
  replicas: 1
  strategy:
    type: Recreate  # una GPU y un hostPath
  selector:
    matchLabels:
      app: strata
  template:
    metadata:
      labels:
        app: strata
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: kubernetes-10
      imagePullSecrets:
        - name: ghcr-agonbar
      terminationGracePeriodSeconds: 60
      containers:
        - name: strata
          image: ghcr.io/agonbar/strata:d2f09647
          workingDir: /opt/strata/terminal
          command:
            - /opt/strata/terminal/python/bin/python3
            - serve/server.py
            - --engine=strata
            - --config=/data/config/strata-heretic-v2.json
            - --port=8081
            - --no-api-key  # el gateway pone la clave en el 8082
          ports:
            - name: engine
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /health
              port: engine
            periodSeconds: 30
            failureThreshold: 180  # 90 min: el primer arranque monta el MTP y lee 76 GB del HDD
          readinessProbe:
            httpGet:
              path: /health
              port: engine
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: engine
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "4"
              memory: 60Gi
              nvidia.com/gpu: 1
            limits:
              memory: 66Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: data
              mountPath: /data
            - name: data
              mountPath: /data/models
              subPath: models
              readOnly: true
            - name: data
              mountPath: /data/packs
              subPath: packs
              readOnly: true
        - name: gateway
          image: ghcr.io/agonbar/strata-gateway:26c85abb
          env:
            - name: UPSTREAM
              value: http://127.0.0.1:8081
            - name: AUTH_PORT
              value: "8082"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: strata-api-key
                  key: api-key
          ports:
            - name: http
              containerPort: 8080
            - name: keyed
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /gateway/status
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /gateway/status
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 1Gi  # cuerpos con imágenes de hasta 256 MiB
      volumes:
        - name: data
          hostPath:
            path: /var/lib/strata-ssd/data
            type: Directory
