# La base de datos vive en el Postgres de nas02 (192.168.0.29:5432) desde el
# 2026-09-24. Antes era un postgres:16-alpine propio, en ovh02, con el PGDATA
# en un LUN iSCSI servido desde casa por tailscale: almacenamiento de bloque
# sobre WAN. Acabo como era de esperar, con 2431 errores de ext4 y el pod en
# CrashLoopBackOff 1694 veces contra su propio postgresql.conf.
#
# Esa instancia de nas02 solo escucha en la LAN, asi que esto ya no puede vivir
# en ovh02. Es el mismo movimiento que hizo sure en f3257c5.
#
# El PVC reactive-resume-uploads tambien se fue: /app/uploads estaba vacio del
# todo (0 ficheros). Esta version guarda en S3, y S3_ENDPOINT apunta a minio.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: reactive-resume-printer
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
  annotations:
    keel.sh/pollSchedule: "@every 72h"
  name: reactive-resume-printer
  namespace: agonbar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reactive-resume-printer
  template:
    metadata:
      labels:
        app: reactive-resume-printer
    spec:
      containers:
        - image: ghcr.io/browserless/chromium:latest
          name: printer
          ports:
            - containerPort: 3000
              name: printer
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 200Mi
          livenessProbe:
            httpGet:
              path: /pressure
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      imagePullSecrets:
        - name: dockerhub-secret

---
kind: Service
apiVersion: v1
metadata:
  name: reactive-resume-printer
  namespace: agonbar
spec:
  type: ClusterIP
  selector:
    app: reactive-resume-printer
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      name: printer

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: reactive-resume
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
  annotations:
    keel.sh/pollSchedule: "@every 72h"
  name: reactive-resume
  namespace: agonbar
spec:
  strategy:
    type: Recreate
  # Back to 1 on 2026-09-24. It sat at 0 since July, when its own Postgres
  # stopped coming up. The database is on nas02 now and the app starts.
  replicas: 1
  selector:
    matchLabels:
      app: reactive-resume
  template:
    metadata:
      labels:
        app: reactive-resume
    spec:
      containers:
        - image: ghcr.io/amruthpillai/reactive-resume:latest
          name: reactive-resume
          env:
            # Application
            - name: APP_URL
              value: https://cv.${BASE_DOMAIN}
            - name: NODE_ENV
              value: production
            - name: FLAG_DISABLE_SIGNUPS
              value: "false"

            # Database
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agonbar
                  key: reactiveResumeDatabaseUrl

            # Authentication
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: agonbar
                  key: reactiveResumeAuthSecret

            # Printer Service
            - name: PRINTER_ENDPOINT
              value: http://reactive-resume-printer:3000

            # S3 Storage (MinIO)
            - name: S3_ENDPOINT
              value: http://minio:9000
            - name: S3_BUCKET
              value: reactive-resume
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: agonbar
                  key: minioRootUser
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: agonbar
                  key: minioRootPassword
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          resources:
            requests:
              # 20m/100Mi era mentira para un Node en produccion, y en ovh02 daba
              # igual porque iba clavado por hostname. Ahora compite por sitio en
              # el pool de casa, asi que el numero tiene que significar algo.
              # Estimacion, pendiente de medir en reposo una vez lleve un rato.
              cpu: 100m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
      # Tiene que alcanzar 192.168.0.29:5432 por la LAN, asi que va al pool de
      # casa y no a ovh02, que no enruta a esa red. amd64 porque la imagen no
      # publica arm64 y orange-pi5 esta en este mismo pool.
      nodeSelector:
        svccontroller.k3s.cattle.io/lbpool: lamg
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: dockerhub-secret

---
kind: Service
apiVersion: v1
metadata:
  name: reactive-resume
  namespace: agonbar
spec:
  type: NodePort
  selector:
    app: reactive-resume
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      name: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reactive-resume-https
  namespace: agonbar
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: cv.${BASE_DOMAIN}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: reactive-resume
                port:
                  number: 3000
  tls:
    - secretName: cv.${BASE_DOMAIN}
      hosts:
        - cv.${BASE_DOMAIN}
