apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: lobechat
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
  annotations:
    keel.sh/pollSchedule: "@every 72h"
  name: lobechat
  namespace: agonbar
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: lobechat
  template:
    metadata:
      labels:
        app: lobechat
    spec:
      containers:
        - image: lobehub/lobe-chat:latest
          name: lobechat
          env:
            # Model provider = work-vm-00's llama-server (gemma-4-12B on the 3090),
            # reached over the tailnet. Calls are proxied server-side by LobeChat,
            # so the bearer never touches the browser.
            - name: OPENAI_PROXY_URL
              value: http://100.72.0.8:8080/v1
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agonbar
                  key: lobechatOpenaiApiKey
            # Only surface the one model work-vm-00 serves; <vision:fc> exposes the
            # vision (mmproj) + function-calling/tools capability in the UI.
            - name: OPENAI_MODEL_LIST
              value: "-all,+gemma-4-12B-it-qat-UD-Q4_K_XL.gguf=Gemma 4 12B (work-vm-00)<vision:fc>"
            # Password gate for the public URL.
            - name: ACCESS_CODE
              valueFrom:
                secretKeyRef:
                  name: agonbar
                  key: lobechatAccessCode
          ports:
            - containerPort: 3210
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3210
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 8
          livenessProbe:
            httpGet:
              path: /
              port: 3210
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
      imagePullSecrets:
        - name: dockerhub-secret
      nodeSelector:
        # Explicitly on ovh02 (the public OVH node) as requested.
        kubernetes.io/hostname: ovh02

---
kind: Service
apiVersion: v1
metadata:
  name: lobechat
  namespace: agonbar
spec:
  type: NodePort
  selector:
    app: lobechat
  ports:
    - protocol: TCP
      port: 3210
      targetPort: 3210
      name: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lobechat-https
  namespace: agonbar
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: chat.${BASE_DOMAIN}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: lobechat
                port:
                  number: 3210
  tls:
    - secretName: chat.${BASE_DOMAIN}
      hosts:
        - chat.${BASE_DOMAIN}
