apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    keel.sh/pollSchedule: "@every 72h"
  name: dawarich-db
  namespace: dawarich
  labels:
    app: dawarich-db
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
spec:
  strategy:
    type: Recreate
  replicas: 0
  selector:
    matchLabels:
      app: dawarich-db
  template:
    metadata:
      labels:
        app: dawarich-db
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
        svccontroller.k3s.cattle.io/lbpool: lamg
      # postgis is amd64-only, so on the lamg pool this can land on nas00 or
      # nas01 and nothing else. nas00 has 1.2GB allocatable and already carries
      # 372Mi of requests; on 2026-09-03 the kubelet evicted this pod there
      # mid-migration (exit 137, "node was low on resource: memory") and rolled
      # back a points backfill that had been running for seven minutes. With no
      # resources block the scheduler saw the pod as free and kept re-picking
      # nas00. Excluding it leaves only nas01, which does flap -- but Pending is
      # a safe state for a Postgres and eviction mid-write is not.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nas00
      containers:
      - name: postgres
        image: postgis/postgis:17-3.5-alpine
        env:
        - name: POSTGRES_USER
          value: "dawarich"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dawarich
              key: databasePassword
        - name: POSTGRES_DB
          value: "dawarich_development"
        volumeMounts:
        - name: dawarich-db-data
          mountPath: /var/lib/postgresql/data
        - name: dawarich-shared
          mountPath: /var/shared
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - dawarich
            - -d
            - dawarich_development
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 5
        # Measured 163Mi at boot before the eviction; the points backfill needs
        # headroom on top. The request is what keeps the scheduler honest.
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 1536Mi
      volumes:
      - name: dawarich-db-data
        persistentVolumeClaim:
          claimName: dawarich-db-data-lan
      - name: dawarich-shared
        nfs:
          server: 192.168.0.29
          path: /mnt/RAID/docker/dawarich/shared
---
apiVersion: v1
kind: Service
metadata:
  name: dawarich-db
  namespace: dawarich
spec:
  selector:
    app: dawarich-db
  ports:
   - protocol: TCP
     port: 5432
     targetPort: 5432
---
# Rollback for the 2026-09-02 storage class migration: holds the datadir as it was
# before the cutover. Nothing mounts it. Kept declared on purpose, because ArgoCD
# prunes what leaves git. Delete this block once the -lan volume has proven itself.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dawarich-db-data
  namespace: dawarich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-ssd
  resources:
    requests:
      storage: 5Gi

---
# Moved off truenas-iscsi-ssd on 2026-09-02, the last volume still on it. That
# class reaches nas02 over tailscale (portal 100.72.0.41:3260) and it was those
# five sessions that dropped together at 11:28 and aborted the ext4 journals.
# This one takes the LAN path to the same box. Copied while dawarich-db was at 0,
# so the datadir copy is consistent; verified byte count and tree md5.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dawarich-db-data-lan
  namespace: dawarich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-ssd-lan
  resources:
    requests:
      storage: 5Gi