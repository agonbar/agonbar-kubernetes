apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    keel.sh/pollSchedule: "@every 72h"
  name: dawarich-db
  namespace: dawarich
  labels:
    app: dawarich-db
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: dawarich-db
  template:
    metadata:
      labels:
        app: dawarich-db
    spec:
      # The data is a local-path volume on the node labelled storage/local-db
      # (nas02-k3s), so the pod has to follow it. That node is amd64, which the
      # postgis image needs, and it is not nas00, which evicted this pod
      # mid-migration on 2026-09-03 -- the label covers both old constraints.
      nodeSelector:
        storage/local-db: "true"
      containers:
      - name: postgres
        image: postgis/postgis:17-3.5-alpine
        env:
        - name: POSTGRES_USER
          value: "dawarich"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dawarich
              key: databasePassword
        - name: POSTGRES_DB
          value: "dawarich_development"
        volumeMounts:
        - name: dawarich-db-data
          mountPath: /var/lib/postgresql/data
        - name: dawarich-shared
          mountPath: /var/shared
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - dawarich
            - -d
            - dawarich_development
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 5
        # Measured 163Mi at boot before the eviction; the points backfill needs
        # headroom on top. The request is what keeps the scheduler honest.
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 1536Mi
      volumes:
      - name: dawarich-db-data
        persistentVolumeClaim:
          claimName: dawarich-db-data-local
      - name: dawarich-shared
        nfs:
          server: 192.168.0.29
          path: /mnt/RAID/docker/dawarich/shared
---
apiVersion: v1
kind: Service
metadata:
  name: dawarich-db
  namespace: dawarich
spec:
  selector:
    app: dawarich-db
  ports:
   - protocol: TCP
     port: 5432
     targetPort: 5432
---
# The live database, on the local disk of the node labelled storage/local-db.
#
# Moved off truenas-iscsi-ssd-lan on 2026-09-24. A PGDATA on a network block
# device is the worst case for that class: the 2026-09-03 journal abort is what
# took this database down in the first place. NFS is not an option for Postgres
# either, and the nas02 Postgres cannot take it because the community chart only
# ships postgres and pgvector images -- no postgis, and postgis is shared
# libraries, not something CREATE EXTENSION can conjure. So it goes the way
# immich went on 2026-09-23: a local disk on nas02-k3s.
#
# That trades the daily VolumeSnapshot for a pg_dump, which db-backup.yaml takes
# over. 10Gi is a label, not a limit: local-path is a bind mount and enforces
# nothing.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dawarich-db-data-local
  namespace: dawarich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
