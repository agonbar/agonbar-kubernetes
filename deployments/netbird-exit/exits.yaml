# Three NetBird internet exits for guest peers, one per site: aya and lamg
# (house lines) and ovh02. A guest selects one in the NetBird client (routes
# exit-home = aya, the default; exit-home-backup = lamg; exit-ovh) and all
# their traffic leaves from here, encrypted up to this point, instead of in
# clear through their own ISP.
#
# The NetBird side (groups exit-users/exit-aya/exit-lamg/exit-ovh, the
# 0.0.0.0/0 routes, the policies and the setup keys) lives in the mgmt DB and is created
# by scripts/netbird-exit-setup.sh, which also writes the Secret
# netbird-exit-keys here. Nothing secret is in git.
#
# The fence: an exit route covers ALL of 0.0.0.0/0, private ranges included, so
# NetBird policies cannot stop a guest from reaching the LAN, the cluster or the
# meshes through the exit. The NetworkPolicy below does: the pods only reach
# public addresses. The keys are ephemeral and the state is an emptyDir, so a
# restarted pod enrolls as a fresh peer and the old one is dropped after 10 min.
#
# Node choice is by the semantic label egress-site, set by hand:
#   kubectl label node rpi-01 egress-site=aya
#   kubectl label node nas02-k3s egress-site=lamg
#   kubectl label node ovh02 egress-site=ovh
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exit-aya
  namespace: netbird-exit
  labels:
    app: netbird-exit
    exit: aya
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: netbird-exit
      exit: aya
  template:
    metadata:
      labels:
        app: netbird-exit
        exit: aya
    spec:
      nodeSelector:
        egress-site: aya
      # Public resolvers only: cluster DNS sits on a private address the
      # NetworkPolicy blocks, and must not be reachable through the exit anyway.
      dnsPolicy: None
      dnsConfig:
        nameservers: [1.1.1.1, 9.9.9.9]
      containers:
        - name: netbird
          image: netbirdio/netbird:0.83.2   # pinned to the management version
          env:
            - name: NB_MANAGEMENT_URL
              value: https://netbird.senseivision.ai
            - name: NB_HOSTNAME
              value: exit-aya
            # Direct (P2P) path, same idea as exit-ovh: the aya Movistar router
            # forwards UDP 51831 to the kube-vip VIP 192.168.1.26, where the
            # LoadBalancer below (svclb, lbpool aya) hands it to this pod, and
            # the pod announces the aya public IP as its address.
            - name: NB_WIREGUARD_PORT
              value: "51831"
            - name: NB_EXTERNAL_IP_MAP
              value: 83.34.86.1/eth0
            - name: NB_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-exit-keys
                  key: NB_SETUP_KEY_AYA
          ports:
            - {name: wireguard, containerPort: 51831, protocol: UDP}
          securityContext:
            capabilities:
              add: [NET_ADMIN]    # WireGuard + nftables masquerade + ip_forward
          volumeMounts:
            - name: nb-config
              mountPath: /etc/netbird
            - name: tun
              mountPath: /dev/net/tun
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: nb-config
          emptyDir: {}
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
