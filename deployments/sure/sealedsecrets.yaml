---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: sure
  namespace: sure
spec:
  encryptedData:
    ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: 
    ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: 
    ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: 
    MCP_API_TOKEN: 
    POSTGRES_PASSWORD: 
    SECRET_KEY_BASE: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      name: sure
      namespace: sure
---
# LiteLLM (litellm.senseivision.ai) API key, reused from the openclaw env file
# rather than minted fresh. Kept apart from the `sure` secret so it can be
# rotated or pulled without re-sealing the database and encryption keys.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: sure-llm
  namespace: sure
spec:
  encryptedData:
    OPENAI_ACCESS_TOKEN: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      name: sure-llm
      namespace: sure
