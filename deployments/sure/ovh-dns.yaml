# OVH DNS credentials for the letsencrypt-dns-ovh ClusterIssuer. They live here
# because cert-manager's OVH webhook reads them from the Certificate's namespace
# (see deployments/cert-issuer/ovh-dns.yaml). Sure's pods neither mount this
# Secret nor have RBAC to read secrets; only the webhook's ServiceAccount does.
---
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ovh-dns-credentials
  namespace: sure
spec:
  encryptedData:
    applicationConsumerKey: 
    applicationKey: 
    applicationSecret: 
  template:
    metadata:
      name: ovh-dns-credentials
      namespace: sure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-webhook-ovh:ovh-dns-credentials
  namespace: sure
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ovh-dns-credentials"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-webhook-ovh:ovh-dns-credentials
  namespace: sure
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-webhook-ovh:ovh-dns-credentials
subjects:
  - kind: ServiceAccount
    name: cert-manager-webhook-ovh
    namespace: cert-manager
