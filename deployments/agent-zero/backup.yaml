# Nightly tar of /a0/usr of both instances (the sister's in deployment.yaml,
# the father's in papa.yaml: chats, memory, knowledge, documents) to nas02
# over NFS. The source is a local-path RWO volume on ovh02, so the job is pinned
# to the same node; RWO allows a second pod there. 14 days kept.
#
# Restore: scale the deployment to 0, mount both PVCs in a throwaway pod on
# ovh02, `tar -xzf <file> -C /a0/usr`, scale back to 1. Files are
# a0-usr-* (sister) and a0-papa-usr-* (father).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-zero-backups
  namespace: agent-zero
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-nfs-raid
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-zero-backup
  namespace: agent-zero
spec:
  schedule: "30 3 * * *"
  timeZone: Europe/Madrid
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            workload: agents
          containers:
            - name: tar
              image: busybox:1.38.0
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  ts=$(date +%Y%m%d-%H%M%S)
                  for v in a0-usr a0-papa-usr; do
                    out="/backups/$v-$ts.tar.gz"
                    tar -czf "$out.part" -C "/src/$v" .
                    tar -tzf "$out.part" > /dev/null
                    mv "$out.part" "$out"
                    find /backups -name "$v-*.tar.gz" -mtime +14 -delete
                  done
                  ls -la /backups | tail -5
              volumeMounts:
                - name: usr
                  mountPath: /src/a0-usr
                  readOnly: true
                - name: usr-papa
                  mountPath: /src/a0-papa-usr
                  readOnly: true
                - name: backups
                  mountPath: /backups
          volumes:
            - name: usr
              persistentVolumeClaim:
                claimName: agent-zero-usr
            - name: usr-papa
              persistentVolumeClaim:
                claimName: agent-zero-papa-usr
            - name: backups
              persistentVolumeClaim:
                claimName: agent-zero-backups
