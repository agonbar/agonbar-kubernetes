# Seeded once into /a0/usr/plugins/_model_config/presets.yaml. After that the
# file belongs to Agent Zero (the preset editor in Settings rewrites it), so
# changing this ConfigMap does nothing until that file is deleted.
#
# chat: Strata through its gateway. Thinking off and the instruct sampling
#   preset, the same as pi in dotfiles nix/home/modules/pi.nix. Priority hot:
#   she is a person waiting at a browser, like interactive pi.
# utility: LiteLLM's swift-1.5-27b group (key in API_KEY_OPENAI; the openai
#   provider is just the OpenAI-compatible client). That is Swift 1.5 on
#   work-vm-00's 3090, then Strata when work-vm-00 is off, nothing paid.
#   Agent Zero uses it for history compaction and memory extraction, text-in
#   text-out with no tool choice, so thinking is off. While work-vm-00 is up
#   it keeps those calls out of Strata's one-at-a-time queue.
# embedding: multilingual on CPU in the pod. The image default
#   (all-MiniLM-L6-v2) is English-only and she will write in Spanish.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-zero-seed
  namespace: agent-zero
data:
  whisper-config.json: |
    {"model_size": "base", "language": "es", "message_mode": "send", "silence_threshold": 0.3, "silence_duration": 1000, "waiting_timeout": 2000}
  presets.yaml: |
    - name: Default
      chat:
        provider: other
        name: swift-1.5-heretic-v2-iq3_s-85g
        api_base: http://strata.strata.svc.cluster.local:8080/v1
        ctx_length: 131072
        ctx_history: 0.7
        vision: true
        max_embeds: 10
        rl_requests: 0
        rl_input: 0
        rl_output: 0
        kwargs:
          temperature: 0.7
          top_p: 0.8
          extra_headers:
            X-Strata-Priority: hot
          extra_body:
            top_k: 20
            min_p: 0
            presence_penalty: 1.5
            chat_template_kwargs:
              enable_thinking: false
      utility:
        provider: openai
        name: swift-1.5-27b
        api_base: https://litellm.senseivision.ai/v1
        ctx_length: 32768
        ctx_input: 0.7
        rl_requests: 0
        rl_input: 0
        rl_output: 0
        kwargs:
          extra_body:
            chat_template_kwargs:
              enable_thinking: false
      embedding:
        provider: huggingface
        name: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
        api_base: ""
        rl_requests: 0
        rl_input: 0
        kwargs: {}
  # The father's instance (papa.yaml). Default is the same Strata model as
  # above; "Rápido (Swift 27B)" swaps only the chat model (named presets are
  # laid over Default) for the 27B on work-vm-00, a bit faster per token
  # (32.6 vs 25.7 tok/s measured 2026-11-18) and out of Strata's one-at-a-time
  # queue, but a smaller model. Falls back to Strata when work-vm-00 is off.
  presets-papa.yaml: |
    - name: Default
      chat:
        provider: other
        name: swift-1.5-heretic-v2-iq3_s-85g
        api_base: http://strata.strata.svc.cluster.local:8080/v1
        ctx_length: 131072
        ctx_history: 0.7
        vision: true
        max_embeds: 10
        rl_requests: 0
        rl_input: 0
        rl_output: 0
        kwargs:
          temperature: 0.7
          top_p: 0.8
          extra_headers:
            X-Strata-Priority: hot
          extra_body:
            top_k: 20
            min_p: 0
            presence_penalty: 1.5
            chat_template_kwargs:
              enable_thinking: false
      utility:
        provider: openai
        name: swift-1.5-27b
        api_base: https://litellm.senseivision.ai/v1
        ctx_length: 32768
        ctx_input: 0.7
        rl_requests: 0
        rl_input: 0
        rl_output: 0
        kwargs:
          extra_body:
            chat_template_kwargs:
              enable_thinking: false
      embedding:
        provider: huggingface
        name: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
        api_base: ""
        rl_requests: 0
        rl_input: 0
        kwargs: {}
    - name: Rápido (Swift 27B)
      chat:
        provider: openai
        name: swift-1.5-27b
        api_base: https://litellm.senseivision.ai/v1
        ctx_length: 131072
        ctx_history: 0.7
        vision: true
        max_embeds: 10
        rl_requests: 0
        rl_input: 0
        rl_output: 0
        kwargs:
          temperature: 0.7
          top_p: 0.8
          extra_body:
            top_k: 20
            min_p: 0
            presence_penalty: 1.5
            chat_template_kwargs:
              enable_thinking: false
---
# Replaces the image's /exe/run_tunnel_api.sh. That service lets the UI (or the
# agent, talked into it by a web page) open a public tunnel to the web UI,
# outside the Ingress and its TLS. supervisord restarts what
# exits, so the stub sleeps instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-zero-no-tunnel
  namespace: agent-zero
data:
  run_tunnel_api.sh: |
    #!/bin/sh
    echo "tunnel API disabled by agonbar-kubernetes deployments/agent-zero"
    exec sleep infinity
