# Prompt and skill additions for Agent Zero, mounted read-only from git in
# both instances (deployment.yaml and guz.yaml). Written after a first real session (2026-11-18) where the agent
# lost an afternoon to documents: it hand-zipped an ODT that LibreOffice could
# not open, printed HTML to PDF with soffice (which drops most CSS), rewrote
# the user's spreadsheet in place, and said "fixed" without opening the file.
#
# - specifics.md replaces the image's empty prompts/agent.system.main.specifics.md,
#   the slot the system prompt keeps for deployment rules. Always on.
# - initial_message.md replaces prompts/fw.initial_message.md (the English
#   greeting every new chat starts with). Same JSON shape, Spanish text.
# - SKILL.md + html-to-pdf.sh are the skill printable-documents, mounted as
#   /a0/skills/printable-documents. Loaded on demand.
# - office_markdown.py is an agent_init extension: office_artifact `create`
#   writes each line as a plain paragraph, so Markdown landed in ODT/DOCX as
#   literal ## and **. It renders Markdown content through LibreOffice
#   instead. Re-check _office/helpers/document_store.py when bumping the image.
#
# Instructions are in English on purpose; the agent still answers in Spanish.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-zero-guidance
  namespace: agent-zero
data:
  specifics.md: |
    ## Deployment specifics
    - The user is a non-technical Spanish speaker. Always answer in Spanish, in plain words, without technical jargon or file-system paths unless asked.
    - Files the user uploaded or wrote are originals. Never overwrite them. Save results as a new file (for example `Informe v2.odt`) unless the user explicitly asks to replace the original, and say which file you created.
    - Before saying a file is done or fixed, open or render it yourself and look at the result. If you could not verify it, say so. Never claim a success you have not checked.
    - Before creating a PDF, a printable report or any ODT/DOCX/ODS file, load the skill `printable-documents` and follow it.
    - Money and accounts: compute totals with code from the source data, never by hand, and show a reconciliation (opening + income - expenses = closing) that matches to the cent before presenting figures.
  initial_message.md: |
    ```json
    {
        "thoughts": [
            "This is a new conversation, I should greet the user warmly in Spanish and let them know I'm ready to help.",
            "I'll use the response tool with proper JSON formatting to demonstrate the expected structure."
        ],
        "headline": "Saludando al usuario",
        "tool_name": "response",
        "tool_args": {
            "text": "**¡Hola! 👋** Soy tu asistente. ¿En qué te ayudo hoy?"
        }
    }
    ```
  SKILL.md: |
    ---
    name: printable-documents
    description: "Make reports and documents that look right on paper: HTML as the source, Chromium to print PDF, never hand-built ODT/DOCX, always verified visually."
    version: "1.0.0"
    author: "agonbar-kubernetes"
    tags: ["pdf", "print", "report", "html", "odt", "docx", "ods", "imprimir", "informe"]
    triggers:
      - "PDF"
      - "imprimir"
      - "informe"
      - "documento para presentar"
      - "ODT"
      - "DOCX"
      - "print"
    allowed_tools:
      - code_execution_tool
      - office_artifact
      - vision_load
    ---

    # Printable documents

    ## Source of truth: one standalone HTML file
    - Write a single `.html` with all CSS embedded. No external fonts, CDNs or scripts. Emoji are fine (Noto Color Emoji is installed).
    - Always include print CSS:
      ```css
      @page { size: A4; margin: 14mm; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .card, tr, figure, section { break-inside: avoid; }
      ```
    - Keep the layout simple enough to print: flex/grid and CSS bars are fine in Chromium.

    ## PDF: print the HTML with Chromium
    ```bash
    sh /a0/skills/printable-documents/html-to-pdf.sh "input.html" "output.pdf"
    ```
    It uses the Chromium already installed for the browser tool (it installs it if missing). The PDF looks exactly like the page in the browser.
    NEVER use `soffice --convert-to pdf` on an HTML file: LibreOffice imports HTML as a Writer document and drops most CSS (cards, backgrounds, colours, bars). The result looks nothing like the HTML.

    ## ODT / DOCX (editable documents)
    - NEVER build the ODT/DOCX zip or its XML by hand. Hand-made packages open as "corrupt, cannot be repaired" in LibreOffice.
    - `office_artifact` `create` (format `odt` or `docx`) renders Markdown content: `#` headings, `**bold**`, lists and `|` tables become real Writer styles. Good for most documents.
    - For richer layout, build it with python-docx (`/opt/venv-a0/bin/python`, not system python3): `doc.add_heading(text, 0|1|2)` for titles, `doc.add_table(...)` with `table.style = "Light Grid Accent 1"`, `add_run(...).bold = True`, `style="List Bullet"` for lists. Save as `.docx`.
    - If the user wants ODT, convert the DOCX: `soffice --headless --convert-to odt --outdir <dir> file.docx`. Styles and tables survive.
    - If the user wants it to look nice on paper, the PDF from HTML is the deliverable; the ODT/DOCX is only for editing.

    ## Editing the user's existing ODS/ODT/DOCX
    - First copy the original: `cp "Gastos.ods" "Gastos (copia antes de editar).ods"`.
    - `office_artifact` edit rewrites the whole file and can drop styles, column widths and formulas. After any edit, compare the file size with the copy; if it shrank a lot, tell the user and offer the copy.

    ## Verify before saying it is done
    - PDF: `pdftoppm -r 60 -png -f 1 -l 2 output.pdf /tmp/check` and look at the PNGs with `vision_load`. Compare with what the HTML looks like.
    - ODT/DOCX/ODS: `soffice --headless --convert-to pdf --outdir /tmp/check "file.odt"` must succeed and produce a PDF; render it and look at it. If the conversion fails, the file is broken: say so and do not call it fixed.
    - ODT/DOCX text check, do not skip it (looking at the image has missed this before): `soffice --headless --convert-to txt:Text --outdir /tmp/check "file.odt" && grep -nE '^#|\*\*|\|---' /tmp/check/*.txt`. Any match means Markdown leaked into the document as literal text: rebuild it with python-docx.
    - Only describe what you actually see. Do not claim "real tables" or "heading styles" unless the render shows them.
  html-to-pdf.sh: |
    #!/bin/sh
    # Print an HTML file to PDF with headless Chromium, the same engine the
    # browser tool uses, so the PDF matches what the page looks like on screen.
    # Usage: html-to-pdf.sh input.html output.pdf
    set -eu
    [ $# -eq 2 ] || { echo "usage: $0 input.html output.pdf" >&2; exit 2; }
    in=$(realpath "$1")
    out=$(realpath -m "$2")
    [ -f "$in" ] || { echo "no such file: $1" >&2; exit 2; }

    chrome=$(cd /a0 && /opt/venv-a0/bin/python -c '
    import sys
    sys.path.insert(0, "/a0")
    from plugins._browser.helpers.playwright import configure_playwright_env, ensure_playwright_binary
    configure_playwright_env()
    print(ensure_playwright_binary())
    ' | tail -1)
    [ -x "$chrome" ] || { echo "Chromium not found: $chrome" >&2; exit 1; }

    rm -f "$out"
    "$chrome" --headless --no-sandbox --disable-gpu --hide-scrollbars \
      --no-pdf-header-footer --virtual-time-budget=5000 \
      --print-to-pdf="$out" "file://$in" 2>/dev/null || true
    [ -s "$out" ] || { echo "Chromium did not write $out" >&2; exit 1; }
    pdfinfo "$out" | grep -E "^(Pages|Page size):"
    echo "$out"
  office_markdown.py: |
    """Make office_artifact `create` render Markdown into real ODT/DOCX.

    The image's _office plugin writes every line of `content` as a plain
    paragraph, so the model's Markdown (#, **, | tables) lands in the document
    as literal text. This wraps document_store.odt_bytes and _docx: when the
    content looks like Markdown it becomes HTML (python-markdown, tables) and
    LibreOffice converts that to ODT/DOCX with real headings, bold and tables.
    Anything else, or any failure, falls back to the original builder.

    Mounted from agonbar-kubernetes deployments/agent-zero/guidance.yaml.
    """
    import html
    import pathlib
    import re
    import subprocess
    import tempfile

    from helpers.extension import Extension

    MD = re.compile(r"(?m)^(#{1,6} |\s*[-*] |\s*\d+\. |\|.*\|)|\*\*[^*]+\*\*")


    def _looks_markdown(content) -> bool:
        return bool(MD.search(str(content or "")))


    def _blank_lines(text: str) -> str:
        # python-markdown needs a blank line before a heading, list or table and
        # after a table; models often omit it, and the next line then leaks into
        # the table as literal text.
        out, prev = [], ""
        for line in text.splitlines():
            is_table, was_table = line.lstrip().startswith("|"), prev.lstrip().startswith("|")
            starts_block = bool(re.match(r"\s*(#{1,6} |[-*] |\d+\. )", line)) or (is_table and not was_table)
            if prev.strip() and ((starts_block and not re.match(r"\s*([-*] |\d+\. )", prev)) or (was_table and not is_table)):
                out.append("")
            out.append(line)
            prev = line
        return "\n".join(out)


    def _convert(title: str, content: str, ext: str) -> bytes:
        import markdown

        body = markdown.markdown(_blank_lines(str(content or "")), extensions=["tables", "sane_lists"])
        body = body.replace("<table>", '<table border="1" cellpadding="4" cellspacing="0">')
        title = str(title or "").strip()
        heading = "" if (not title or body.lstrip().startswith("<h1")) else f"<h1>{html.escape(title)}</h1>"
        page = (
            "<!doctype html><html><head><meta charset='utf-8'>"
            f"<title>{html.escape(title)}</title>"
            "<style>table{border-collapse:collapse} th,td{border:1px solid #8a94a6;padding:3px 6px}"
            " th{background:#dde6f3;color:#000}</style>"
            f"</head><body>{heading}{body}</body></html>"
        )
        target = {"odt": "odt:writer8", "docx": "docx:MS Word 2007 XML"}[ext]
        with tempfile.TemporaryDirectory() as tmp:
            src = pathlib.Path(tmp, "doc.html")
            src.write_text(page, encoding="utf-8")
            subprocess.run(
                ["soffice", f"-env:UserInstallation=file://{tmp}/profile", "--headless",
                 "--infilter=HTML (StarWriter)", "--convert-to", target, "--outdir", tmp, str(src)],
                check=True, timeout=120, capture_output=True,
            )
            out = pathlib.Path(tmp, f"doc.{ext}")
            data = out.read_bytes()
        if not data:
            raise RuntimeError("empty conversion")
        return data


    def install() -> None:
        from plugins._office.helpers import document_store as ds

        if getattr(ds, "_a0_markdown_patch", False):
            return
        orig_odt, orig_docx = ds.odt_bytes, ds._docx

        def odt_bytes(title, content):
            if _looks_markdown(content):
                try:
                    return _convert(title, content, "odt")
                except Exception:
                    pass
            return orig_odt(title, content)

        def docx_bytes(title, content):
            if _looks_markdown(content):
                try:
                    return _convert(title, content, "docx")
                except Exception:
                    pass
            return orig_docx(title, content)

        ds.odt_bytes, ds._docx = odt_bytes, docx_bytes
        ds._a0_markdown_patch = True


    class OfficeMarkdown(Extension):
        def execute(self, **kwargs):
            install()
  # User plugin firefox_desktop_fix (mounted at /a0/usr/plugins/firefox_desktop_fix).
  # Xpra's HTML5 client polls the browser clipboard on every click
  # (clipboard-direction=both). In Firefox that is navigator.clipboard.readText(),
  # which pops Firefox's own "Paste" button: it swallows the right-button release,
  # so X keeps button 3 held and the next clicks misbehave. Reproduced and fixed
  # in Playwright Firefox 2026-11-18. Agent Zero has its own Ctrl+V paste bridge,
  # so turning the poll off loses nothing.
  firefox-plugin.yaml: |
    name: firefox_desktop_fix
    title: Firefox desktop fix
    description: Stop Xpra's per-click clipboard poll in Firefox, which breaks right-click in the Desktop.
    version: 1.0.0
    settings_sections: []
    per_project_config: false
    per_agent_config: false
  firefox-fix.html: |
    <script>
      (() => {
        if (!/firefox/i.test(navigator.userAgent)) return;
        const patch = (frame) => {
          const win = frame.contentWindow;
          const client = win && win.client;
          if (!client) return false;
          if (!client.__a0NoClipboardPoll) {
            Object.defineProperty(client, "clipboard_poll", { get: () => false, set: () => {}, configurable: true });
            client.__a0NoClipboardPoll = true;
          }
          return true;
        };
        const watch = (frame) => {
          if (frame.__a0FirefoxFix) return;
          frame.__a0FirefoxFix = true;
          const tryPatch = () => {
            let tries = 0;
            const timer = setInterval(() => {
              try { if (patch(frame) || ++tries > 120) clearInterval(timer); } catch (e) { clearInterval(timer); }
            }, 500);
          };
          frame.addEventListener("load", tryPatch);
          tryPatch();
        };
        const scan = () => document.querySelectorAll("iframe[data-office-desktop-frame]").forEach(watch);
        new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true });
        scan();
      })();
    </script>
