# ClusterIP only, no Ingress yet: tested by port-forward first. The web UI and
# the /api_message endpoint both answer on 80 (nginx in the image).
apiVersion: v1
kind: Service
metadata:
  name: agent-zero
  namespace: agent-zero
spec:
  selector:
    app: agent-zero
  ports:
    - name: http
      port: 80
      targetPort: 80
