# Replaces /a0/plugins/_whisper_stt/helpers/runtime.py (v2.15) so the
# microphone button transcribes against the whisper.cpp Wyoming bridge already
# running on work-vm-00 (projects/whisper-stt in the vault) instead of loading
# openai-whisper inside the pod. Only active when WYOMING_STT_ADDR is set.
# Generated from the v2.15 file; re-check the diff when bumping the image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-zero-whisper-runtime
  namespace: agent-zero
data:
  runtime.py: |
    from __future__ import annotations

    import asyncio
    import base64
    import os
    import tempfile
    import warnings
    from typing import Any

    import json
    import socket

    # PATCHED by agonbar-kubernetes deployments/agent-zero (whisper-runtime ConfigMap).
    # With WYOMING_STT_ADDR=host:port set, transcription goes to the existing
    # whisper.cpp Wyoming bridge on work-vm-00 (large-v3-turbo on the A2000) and no
    # local model is ever loaded. Without it this file behaves like the v2.15 original.
    WYOMING_STT_ADDR = os.environ.get("WYOMING_STT_ADDR", "").strip()
    if not WYOMING_STT_ADDR:
        import whisper

    from helpers import files, plugins
    from helpers.notification import (
        NotificationManager,
        NotificationPriority,
        NotificationType,
    )
    from helpers.print_style import PrintStyle
    from plugins._whisper_stt.helpers import migration


    warnings.filterwarnings("ignore", category=FutureWarning)


    PLUGIN_NAME = "_whisper_stt"
    DEFAULT_CONFIG = {
        "model_size": "base",
        "language": "es",
        "message_mode": "send",
        "silence_threshold": 0.3,
        "silence_duration": 1000,
        "waiting_timeout": 2000,
    }
    VALID_MODEL_SIZES = {"tiny", "base", "small", "medium", "large", "turbo"}
    VALID_MESSAGE_MODES = {"send", "draft"}

    _model = None
    _model_name = ""
    is_updating_model = False


    def normalize_config(config: dict[str, Any] | None) -> dict[str, Any]:
        normalized = dict(DEFAULT_CONFIG)
        if not isinstance(config, dict):
            return normalized

        model_size = str(config.get("model_size", normalized["model_size"]) or "").strip()
        if model_size in VALID_MODEL_SIZES:
            normalized["model_size"] = model_size

        language = str(config.get("language", normalized["language"]) or "").strip()
        if language:
            normalized["language"] = language

        message_mode = (
            str(config.get("message_mode", normalized["message_mode"]) or "")
            .strip()
            .lower()
        )
        if message_mode in VALID_MESSAGE_MODES:
            normalized["message_mode"] = message_mode

        try:
            silence_threshold = float(
                config.get("silence_threshold", normalized["silence_threshold"])
            )
            normalized["silence_threshold"] = min(max(silence_threshold, 0.0), 1.0)
        except (TypeError, ValueError):
            pass

        try:
            silence_duration = int(
                config.get("silence_duration", normalized["silence_duration"])
            )
            if silence_duration > 0:
                normalized["silence_duration"] = silence_duration
        except (TypeError, ValueError):
            pass

        try:
            waiting_timeout = int(config.get("waiting_timeout", normalized["waiting_timeout"]))
            if waiting_timeout > 0:
                normalized["waiting_timeout"] = waiting_timeout
        except (TypeError, ValueError):
            pass

        return normalized


    def get_config() -> dict[str, Any]:
        migration.ensure_config_seeded()
        config = plugins.get_plugin_config(PLUGIN_NAME) or {}
        return normalize_config(config)


    def get_loaded_model_name() -> str:
        return _model_name


    def is_globally_enabled() -> bool:
        return plugins.determined_toggle_from_paths(
            True, reversed(plugins.get_plugin_roots(PLUGIN_NAME))
        )


    async def preload(model_name: str | None = None):
        cfg = get_config()
        resolved_model = str(model_name or cfg["model_size"])
        return await _preload(resolved_model)


    async def _preload(model_name: str):
        global _model, _model_name, is_updating_model

        if WYOMING_STT_ADDR:
            _model_name = f"wyoming://{WYOMING_STT_ADDR}"
            return

        while is_updating_model:
            await asyncio.sleep(0.1)

        try:
            is_updating_model = True
            if not _model or _model_name != model_name:
                NotificationManager.send_notification(
                    NotificationType.INFO,
                    NotificationPriority.NORMAL,
                    "Loading Whisper model...",
                    display_time=99,
                    group="whisper-preload",
                )
                PrintStyle.standard(f"Loading Whisper model: {model_name}")
                _model = whisper.load_model(
                    name=model_name,
                    download_root=files.get_abs_path("/tmp/models/whisper"),
                )
                _model_name = model_name
                NotificationManager.send_notification(
                    NotificationType.INFO,
                    NotificationPriority.NORMAL,
                    "Whisper model loaded.",
                    display_time=2,
                    group="whisper-preload",
                )
        finally:
            is_updating_model = False


    async def is_downloading() -> bool:
        return is_updating_model


    async def is_downloaded() -> bool:
        return bool(WYOMING_STT_ADDR) or _model is not None


    async def transcribe(
        audio_bytes_b64: str, config: dict[str, Any] | None = None
    ) -> dict[str, Any]:
        cfg = normalize_config(config or get_config())
        return await _transcribe(
            str(cfg["model_size"]),
            audio_bytes_b64,
            language=_resolve_language(str(cfg["language"])),
        )


    async def _transcribe(
        model_name: str, audio_bytes_b64: str, *, language: str | None = None
    ) -> dict[str, Any]:
        await _preload(model_name)

        audio_bytes = base64.b64decode(audio_bytes_b64)
        if WYOMING_STT_ADDR:
            return await asyncio.to_thread(_wyoming_transcribe, audio_bytes, language)

        with tempfile.NamedTemporaryFile(suffix=".wav", delete=False) as audio_file:
            audio_file.write(audio_bytes)
            temp_path = audio_file.name

        try:
            kwargs: dict[str, Any] = {"fp16": False}
            if language:
                kwargs["language"] = language

            result = _model.transcribe(temp_path, **kwargs)  # type: ignore[union-attr]
            return result if isinstance(result, dict) else {}
        finally:
            try:
                os.remove(temp_path)
            except Exception:
                pass


    def _resolve_language(language: str) -> str | None:
        value = language.strip().lower()
        if not value or value == "auto":
            return None
        return value


    def _wyoming_event(sock: socket.socket, etype: str, data: dict, payload: bytes = b"") -> None:
        header = {"type": etype, "data": data}
        if payload:
            header["payload_length"] = len(payload)
        sock.sendall(json.dumps(header).encode() + b"\n" + payload)


    def _wyoming_transcribe(audio_bytes: bytes, language: str | None) -> dict[str, Any]:
        # The browser's MediaRecorder sends webm/ogg labelled as wav; whisper.cpp
        # wants PCM, so ffmpeg decodes it to 16 kHz mono s16le first.
        import subprocess

        pcm = subprocess.run(
            ["ffmpeg", "-nostdin", "-loglevel", "error", "-i", "pipe:0",
             "-f", "s16le", "-ac", "1", "-ar", "16000", "pipe:1"],
            input=audio_bytes, capture_output=True, check=True, timeout=60,
        ).stdout
        fmt = {"rate": 16000, "width": 2, "channels": 1}
        host, port = WYOMING_STT_ADDR.rsplit(":", 1)
        with socket.create_connection((host, int(port)), timeout=60) as sock:
            _wyoming_event(sock, "transcribe", {"language": language} if language else {})
            _wyoming_event(sock, "audio-start", fmt)
            step = 16000 * 2  # one second per chunk
            for i in range(0, len(pcm), step):
                _wyoming_event(sock, "audio-chunk", fmt, pcm[i:i + step])
            _wyoming_event(sock, "audio-stop", {})
            reader = sock.makefile("rb")
            while True:
                line = reader.readline()
                if not line:
                    raise RuntimeError("Wyoming STT closed the connection without a transcript")
                header = json.loads(line)
                data = header.get("data") or {}
                if header.get("data_length"):
                    data = json.loads(reader.read(header["data_length"]))
                if header.get("payload_length"):
                    reader.read(header["payload_length"])
                if header.get("type") == "transcript":
                    return {"text": data.get("text", ""), "language": language or ""}
