# Public entry: agente.${BASE_DOMAIN}, TLS from letsencrypt-prod.
#
# Two locks in series. Traefik basicAuth first, with a long random password,
# so nothing reaches Agent Zero's own login (a single password, no 2FA, guarding
# a root shell with internet access) unless the outer one is right. Both
# credentials are in the personal Vaultwarden. No Authentik on purpose: that
# one is Sensei's, this is personal.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: agente-auth
  namespace: agent-zero
spec:
  basicAuth:
    secret: agent-zero-basicauth
    realm: agente
    removeHeader: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agente-https
  namespace: agent-zero
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: agent-zero-agente-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: agente.${BASE_DOMAIN}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: agent-zero
                port:
                  number: 80
  tls:
    - secretName: agente.${BASE_DOMAIN}
      hosts:
        - agente.${BASE_DOMAIN}
