# Public entry: agente.${BASE_DOMAIN}, TLS from letsencrypt-prod.
#
# Only Agent Zero's own login guards it (decided 2026-11-12; a Traefik
# basicAuth in front was tried and removed). Keep in mind what that login does
# not cover: /api/api_* take an X-API-KEY derived from AUTH_LOGIN and
# AUTH_PASSWORD, and /api/rfc is closed only because RFC_PASSWORD is unset.
# Never set RFC_PASSWORD here. No Authentik: that one is Sensei's.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agente-https
  namespace: agent-zero
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: agente.${BASE_DOMAIN}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: agent-zero
                port:
                  number: 80
  tls:
    - secretName: agente.${BASE_DOMAIN}
      hosts:
        - agente.${BASE_DOMAIN}
