apiVersion: apps/v1
kind: Deployment
metadata:
  name: cruncharr-deployment
  namespace: piracy
  labels:
    app: cruncharr
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: cruncharr
  template:
    metadata:
      labels:
        app: cruncharr
    spec:
      containers:
        - name: cruncharr
          image: ghcr.io/agonbar/cruncharr:latest
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Europe/Madrid
            - name: ANIDL_CRUNCHYROLL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cruncharr
                  key: crunchyroll-username
            - name: ANIDL_CRUNCHYROLL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cruncharr
                  key: crunchyroll-password
            - name: ANIDL_GUI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cruncharr
                  key: gui-password
            # State lives in the nas02 Postgres, not in a SQLite file on this volume.
            # Note the tailnet address: cruncharr runs on workload=media nodes, which
            # have no route to nas02's LAN address. Unset this and the app falls back
            # to SQLite. See docs/DATABASE.md in the cruncharr repo.
            - name: ANIDL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cruncharr
                  key: database-url
            - name: ANIDL_SONARR_ENABLED
              value: "true"
            - name: ANIDL_SONARR_FANSUB
              value: "Cruncharr"
            - name: ANIDL_DIR_CONTENT
              value: /downloads/cruncharr
            - name: ANIDL_DIR_TRASH
              value: /downloads/cruncharr/_trash
          ports:
            - containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /data/config
            - name: downloads
              mountPath: /downloads
          livenessProbe:
            httpGet:
              path: /api/app/status
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 60
            # Bun's event loop blocks for several seconds when shaka-packager /
            # mp4decrypt / mkvmerge subprocesses are spawned, so the probe
            # needs a long timeout to avoid spurious kills under load.
            timeoutSeconds: 60
            failureThreshold: 5
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
      volumes:
        - name: config
          # NFS instead of iSCSI, same reason the rest of the cluster is moving:
          # when the link to nas02 drops, an NFS mount blocks and resumes, where the
          # iSCSI LUN flipped read-only and took ext4 down with it. That is what kept
          # stopping the download queue with "disk I/O error".
          #
          # This only became possible once the database moved to Postgres. SQLite
          # cannot live on NFS — the locking semantics corrupt it.
          #
          # Inline rather than the truenas-nfs-ssd storage class on purpose: that
          # class binds Immediate and its CSI node plugin does not run on work-vm-00,
          # so the pod could be scheduled onto a node where the volume cannot mount.
          # The downloads volume below already takes this route and works.
          nfs:
            server: nas02
            path: /mnt/SSD/cruncharr-config
        - name: downloads
          # nas02 is the same TrueNAS as 192.168.0.29 — using the tailnet
          # hostname lets the pod schedule on encoder VMs in the aya LAN
          # which only reach the NAS over tailnet.
          nfs:
            server: nas02
            path: /mnt/SSD/torrents/
      nodeSelector:
        workload: media
      tolerations:
        - {key: dedicated, operator: Equal, value: media, effect: NoSchedule}
        # Tolerate the node disk-pressure taint so a transient node-disk spike
        # doesn't strand cruncharr as Pending for hours. On 2026-07-19 all three
        # workload=media nodes hit DiskPressure at once (partly from cruncharr's
        # own shaka-packager coredumps piling up in /var/lib/systemd/coredump),
        # kubelet tainted them, and this pod — which only tolerated dedicated=media
        # — had nowhere to schedule for 30h. tdarr already tolerates it.
        # NOTE: this only helps once node disk recovers enough for the democratic-csi
        # node-plugin (which is NOT disk-pressure-tolerant) to re-register; the real
        # mitigation is capping coredump retention so cruncharr stops filling nodes.
        - {key: node.kubernetes.io/disk-pressure, operator: Exists, effect: NoSchedule}
---
apiVersion: v1
kind: Service
metadata:
  name: cruncharr
  namespace: piracy
spec:
  type: ClusterIP
  ports:
    - name: web
      protocol: TCP
      port: 3000
      targetPort: 3000
  selector:
    app: cruncharr
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cruncharr-https
  namespace: piracy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: cruncharr.${BASE_DOMAIN}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: cruncharr
                port:
                  number: 3000
  tls:
    - secretName: cruncharr.${BASE_DOMAIN}
      hosts:
        - cruncharr.${BASE_DOMAIN}
