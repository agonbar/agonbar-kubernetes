apiVersion: apps/v1
kind: Deployment
metadata:
    name: flaresolverr-deployment # <--- change this
    namespace: piracy
    labels:
        app: flaresolverr # <--- change this to match label on the pod
spec:
    replicas: 1
    selector:
        matchLabels:
            app: flaresolverr # <--- change this to match label on the pod
    template:
        metadata:
            labels:
                app: flaresolverr
        spec:
            containers:
                - name: flaresolverr
                  image: ghcr.io/flaresolverr/flaresolverr:latest
                  imagePullPolicy: Always
                  env:
                      - name: LOG_LEVEL
                        value: info
                      - name: LOG_HTML
                        value: "false"
                      - name: CAPTCHA_SOLVER
                        value: none
                      - name: TZ
                        value: Europe/Madrid
                  ports:
                      - containerPort: 8191
                        protocol: TCP
                  # FlareSolverr answers /health from the same single-threaded server
                  # that drives the browser, so a queued Cloudflare challenge makes
                  # the probe time out on a process that is healthy, just busy.
                  # Measured 2026-09-08 on orange-pi5: 23s median per challenge,
                  # 98.6s worst case. The old 5s x 3 window (~45s) killed it
                  # mid-burst and took every indexer behind the proxy down with it.
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: 8191
                      initialDelaySeconds: 30
                      periodSeconds: 30
                      timeoutSeconds: 30
                      failureThreshold: 6
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 8191
                      initialDelaySeconds: 15
                      periodSeconds: 30
                      timeoutSeconds: 30
                      failureThreshold: 6
                  resources:
                      requests:
                          memory: 128Mi
                          cpu: 100m
                      limits:
                          memory: 1Gi
                          cpu: 1000m
            # Tried on ovh02 2026-08-24 to take load off orange-pi5, reverted the
            # same day. The pod network between the home nodes and ovh02 is not
            # reliable: hours after the move BOTH nas01 and orange-pi5 timed out
            # reaching ovh02 pod IPs, so prowlarr lost its FlareSolverr and every
            # Cloudflare-gated indexer started failing. Connectivity tested fine at
            # the time of the move -- the link is intermittent, not simply down.
            #
            # Keep it next to the thing that calls it until that link is fixed.
            nodeSelector:
              svccontroller.k3s.cattle.io/lbpool: lamg
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: piracy
spec:
  type: ClusterIP
  ports:
    - name: web
      protocol: TCP
      port: 8191
      targetPort: 8191
  selector:
    app: flaresolverr
---