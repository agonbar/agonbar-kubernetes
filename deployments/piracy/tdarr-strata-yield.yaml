# strata-yield: lets the tdarr-node on Strata's machine transcode only while Strata is idle.
#
# Runs inside every tdarr-node container as an s6 service (mounted at
# /etc/services.d/strata-yield, where the image keeps tdarr_node itself) but does nothing
# unless Strata's pod is on the same node. Not a sidecar: shareProcessNamespace would make
# the pause container PID 1, and the image's s6-overlay exits 100 unless it is PID 1. There it SIGSTOPs every ffmpeg while the strata-gateway reports a request in
# flight or queued, and SIGCONTs them once Strata has been idle for IDLE_S. A paused
# transcode loses nothing and gives Strata all the CPU and memory bandwidth back at once.
#
# Strata's node is looked up through the API (Role below), not pinned by name, so the
# yield follows Strata if it ever moves. Any node can be given to Tdarr this way with the
# label tdarr=strata-idle (see tdarr-node.yml); kubernetes-10 has it since 2026-11-11,
# when Strata was busy 72 minutes out of 72 hours.
apiVersion: v1
kind: ServiceAccount
metadata:
    name: tdarr-node
    namespace: piracy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: tdarr-strata-yield
    namespace: strata
rules:
    - apiGroups: ['']
      resources: [pods]
      verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: tdarr-strata-yield
    namespace: strata
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: tdarr-strata-yield
subjects:
    - kind: ServiceAccount
      name: tdarr-node
      namespace: piracy
---
apiVersion: v1
kind: ConfigMap
metadata:
    name: tdarr-strata-yield
    namespace: piracy
data:
    run: |
        #!/usr/bin/with-contenv python3
        import json, os, signal, ssl, sys, time, urllib.request

        NODE = os.environ["NODE_HOSTNAME"]
        STATUS = "http://strata.strata.svc.cluster.local:8080/gateway/status"
        IDLE_S = float(os.environ.get("IDLE_S", "120"))
        SA = "/var/run/secrets/kubernetes.io/serviceaccount/"
        API = "https://kubernetes.default.svc/api/v1/namespaces/strata/pods?labelSelector=app%3Dstrata"


        def get(url, token=None, ctx=None):
            req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token} if token else {})
            with urllib.request.urlopen(req, timeout=5, context=ctx) as r:
                return json.load(r)


        def strata_node():
            ctx = ssl.create_default_context(cafile=SA + "ca.crt")
            pods = get(API, open(SA + "token").read(), ctx)["items"]
            return next((p["spec"].get("nodeName") for p in pods if p["status"].get("phase") == "Running"), None)


        def strata_busy():
            s = get(STATUS)
            return bool(s["in_flight"]) or any(s["queued"].values())


        def ffmpegs():
            for pid in filter(str.isdigit, os.listdir("/proc")):
                try:
                    with open(f"/proc/{pid}/cmdline", "rb") as f:
                        exe = f.read().split(b"\0")[0]
                except OSError:
                    continue
                if b"ffmpeg" in os.path.basename(exe):
                    yield int(pid)


        def signal_all(sig):
            for pid in ffmpegs():
                try:
                    os.kill(pid, sig)
                except ProcessLookupError:
                    pass


        def stop(*_):
            signal_all(signal.SIGCONT)
            sys.exit(0)


        signal.signal(signal.SIGTERM, stop)
        paused, last_busy, node, node_at = False, 0.0, None, 0.0
        while True:
            now = time.monotonic()
            try:
                if now - node_at > 60:
                    node, node_at = strata_node(), now
                busy = node == NODE and strata_busy()
            except Exception as e:  # API or gateway down: nothing to yield to
                print("check failed:", e, flush=True)
                busy = False
            if busy:
                last_busy = now
            want = node == NODE and now - last_busy < IDLE_S
            if want:
                signal_all(signal.SIGSTOP)  # every tick, to catch ffmpegs started meanwhile
            if want != paused:
                if not want:
                    signal_all(signal.SIGCONT)
                paused = want
                print("strata busy, transcodes paused" if want else "strata idle, transcodes resumed", flush=True)
            time.sleep(3)
