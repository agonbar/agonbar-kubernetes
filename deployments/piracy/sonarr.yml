apiVersion: apps/v1
kind: Deployment
metadata:
    name: sonarr-deployment # <--- change this
    namespace: piracy
    labels:
        app: sonarr # <--- change this to match label on the pod
spec:
    strategy:
        type: Recreate
    replicas: 1
    selector:
        matchLabels:
            app: sonarr # <--- change this to match label on the pod
    template:
        metadata:
            labels:
                app: sonarr
        spec:
            initContainers:
                - name: iscsi-fsck
                  image: alpine:latest
                  imagePullPolicy: IfNotPresent
                  securityContext:
                      privileged: true
                  command:
                      - /bin/sh
                      - -c
                      - |
                        set -e
                        MOUNTPOINT="/config"
                        echo "[iscsi-fsck] Checking filesystem at ${MOUNTPOINT}..."
                        if touch "${MOUNTPOINT}/.rw-test" 2>/dev/null; then
                          rm -f "${MOUNTPOINT}/.rw-test"
                          echo "[iscsi-fsck] Filesystem is writable. Nothing to do."
                          exit 0
                        fi
                        echo "[iscsi-fsck] Filesystem is READ-ONLY."
                        echo "[iscsi-fsck] Attempting a single safe remount,rw (no fsck)..."
                        if mount -o remount,rw "${MOUNTPOINT}" 2>/dev/null && touch "${MOUNTPOINT}/.rw-test" 2>/dev/null; then
                          rm -f "${MOUNTPOINT}/.rw-test"
                          echo "[iscsi-fsck] remount,rw succeeded — filesystem writable. Done."
                          exit 0
                        fi
                        echo "[iscsi-fsck] STILL READ-ONLY. The RO state lives in the node-level CSI globalmount and cannot be repaired from inside the pod."
                        echo "[iscsi-fsck] DO NOT run e2fsck on the mounted device — it corrupts the filesystem."
                        echo "[iscsi-fsck] Recovery: scale this Deployment to 0, wait for the VolumeAttachment to detach, then scale back to 1 (forces a clean iSCSI re-attach that clears RO)."
                        exit 1
                  volumeMounts:
                      - name: config
                        mountPath: /config
                      - name: host-proc-mounts
                        mountPath: /host-proc-mounts
            containers:
                - name: sonarr
                  image: linuxserver/sonarr:latest
                  imagePullPolicy: Always
                  env:
                      - name: PGID
                        value: '950'
                      - name: PUID
                        value: '950'
                      - name: TZ
                        value: Europe/Madrid
                  ports:
                      - containerPort: 8989
                        protocol: TCP
                  volumeMounts:
                      - name: config
                        mountPath: /config
                      - name: downloads
                        mountPath: /downloads
                      - name: tv
                        mountPath: /tv
                      - name: series
                        mountPath: /SERIES
                  livenessProbe:
                      httpGet:
                          path: /ping
                          port: 8989
                      initialDelaySeconds: 30
                      periodSeconds: 15
                      timeoutSeconds: 30
                      failureThreshold: 6
                  readinessProbe:
                      httpGet:
                          path: /ping
                          port: 8989
                      initialDelaySeconds: 15
                      periodSeconds: 10
                      timeoutSeconds: 10
                      failureThreshold: 3
                  resources:
                      requests:
                          # Idles around 860Mi, so the old 256Mi request was a
                          # lie to the scheduler: the nodeSelector below matches
                          # nas00, which has 1.2Gi allocatable in total.
                          memory: 1Gi
                          cpu: 100m
                      limits:
                          # OOMKilled at 2.5Gi on 2026-09-16 halfway through a
                          # ManualImport of an 11-file pack over NFS, which also
                          # silently dropped a queued ManualImport command.
                          memory: 4Gi
                          cpu: 2000m
            volumes:
                - name: config
                  persistentVolumeClaim:
                      claimName: sonarr-config-nfs
                - name: tv
                  nfs:
                      server: 192.168.0.29
                      path: /mnt/RAID/docker/media/tv
                - name: series
                  nfs:
                      server: 192.168.0.29
                      path: /mnt/RAID/docker/media/SERIES
                - name: downloads
                  nfs:
                      server: 192.168.0.29
                      path: /mnt/SSD/torrents
                - name: host-proc-mounts
                  hostPath:
                      path: /proc/1/mounts
            nodeSelector:
              svccontroller.k3s.cattle.io/lbpool: lamg
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: piracy
spec:
  type: ClusterIP
  ports:
    - name: web
      protocol: TCP
      port: 8989
      targetPort: 8989
  selector:
    app: sonarr
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr-https
  namespace: piracy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: sonarr.${BASE_DOMAIN}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: sonarr
                port:
                  number: 8989
  tls:
    - secretName: sonarr.${BASE_DOMAIN}
      hosts:
        - sonarr.${BASE_DOMAIN}
---
# Moved off iSCSI on 2026-09-03. This app's database lives in the nas02 Postgres
# now, so what is left here is config.xml, MediaCover and logs: no reason to keep
# an ext4 journal on a network block device, which is what kept corrupting.
# Old claim kept declared as the rollback.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config-nfs
  namespace: piracy
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: truenas-nfs-ssd-lan
  resources:
    requests:
      storage: 5Gi
