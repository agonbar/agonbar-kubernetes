# RomM — ROM library manager for the EmuDeck collection on nas02.
#
# Scope of this first deployment: the EmuDeck library only
# (/mnt/RAID/docker/syncthing/config/Emudeck, 189 platform folders under roms/).
# The second collection in /mnt/RAID/adrian/_ADRIAN/Juegos is NOT here: that path
# has no NFS export, and exporting the whole home would hand the cluster a folder
# full of contracts and scanned IDs. Those ROMs get moved, then added as a
# second library source.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm
  namespace: piracy
  labels:
    app: romm
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: romm
  template:
    metadata:
      labels:
        app: romm
    spec:
      # Kubernetes injects docker-link-style variables for every Service in the
      # namespace, and the Service here is called `romm`, so ROMM_PORT arrives as
      # "tcp://10.43.x.x:8080". The entrypoint does
      # `export ROMM_PORT=${ROMM_PORT:-8080}` and feeds it to nginx's listen
      # directive, which then refuses to start with "invalid host". Nothing here
      # reads the injected variables.
      enableServiceLinks: false
      containers:
        - name: romm
          # Pinned for GitOps reproducibility. Bumping runs alembic migrations on
          # boot, so read the release notes before moving it.
          image: rommapp/romm:5.2.0
          imagePullPolicy: IfNotPresent
          env:
            # Postgres on the same nas02 PG17 the Servarr apps, Suwayomi and
            # anisub already use. RomM ships MariaDB in its example compose, but
            # config_manager.py accepts "postgresql" and maps it to psycopg.
            - name: ROMM_DB_DRIVER
              value: postgresql
            - name: DB_HOST
              value: "192.168.0.29"
            # Required. DB_PORT defaults to 3306 (config/__init__.py), so leaving
            # it out silently points Postgres traffic at the MariaDB port.
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: romm
            - name: DB_USER
              value: romm
            - name: DB_PASSWD
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: db-password
            - name: ROMM_AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: auth-secret-key
            # Kept at 1 on purpose. base_handler.py builds the engine with
            # pool_pre_ping but no pool_size, so each worker takes SQLAlchemy's
            # default 5 + 10 overflow. nas02 runs max_connections=100 shared
            # across 8 apps and already fell over once on 2026-09-03 when the
            # pool ran dry. One worker caps RomM's share at 15.
            - name: WEB_SERVER_CONCURRENCY
              value: "1"
            # The library lives on NFS and holds .7z archives, which upstream
            # reports as slow to hash. Two workers, raise it once a full scan has
            # been timed.
            - name: SCAN_WORKERS
              value: "2"
            # Hash matching against No-Intro/Redump. This is what identifies the
            # library at all: 98% of these filenames carry no region tag and 100%
            # carry no language tag, so the filename tells RomM almost nothing.
            - name: HASHEOUS_API_ENABLED
              value: "true"
            # A second hash matcher alongside Hasheous: playmatch_handler.py
            # looks up by SHA1/MD5/CRC too. It is the only one of these that
            # attacks the real gap (4 of 9 gba ROMs unidentified), and it keeps
            # scans working on days like 2026-09-10, when hasheous.org served
            # 502 from its own health check for hours.
            - name: PLAYMATCH_API_ENABLED
              value: "true"
            # More cover sources, and playtime estimates. Neither needs an
            # account; both sit below IGDB and ScreenScraper in the artwork
            # priority, so they only fill gaps.
            - name: TGDB_API_ENABLED
              value: "true"
            - name: HLTB_API_ENABLED
              value: "true"
            # Metadata providers. optional: true so the pod still starts before
            # the keys exist; RomM reads an unset variable as "provider off",
            # which is the state the heartbeat reports today. Sealed by
            # scripts/wizard-romm-metadata-keys.sh, which adds them to the same
            # piracy/romm SealedSecret that already holds the database password.
            #
            # IGDB is the one that matters: without it there are no covers, and
            # the RomM Playnite plugin refuses to run at all.
            - name: IGDB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: igdb-client-id
                  optional: true
            - name: IGDB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: igdb-client-secret
                  optional: true
            # ScreenScraper ships dev credentials inside the image, so this only
            # raises the rate limit and unlocks the Spanish regional media that
            # scan.priority.region is set up to prefer.
            - name: SCREENSCRAPER_USER
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: screenscraper-user
                  optional: true
            - name: SCREENSCRAPER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: screenscraper-password
                  optional: true
            # Logros por juego y progreso. Solo pide la Web API key, no usuario.
            - name: RETROACHIEVEMENTS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: retroachievements-api-key
                  optional: true
            # Grids and heroes, which is the art Playnite and Big Picture show
            # on the shortcuts. Matters for the living-room VM, not for the
            # RomM web UI.
            - name: STEAMGRIDDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: steamgriddb-api-key
                  optional: true
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            # The consolidated library, built by scripts/rom-consolidate.py from
            # the EmuDeck tree and the hand-picked collection under
            # _ADRIAN/Juegos, each file renamed to its No-Intro name so RomM can
            # read region and language off it. Writable, unlike the EmuDeck tree
            # it replaces: nothing else owns this one, so RomM renaming or
            # uploading here cannot collide with Syncthing.
            - name: library
              mountPath: /romm/library
            # Switch stays where it is. Its 31 NSPs are 95 GB, an order of
            # magnitude more than everything else combined, and copying them
            # buys nothing RomM can use: No-Intro does not cover Switch, so
            # there is no canonical name to rename them to.
            - name: emudeck-switch
              mountPath: /romm/library/roms/switch
              readOnly: true
            - name: emudeck-bios
              mountPath: /romm/library/bios
              readOnly: true
            - name: data
              mountPath: /romm/resources
              subPath: resources
            - name: data
              mountPath: /romm/assets
              subPath: assets
            - name: config
              mountPath: /romm/config
            # Valkey runs inside the image; the example compose gives it a
            # volume. It is a task cache, so an interrupted scan is the worst an
            # empty dir costs.
            - name: redis-data
              mountPath: /redis-data
          startupProbe:
            httpGet:
              path: /api/heartbeat
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/heartbeat
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 2Gi
              cpu: "2"
      volumes:
        - name: library
          nfs:
            server: 192.168.0.29
            path: /mnt/RAID/docker/romm-library
        - name: emudeck-switch
          nfs:
            server: 192.168.0.29
            path: /mnt/RAID/docker/syncthing/config/Emudeck/roms/switch
            readOnly: true
        - name: emudeck-bios
          nfs:
            server: 192.168.0.29
            path: /mnt/RAID/docker/syncthing/config/Emudeck/bios
            readOnly: true
        - name: data
          persistentVolumeClaim:
            claimName: romm-data
        - name: config
          configMap:
            name: romm-config
        - name: redis-data
          emptyDir: {}
      nodeSelector:
        svccontroller.k3s.cattle.io/lbpool: lamg

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-data
  namespace: piracy
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-ssd-lan
  resources:
    requests:
      storage: 20Gi

---
# config.yml lives here rather than on the volume so the platform mapping is
# reviewable in git. Folder names in the library are matched case-sensitively.
apiVersion: v1
kind: ConfigMap
metadata:
  name: romm-config
  namespace: piracy
data:
  config.yml: |
    exclude:
      # The consolidated tree holds eight platform directories and nothing
      # else, so the long exclusion list the EmuDeck tree needed is gone with
      # it: no emulator installs under roms/, no launcher shims, and none of
      # the 172 empty platform folders EmuDeck creates whether or not you own
      # a game for them. What is left is the debris that travels with the ROMs
      # themselves.
      roms:
        single_file:
          extensions:
            - txt
            - xml
            - cfg
            - dat
          names:
            - '._*'
            - '*.sync-conflict-*'

    scan:
      priority:
        # Spain first. Default is ["us","wor","ss","eu","jp"], which picks the
        # US release of everything. prefer_config makes this win over the
        # filename tags, which is what we want while the filenames carry no
        # region at all.
        region:
          - sp
          - eu
          - wor
          - us
          - jp
        region_mode: prefer_config
        language:
          - es
          - en

---
apiVersion: v1
kind: Service
metadata:
  name: romm
  namespace: piracy
spec:
  type: NodePort
  selector:
    app: romm
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: romm

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: romm-https
  namespace: piracy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: romm.${BASE_DOMAIN}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: romm
                port:
                  number: 8080
  tls:
    - secretName: romm.${BASE_DOMAIN}
      hosts:
        - romm.${BASE_DOMAIN}
