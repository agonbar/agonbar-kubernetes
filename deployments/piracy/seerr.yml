apiVersion: apps/v1
kind: Deployment
metadata:
    name: seerr-deployment
    namespace: piracy
    labels:
        app: seerr
spec:
    strategy:
        type: Recreate
    replicas: 1
    selector:
        matchLabels:
            app: seerr
    template:
        metadata:
            labels:
                app: seerr
        spec:
            initContainers:
                - name: fix-permissions
                  image: busybox:latest
                  command: ["sh", "-c", "chown -R 1000:1000 /app/config"]
                  volumeMounts:
                      - name: config
                        mountPath: /app/config
            containers:
                - name: seerr
                  image: ghcr.io/seerr-team/seerr:latest
                  imagePullPolicy: Always
                  env:
                      - name: LOG_LEVEL
                        value: debug
                      - name: TZ
                        value: Europe/Madrid
                      - name: PORT
                        value: "5055"
                      # Postgres on nas02 instead of the bundled SQLite. The
                      # SQLite lived on an iSCSI volume, which is how it got a
                      # 4 MB WAL sitting next to a 536 KB database after the
                      # 2026-09-03 journal abort. DB_NAME defaults to "seerr"
                      # and DB_PORT to 5432, both spelled out anyway.
                      - name: DB_TYPE
                        value: postgres
                      - name: DB_HOST
                        value: "192.168.0.29"
                      - name: DB_PORT
                        value: "5432"
                      - name: DB_NAME
                        value: seerr
                      - name: DB_USER
                        value: seerr
                      - name: DB_PASS
                        valueFrom:
                            secretKeyRef:
                                name: seerr-db
                                key: password
                  ports:
                      - containerPort: 5055
                        protocol: TCP
                  volumeMounts:
                      - name: config
                        mountPath: /app/config
                  livenessProbe:
                      httpGet:
                          path: /api/v1/status
                          port: 5055
                      initialDelaySeconds: 20
                      periodSeconds: 15
                      timeoutSeconds: 3
                      failureThreshold: 3
                  resources:
                      requests:
                          memory: 128Mi
                          cpu: 100m
                      limits:
                          memory: 1Gi
                          cpu: 500m
            volumes:
                - name: config
                  persistentVolumeClaim:
                      claimName: seerr-config-nfs
            nodeSelector:
                svccontroller.k3s.cattle.io/lbpool: lamg
---
apiVersion: v1
kind: Service
metadata:
    name: seerr
    namespace: piracy
spec:
    type: ClusterIP
    ports:
        - name: web
          protocol: TCP
          port: 5055
          targetPort: 5055
    selector:
        app: seerr
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: seerr-https
    namespace: piracy
    annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
    ingressClassName: traefik
    rules:
        - host: seerr.${BASE_DOMAIN}
          http:
              paths:
                  - pathType: Prefix
                    path: /
                    backend:
                        service:
                            name: seerr
                            port:
                                number: 5055
    tls:
        - secretName: seerr.${BASE_DOMAIN}
          hosts:
              - seerr.${BASE_DOMAIN}
---
# Moved off truenas-iscsi-ssd-lan on 2026-09-24, once the database went to the
# nas02 Postgres. What is left here is settings.json, the anime-list mapping,
# logs and the image cache. The old db.sqlite3 stays in place as the record of
# the pre-Postgres state; nothing reads it any more.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seerr-config-nfs
  namespace: piracy
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-nfs-ssd-lan
  resources:
    requests:
      storage: 5Gi
