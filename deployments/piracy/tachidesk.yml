apiVersion: apps/v1
kind: Deployment
metadata:
    name: tachidesk-deployment # <--- change this
    namespace: piracy
    labels:
        app: tachidesk # <--- change this to match label on the pod
spec:
    strategy:
        type: Recreate
    replicas: 1
    selector:
        matchLabels:
            app: tachidesk # <--- change this to match label on the pod
    template:
        metadata:
            labels:
                app: tachidesk
        spec:
            dnsPolicy: "None"
            dnsConfig:
                nameservers:
                    - 1.1.1.1
            initContainers:
                - name: fix-permissions
                  image: busybox:latest
                  command: ["sh", "-c", "chown -R 1000:1000 /home/suwayomi/.local/share/Tachidesk"]
                  volumeMounts:
                      - name: data
                        mountPath: /home/suwayomi/.local/share/Tachidesk
            containers:
                - name: tachidesk
                  # Pinned for GitOps reproducibility (was floating :stable).
                  # Bump deliberately; v2.x->v2.y runs SQLite migrations on boot.
                  image: ghcr.io/suwayomi/tachidesk:v2.3.2243
                  imagePullPolicy: IfNotPresent
                  # Postgres instead of the bundled H2, on the same nas02 PG17 the
                  # Servarr apps and Home Assistant already use. H2 kept its store on
                  # this iSCSI volume and lost it twice: recovery artefacts from
                  # 29-Jul, then database.mv.db.corrupt-20260901 when the journal
                  # aborted on 1-Sep. Both times the .tachibk backups were unharmed,
                  # which is the only reason the library survived.
                  #
                  # The image's startup script copies DATABASE_* into server.conf, so
                  # these are the documented knobs and not a hack. Postgres support is
                  # marked beta upstream (merged 2025-09-02, PR #1617); the H2 store is
                  # left in place on the volume as the rollback.
                  #
                  # The IP is deliberate: this pod runs with dnsPolicy None pointing at
                  # 1.1.1.1, so it cannot resolve anything on the LAN by name.
                  env:
                      - name: DATABASE_TYPE
                        value: POSTGRESQL
                      - name: DATABASE_URL
                        value: postgresql://192.168.0.29:5432/suwayomi
                      - name: DATABASE_USERNAME
                        value: suwayomi
                      - name: DATABASE_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: suwayomi-db
                                key: password
                  ports:
                      - containerPort: 4567
                        protocol: TCP
                  volumeMounts:
                      - name: data
                        mountPath: /home/suwayomi/.local/share/Tachidesk
                      # Shared manga library = a subdir of the media NFS export.
                      # Set Suwayomi's downloadsPath to /media/manga in the web UI
                      # so raws land where mokuro-ocr can read them.
                      - name: manga
                        mountPath: /media
                  startupProbe:
                      httpGet:
                          path: /
                          port: 4567
                      # Suwayomi's JCEF/Chromium cold boot can take >5min on a
                      # slow node after downtime; give it 10min before restarting
                      # (it bound :4567 only after WebUI+JCEF init in testing).
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 60
                  livenessProbe:
                      httpGet:
                          path: /
                          port: 4567
                      periodSeconds: 15
                      timeoutSeconds: 5
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /
                          port: 4567
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  resources:
                      requests:
                          memory: 512Mi
                          cpu: 250m
                      limits:
                          # Was 100m — far too tight: Suwayomi + its embedded
                          # JCEF/Chromium got CPU-throttled to a crawl (cgroup
                          # throttled_time ~1223s), making JCEF boot take ~9min
                          # and WebUI GraphQL queries 13-24s ("loading forever"
                          # on the Extensions page). Allow bursting to 2 cores.
                          memory: 2Gi
                          cpu: "2"
            volumes:
                - name: data
                  persistentVolumeClaim:
                      claimName: tachidesk-data-nfs
                - name: manga
                  nfs:
                      server: 192.168.0.29
                      path: /mnt/RAID/docker/media
            nodeSelector:
              svccontroller.k3s.cattle.io/lbpool: lamg

---
kind: Service
apiVersion: v1
metadata:
  name: tachidesk
  namespace: piracy
spec:
  type: NodePort

  selector:
    app: tachidesk

  ports:
    - protocol: TCP
      port: 4567
      targetPort: 4567
      name: tachidesk


---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tachidesk-https
  namespace: piracy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: tachidesk.${BASE_DOMAIN}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: tachidesk
                port:
                  number: 4567
  tls:
    - secretName: tachidesk.${BASE_DOMAIN}
      hosts:
        - tachidesk.${BASE_DOMAIN}
---
# Moved off truenas-iscsi-ssd-lan on 2026-09-24. Suwayomi's database has been the
# nas02 Postgres for a while (see DATABASE_TYPE above); what is left here is the
# bundled JRE, the webUI bundle, extensions, thumbnail cache and the local
# library. The database.mv.db files still in the root are leftovers of that
# migration, kept as the only record of the pre-Postgres state.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tachidesk-data-nfs
  namespace: piracy
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-nfs-ssd-lan
  resources:
    requests:
      storage: 5Gi
