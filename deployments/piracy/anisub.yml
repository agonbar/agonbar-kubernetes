apiVersion: apps/v1
kind: Deployment
metadata:
    name: anisub-deployment
    namespace: piracy
    labels:
        app: anisub
spec:
    strategy:
        type: RollingUpdate
    replicas: 1
    selector:
        matchLabels:
            app: anisub
    template:
        metadata:
            labels:
                app: anisub
        spec:
            enableServiceLinks: false
            containers:
                - name: anisub
                  image: ghcr.io/agonbar/anisub:latest
                  imagePullPolicy: Always
                  env:
                      - name: BAZARR_URL
                        value: "http://bazarr:6767"
                      - name: SONARR_URL
                        value: "http://sonarr:8989"
                      - name: CRUNCHARR_URL
                        value: "http://cruncharr:3000"
                      - name: BAZARR_API_KEY
                        valueFrom:
                            secretKeyRef:
                                name: anisub-secrets
                                key: BAZARR_API_KEY
                      - name: SONARR_API_KEY
                        valueFrom:
                            secretKeyRef:
                                name: anisub-secrets
                                key: SONARR_API_KEY
                      - name: CRUNCHARR_API_KEY
                        valueFrom:
                            secretKeyRef:
                                name: anisub-secrets
                                key: CRUNCHARR_API_KEY
                      - name: DATABASE_URL
                        valueFrom:
                            secretKeyRef:
                                name: anisub-db
                                key: DATABASE_URL
                      - name: WEB_PORT
                        value: "8080"
                      - name: POLL_INTERVAL
                        value: "30m"
                      - name: HTTP_TIMEOUT
                        value: "180s"
                      - name: CHECK_CONCURRENCY
                        value: "3"
                      - name: TRIGGER_BATCH_SIZE
                        value: "5"
                      - name: TRIGGER_BATCH_DELAY
                        value: "30s"
                      - name: DRY_RUN
                        value: "false"
                      - name: LOG_LEVEL
                        value: "info"
                      - name: DISCOVERY_ENABLED
                        value: "true"
                      - name: SONARR_PUBLIC_URL
                        value: "https://sonarr.${BASE_DOMAIN}"
                      - name: UPGRADE_NON_CRUNCHYROLL
                        value: "true"
                      - name: UPGRADE_DRY_RUN
                        value: "false"
                      - name: FORCE_GRAB_ENABLED
                        value: "true"
                      - name: FORCE_GRAB_DRY_RUN
                        value: "false"
                      - name: FORCE_GRAB_INDEXER_NAME
                        value: "Cruncharr"
                      - name: FORCE_GRAB_MAX_CRUNCHARR_QUEUE
                        value: "20"
                      - name: CRUNCHARR_QBIT_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: cruncharr
                                key: gui-password
                      - name: FORCEGRAB_RESCAN_DELAYS
                        value: "10m,8h,24h,72h,168h"
                  ports:
                      - containerPort: 8080
                        protocol: TCP
                  resources:
                      requests:
                          memory: 64Mi
                          cpu: 50m
                      limits:
                          memory: 256Mi
                          cpu: 250m
                  # Liveness must not touch Postgres: the database is on nas02,
                  # so a LAN blip would restart a perfectly healthy process,
                  # and a restart cannot fix a network problem.
                  livenessProbe:
                      httpGet:
                          path: /healthz
                          port: 8080
                      initialDelaySeconds: 10
                      periodSeconds: 30
                      timeoutSeconds: 5
                      failureThreshold: 3
                  # Readiness does check the database — serving the dashboard
                  # without it is pointless. timeoutSeconds was defaulting to
                  # 1s, too tight for a round trip to nas02.
                  readinessProbe:
                      httpGet:
                          path: /api/status
                          port: 8080
                      initialDelaySeconds: 5
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
            nodeSelector:
                svccontroller.k3s.cattle.io/lbpool: lamg
---
apiVersion: v1
kind: Service
metadata:
    name: anisub
    namespace: piracy
spec:
    type: ClusterIP
    ports:
        - name: web
          protocol: TCP
          port: 8080
          targetPort: 8080
    selector:
        app: anisub
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: anisub-https
    namespace: piracy
    annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
    ingressClassName: traefik
    rules:
        - host: anisub.${BASE_DOMAIN}
          http:
              paths:
                  - pathType: Prefix
                    path: /
                    backend:
                        service:
                            name: anisub
                            port:
                                number: 8080
    tls:
        - secretName: anisub.${BASE_DOMAIN}
          hosts:
              - anisub.${BASE_DOMAIN}
