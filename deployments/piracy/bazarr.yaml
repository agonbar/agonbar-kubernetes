apiVersion: apps/v1
kind: Deployment
metadata:
    annotations:
        keel.sh/pollSchedule: "@every 72h"
    name: bazarr-deployment
    namespace: piracy
    labels:
        app: bazarr
        keel.sh/policy: force
        keel.sh/match-tag: "true"
        keel.sh/trigger: poll
spec:
    strategy:
        type: Recreate
    replicas: 1
    selector:
        matchLabels:
            app: bazarr
    template:
        metadata:
            labels:
                app: bazarr
        spec:
            containers:
                - name: bazarr
                  image: linuxserver/bazarr:latest
                  # Always, not IfNotPresent: with a floating tag each node
                  # caches whatever :latest was when it first pulled, so a
                  # reschedule can land the app on a months-old build. That is
                  # what broke it — the Postgres schema was stamped with an
                  # Alembic revision the stale image had never heard of.
                  imagePullPolicy: Always
                  env:
                      - name: PGID
                        value: '1000'
                      - name: PUID
                        value: '1000'
                      - name: TZ
                        value: Europe/Madrid
                  ports:
                      - containerPort: 6767
                        protocol: TCP
                  volumeMounts:
                      - name: config
                        mountPath: /config
                      - name: downloads
                        mountPath: /downloads
                      - name: tv
                        mountPath: /tv
                      # /tv is anime and /SERIES is everything else: two different NFS
                      # shares. bazarr only had /tv, so every regular-series episode
                      # sonarr reported under /SERIES was unreachable and never got
                      # analysed -- 1847 of 11142 episodes had no ffprobe_cache, and the
                      # log had been filling with "cannot be found for analysis" since
                      # 27-Aug. Same two mounts sonarr has; no path mapping needed.
                      - name: series
                        mountPath: /SERIES
                      # Si también tienes películas (Radarr), deberías añadir ese volumen aquí
                  # startupProbe gates the other two so a slow boot is not mistaken
                  # for a dead app; /api/system/ping is served without auth.
                  startupProbe:
                      httpGet:
                          path: /api/system/ping
                          port: 6767
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 60
                  readinessProbe:
                      httpGet:
                          path: /api/system/ping
                          port: 6767
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  livenessProbe:
                      httpGet:
                          path: /api/system/ping
                          port: 6767
                      periodSeconds: 20
                      timeoutSeconds: 5
                      failureThreshold: 3
                  resources:
                      requests:
                          memory: 256Mi # Bazarr consume un poco más de RAM al indexar
                          cpu: 100m
                      limits:
                          memory: 1Gi
                          cpu: 500m
            volumes:
                - name: config
                  persistentVolumeClaim:
                      claimName: bazarr-config-nfs
                - name: tv
                  nfs:
                      server: 192.168.0.29
                      path: /mnt/RAID/docker/media/tv
                - name: series
                  nfs:
                      server: 192.168.0.29
                      path: /mnt/RAID/docker/media/SERIES
                - name: downloads
                  nfs:
                      server: 192.168.0.29
                      path: /mnt/SSD/torrents
            nodeSelector:
              svccontroller.k3s.cattle.io/lbpool: lamg
---
apiVersion: v1
kind: Service
metadata:
  name: bazarr
  namespace: piracy
spec:
  type: ClusterIP
  ports:
    - name: web
      protocol: TCP
      port: 6767
      targetPort: 6767
  selector:
    app: bazarr
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bazarr-https
  namespace: piracy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: bazarr.${BASE_DOMAIN}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: bazarr
                port:
                  number: 6767
  tls:
    - secretName: bazarr.${BASE_DOMAIN}
      hosts:
        - bazarr.${BASE_DOMAIN}
---
# Moved off iSCSI on 2026-09-03. This app's database lives in the nas02 Postgres
# now, so what is left here is config.xml, MediaCover and logs: no reason to keep
# an ext4 journal on a network block device, which is what kept corrupting.
# Old claim kept declared as the rollback.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-config-nfs
  namespace: piracy
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: truenas-nfs-ssd-lan
  resources:
    requests:
      storage: 5Gi
