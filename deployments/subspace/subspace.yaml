---
# subspace — plain WireGuard server with a web UI, the fallback VPN for when
# the mesh VPNs (Tailscale/NetBird) are down. Peers dial 80.241.214.254:51820
# directly, so this needs the public node and must not depend on the mesh.
#
# Moved here from a docker container on ovh02 (2026-11-04). The state stays on
# the host in /root/subspace (server key, peer configs, config.json with the
# profiles), so existing clients keep working without changes. It stays off
# iSCSI on purpose: a fallback cannot depend on nas02 over the WAN.
#
# hostNetwork because the entrypoint creates wg0 and the NAT/FORWARD rules in
# the host namespace. The UI listens on :8889 plain HTTP and is not published
# by any ingress; reach it through the tunnel or an SSH forward. Not :8888:
# the games/satisfactory LoadBalancer takes that port on every node over IPv4.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subspace
  namespace: subspace
spec:
  replicas: 1
  # hostNetwork binds wg0, :51820 and :8889, so a rolling update would fight itself.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: subspace
  template:
    metadata:
      labels:
        app: subspace
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: network/public-ipv4
                    operator: Exists
      containers:
        - name: subspace
          image: docker.io/subspacecommunity/subspace:1.5.0
          env:
            - name: SUBSPACE_HTTP_HOST
              value: wg.adriangonzalezbarbosa.eu
            - name: SUBSPACE_HTTP_ADDR
              value: ":8889"
            - name: SUBSPACE_HTTP_INSECURE
              value: "true"
            - name: SUBSPACE_LETSENCRYPT
              value: "false"
            - name: SUBSPACE_LISTENPORT
              value: "51820"
            - name: SUBSPACE_IPV4_POOL
              value: 192.168.69.0/24
            - name: SUBSPACE_IPV6_NAT_ENABLED
              value: "0"
            - name: SUBSPACE_DISABLE_DNS
              value: "1"
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: data
          hostPath:
            path: /root/subspace
            type: Directory
