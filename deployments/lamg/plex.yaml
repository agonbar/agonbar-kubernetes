apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: plex
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
  annotations:
    keel.sh/pollSchedule: "@every 72h"
  name: plex
  namespace: lamg
spec:
  strategy:
    type: Recreate
  replicas: 0
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      initContainers:
        # Plex's /config is an iSCSI (ext4) RWO volume. After an unclean TrueNAS
        # or network disconnect ext4 flips to read-only, and Plex then fails to
        # write its DB. This gate refuses to start Plex on a read-only /config so
        # the failure is visible instead of silently corrupting the library DB.
        # It deliberately does NOT try to fsck: the block device is staged by
        # kubelet at a host globalmount OUTSIDE this pod's mount namespace, so an
        # in-pod umount/e2fsck can never work (the old version crashlooped here
        # doing exactly that). The real repair is an offline e2fsck -fy; see
        # scripts/repair-iscsi-volume.sh.
        - name: config-writable-check
          image: alpine:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - /bin/sh
            - -c
            - |
              set -e
              MP="/config"
              if touch "${MP}/.rw-test" 2>/dev/null; then
                rm -f "${MP}/.rw-test"
                echo "[config-check] ${MP} is writable."
                exit 0
              fi

              echo "[config-check] ${MP} is READ-ONLY (ext4 likely flipped to ro after an unclean iSCSI disconnect). Trying remount,rw..."
              mount -o remount,rw "${MP}" 2>/dev/null || true
              if touch "${MP}/.rw-test" 2>/dev/null; then
                rm -f "${MP}/.rw-test"
                echo "[config-check] remount,rw recovered ${MP}."
                exit 0
              fi

              echo "[config-check] STILL read-only. An in-pod fsck cannot repair the live staged mount."
              echo "[config-check] The ext4 is likely 'clean with errors'; kubelet's fsck -a on re-stage will not fix that."
              echo "[config-check] Run the offline repair from a workstation (quiesces, snapshots, e2fsck -fy):"
              echo "[config-check]   scripts/repair-iscsi-volume.sh lamg deploy/plex plex-config"
              exit 1
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - image: linuxserver/plex:latest
          name: plex
          env:
            - name: PUID
              value: '950'
            - name: PGID
              value: '950'
            - name: PLEX_CLAIM
              valueFrom:
                secretKeyRef:
                  name: lamg
                  key: plexClaim
            - name: TZ
              value: Europe/Madrid
            - name: VERSION
              value: 'latest'
            - name: ADVERTISE_IP
              value: 'https://plex.${BASE_DOMAIN}:443'
          ports:
            - containerPort: 32400
              name: plex-1
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: media
              mountPath: /media
          livenessProbe:
            httpGet:
              path: /identity
              port: 32400
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /identity
              port: 32400
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 5m
              memory: 30Mi
      volumes:
        - name: config
          persistentVolumeClaim:
              claimName: plex-config
        - name: data
          nfs:
              server: 192.168.0.29
              path: /mnt/RAID/Public
        - name: media
          nfs:
              server: 192.168.0.29
              path: /mnt/RAID/docker/media
      nodeSelector:
        svccontroller.k3s.cattle.io/lbpool: lamg
        kubernetes.io/hostname: orange-pi5

---
apiVersion: v1
kind: Service
metadata:
  name: plex-lb
  namespace: lamg
spec:
  type: LoadBalancer
  ports:
    - name: plex-1
      protocol: TCP
      port: 32400
      targetPort: 32400
  selector:
    app: plex
---
apiVersion: v1
kind: Service
metadata:
  name: plex
  namespace: lamg
spec:
  type: ClusterIP
  ports:
    - name: plex-1
      protocol: TCP
      port: 32400
      targetPort: 32400
  selector:
    app: plex
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plex-https
  namespace: lamg
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: plex.${BASE_DOMAIN}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: plex
                port:
                  number: 32400
  tls:
    - secretName: plex.${BASE_DOMAIN}
      hosts:
        - plex.${BASE_DOMAIN}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-config
  namespace: lamg
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-ssd
  resources:
    requests:
      storage: 30Gi