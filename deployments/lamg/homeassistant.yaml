apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: homeassistant
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
  annotations:
    keel.sh/pollSchedule: "@every 72h"
  name: homeassistant
  namespace: lamg
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
        app.vscode: "true"
    spec:
      initContainers:
        # HA's /config is an iSCSI (ext4) RWO volume. After an unclean TrueNAS or
        # network disconnect ext4 flips to read-only, and HA then fails to write
        # its DB/config. This gate refuses to start HA on a read-only /config so
        # the failure is visible instead of silently corrupting the recorder DB.
        # It deliberately does NOT try to fsck: the block device is staged by
        # kubelet at a host globalmount OUTSIDE this pod's mount namespace, so an
        # in-pod umount/e2fsck can never work (the old version crashlooped here
        # doing exactly that). The real repair is an offline e2fsck -fy; see
        # scripts/repair-iscsi-volume.sh.
        - name: config-writable-check
          image: alpine:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - /bin/sh
            - -c
            - |
              set -e
              MP="/config"
              if touch "${MP}/.rw-test" 2>/dev/null; then
                rm -f "${MP}/.rw-test"
                echo "[config-check] ${MP} is writable."
                exit 0
              fi

              echo "[config-check] ${MP} is READ-ONLY (ext4 likely flipped to ro after an unclean iSCSI disconnect). Trying remount,rw..."
              mount -o remount,rw "${MP}" 2>/dev/null || true
              if touch "${MP}/.rw-test" 2>/dev/null; then
                rm -f "${MP}/.rw-test"
                echo "[config-check] remount,rw recovered ${MP}."
                exit 0
              fi

              echo "[config-check] STILL read-only. An in-pod fsck cannot repair the live staged mount."
              echo "[config-check] The ext4 is likely 'clean with errors'; kubelet's fsck -a on re-stage will not fix that."
              echo "[config-check] Run the offline repair from a workstation (quiesces, snapshots, e2fsck -fy):"
              echo "[config-check]   scripts/repair-iscsi-volume.sh lamg deploy/homeassistant homeassistant-config-lan"
              exit 1
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - image: homeassistant/home-assistant:latest
          name: homeassistant
          ports:
            - containerPort: 8123
              name: homeassistant
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
          # startupProbe gates the other two so a slow boot is not mistaken
          # for a dead app; /manifest.json is served without auth.
          startupProbe:
            httpGet:
              path: /manifest.json
              port: 8123
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /manifest.json
              port: 8123
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /manifest.json
              port: 8123
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 5m
              memory: 30Mi
        # Tag pinned explicitly because keel rewrites the image to
        # ...:latest on every poll. Untagged here meant ArgoCD saw a permanent
        # diff against a value keel would immediately put back -- the two would
        # have fought each other forever once selfHeal came back on.
        - image: ghcr.io/linuxserver/code-server:latest
          name: vscode
          env:
            - name: PUID
              value: '1000'
            - name: PGID
              value: '1000'
            - name: TZ
              value: 'Europe/Madrid'
            - name: SUDO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lamg
                  key: sudoPassword
            - name: DEFAULT_WORKSPACE
              value: '/config/workspace'
          ports:
            - containerPort: 8443
              name: vscode
              protocol: TCP
          volumeMounts:
            - name: vscode-config
              mountPath: /config
            - name: config
              mountPath: /config/workspace
          resources:
            requests:
              cpu: 5m
              memory: 30Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homeassistant-config-lan
        - name: vscode-config
          persistentVolumeClaim:
            claimName: vscode-config-lan
      nodeSelector:
        svccontroller.k3s.cattle.io/lbpool: lamg
      # nas00 is a 2-core/3GB box that flaps NodeNotReady under load; its RWO
      # iSCSI config volume then takes ~20min to fail over, causing the daily
      # home.* 503. Keep HA off nas00 (it talks to zigbee2mqtt over MQTT, so it
      # does not need the dongle that pins to nas00). Prefer nas01 (stablest).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nas00
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - nas01

---
kind: Service
apiVersion: v1
metadata:
  name: homeassistant
  namespace: lamg
  labels:
    svccontroller.k3s.cattle.io/lbpool: lamg
spec:
  type: LoadBalancer
  selector:
    app: homeassistant
  ports:
    - protocol: TCP
      port: 8123
      targetPort: 8123
      name: homeassistant

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homeassistant-https
  namespace: lamg
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: home.${BASE_DOMAIN}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: homeassistant
                port:
                  number: 8123
  tls:
    - secretName: home.${BASE_DOMAIN}
      hosts:
        - home.${BASE_DOMAIN}

---
# Rollback for the 2026-09-02 storage class migration: holds the data as it was
# before the cutover. Nothing mounts it. Kept declared on purpose, because ArgoCD
# prunes what leaves git. Delete this block once the -lan volume has proven itself.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-config
  namespace: lamg
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-ssd
  resources:
    requests:
      storage: 30Gi

---
# Moved off truenas-iscsi-ssd on 2026-09-02. Both classes point at nas02: that
# one reaches it over tailscale, this one over the LAN. On 2026-09-02 at
# 11:28:37 all five tailscale sessions on orange-pi5 ping-timed-out in the same
# second, recovery gave up after 120s, and the ext4 journals on this volume,
# plex-config and immich-db-data aborted. The ten LAN sessions to the very same
# target never blinked. Wrapping WireGuard around a disk on your own network
# buys nothing and costs a filesystem every time the tunnel stalls.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-config-lan
  namespace: lamg
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-ssd-lan
  resources:
    requests:
      storage: 30Gi
