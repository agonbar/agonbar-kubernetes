apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: syncthing
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
  annotations:
    keel.sh/pollSchedule: "@every 72h"
  name: syncthing
  namespace: lamg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: syncthing
  template:
    metadata:
      labels:
        app: syncthing
    spec:
      containers:
        - image: linuxserver/syncthing:latest
          name: syncthing
          env:
            - name: PUID
              value: '950'
            - name: PGID
              value: '950'
          ports:
            - containerPort: 21025
              name: syncthing-1
              protocol: UDP
            - containerPort: 22000
              name: syncthing-2
              protocol: TCP
            - containerPort: 22000
              name: syncthing-2-quic
              protocol: UDP
            - containerPort: 8384
              name: syncthing-3
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: media
              mountPath: /media
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 30Mi
      volumes:
        - name: config
          nfs:
              server: 192.168.0.29
              path: /mnt/RAID/docker/syncthing/config
        - name: data
          nfs:
              server: 192.168.0.29
              path: /mnt/RAID/docker/syncthing/data
        - name: media
          nfs:
              server: 192.168.0.29
              path: /mnt/RAID/docker/media
              readOnly: true
      nodeSelector:
        svccontroller.k3s.cattle.io/lbpool: lamg

---
apiVersion: v1
kind: Service
metadata:
  name: syncthing
  namespace: lamg
  labels:
    svccontroller.k3s.cattle.io/lbpool: lamg
spec:
  type: LoadBalancer
  ports:
    - name: syncthing-1
      protocol: UDP
      port: 21025
      targetPort: 21025
    - name: syncthing-2
      protocol: TCP
      port: 22000
      targetPort: 22000
    - name: syncthing-3
      protocol: TCP
      port: 8384
      targetPort: 8384
  selector:
    app: syncthing

---
# Direct public-IP exposure on ovh02 for the sync protocol only (not the GUI).
# ovh02 isn't in the lamg lbpool, so externalIPs is used instead of a LoadBalancer
# pool to reach its public address without adding ovh02 to every lamg-pool service.
apiVersion: v1
kind: Service
metadata:
  name: syncthing-public
  namespace: lamg
spec:
  type: ClusterIP
  externalIPs:
    - 80.241.214.25
  ports:
    - name: syncthing-tcp
      protocol: TCP
      port: 22000
      targetPort: 22000
    - name: syncthing-quic
      protocol: UDP
      port: 22000
      targetPort: 22000
  selector:
    app: syncthing
