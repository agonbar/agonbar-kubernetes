  check-upstream-drift.py: |
    """Report which core files this fork was vendored from have changed upstream.

    The fork shadows the `litellm` domain, so it runs 2026.10.1 integration code
    against whatever core the running Home Assistant ships. When upstream edits a
    file this copy is based on, nothing complains: the integration keeps loading
    until the day an API it uses is gone. This turns that into a check.

    Run it against the integration inside a running Home Assistant:

        kubectl cp check-upstream-drift.py <ns>/<pod>:/tmp/ -c homeassistant
        kubectl cp upstream-baseline.json <ns>/<pod>:/tmp/ -c homeassistant
        kubectl exec <pod> -c homeassistant -- python3 /tmp/check-upstream-drift.py \
            /usr/src/homeassistant/homeassistant/components/litellm

    Exits non-zero when anything drifted, so it works as a periodic check.
    """

    import hashlib
    import json
    import pathlib
    import sys

    BASELINE = pathlib.Path(__file__).with_name("upstream-baseline.json")


    def main(core_dir: str, baseline_path: str) -> int:
        baseline = json.loads(pathlib.Path(baseline_path).read_text())
        core = pathlib.Path(core_dir)
        if not core.is_dir():
            print(f"no existe: {core}")
            return 2

        print(f"vendorizado de HA {baseline['ha_version']}, comparando contra {core}")
        drifted = []
        for name, digest in sorted(baseline["files"].items()):
            current = core / name
            if not current.is_file():
                drifted.append((name, "borrado en core"))
                continue
            if hashlib.sha256(current.read_bytes()).hexdigest() != digest:
                drifted.append((name, "cambiado en core"))

        for name, what in drifted:
            print(f"  DRIFT {name}: {what}")

        if not drifted:
            print("  sin cambios: el fork sigue alineado con core")
            return 0

        print(
            f"\n{len(drifted)} fichero(s) cambiaron upstream. Rebasa el fork sobre la "
            "version nueva antes de que la diferencia rompa algo en silencio."
        )
        return 1


    sys.exit(
        main(
            sys.argv[1] if len(sys.argv) > 1 else "/usr/src/homeassistant/homeassistant/components/litellm",
            sys.argv[2] if len(sys.argv) > 2 else str(BASELINE),
        )
    )
  ha-assist.py: |
    """Expose entities to Home Assistant Assist and query the conversation agent.

    Runs INSIDE the HA pod (neither aya nor lamg has a long-lived token, so it mints
    a short-lived JWT from an existing refresh_token in /config/.storage/auth).

        kubectl --context=lamg -n <ns> exec -i deploy/homeassistant -- \
            python3 - --check weather.forecast_home < scripts/ha-assist.py

    Modes:
        <entity_id> [...]        expose those entities to the "conversation" assistant
        --check <entity_id>      print current exposure
        --ask "<frase>" [agent]  run a sentence through the agent (default: built-in)
        --say "<frase>" [pipeline_id]  run a pipeline intent->tts, save the reply audio
                                 to /tmp/ha-say.<ext> in the pod (kubectl cp it out)
        --ws '<json>' [...]      send raw websocket messages (no "id"), print each result
        --flow <handler> '<json>' [...]  start a config flow, submit each json as a step
    """
    import asyncio, json, sys, time, jwt, aiohttp

    STORAGE = "/config/.storage/"
    URL = "http://127.0.0.1:8123"


    def mint_token():
        auth = json.load(open(STORAGE + "auth"))["data"]
        # any admin's refresh_token carrying a jwt_key works; avoid system tokens and
        # non-admin users (the wall panel logs in as one and would win on last_used_at)
        admins = {u["id"] for u in auth["users"] if "system-admin" in u.get("group_ids", [])}
        cands = [r for r in auth["refresh_tokens"]
                 if r.get("jwt_key") and r.get("token_type") != "system" and r["user_id"] in admins]
        if not cands:
            raise SystemExit("no usable refresh_token with a jwt_key")
        rt = sorted(cands, key=lambda r: r.get("last_used_at") or "", reverse=True)[0]
        now = int(time.time())
        return jwt.encode({"iss": rt["id"], "iat": now, "exp": now + 900}, rt["jwt_key"], algorithm="HS256")


    async def ws_call(messages):
        token = mint_token()
        out = []
        async with aiohttp.ClientSession() as s, s.ws_connect(URL + "/api/websocket") as ws:
            await ws.receive_json()  # auth_required
            await ws.send_json({"type": "auth", "access_token": token})
            if (await ws.receive_json())["type"] != "auth_ok":
                raise SystemExit("auth failed")
            for i, msg in enumerate(messages, start=1):
                await ws.send_json({"id": i, **msg})
                while True:
                    r = await ws.receive_json()
                    if r.get("id") == i and r["type"] == "result":
                        out.append(r)
                        break
        return out


    async def flow(handler, steps):
        headers = {"Authorization": "Bearer " + mint_token()}
        base = URL + "/api/config/config_entries/flow"
        async with aiohttp.ClientSession(headers=headers) as s:
            async with s.post(base, json={"handler": handler}) as r:
                res = await r.json()
            print(json.dumps(res))
            for step in steps:
                async with s.post(f"{base}/{res['flow_id']}", json=step) as r:
                    res = await r.json()
                print(json.dumps(res))


    async def say(text, pipeline, out_base="/tmp/ha-say"):
        """Run a pipeline from intent to tts; print the reply and save its audio in the pod."""
        token = mint_token()
        async with aiohttp.ClientSession() as s, s.ws_connect(URL + "/api/websocket") as ws:
            await ws.receive_json()  # auth_required
            await ws.send_json({"type": "auth", "access_token": token})
            if (await ws.receive_json())["type"] != "auth_ok":
                raise SystemExit("auth failed")
            msg = {"id": 1, "type": "assist_pipeline/run", "start_stage": "intent",
                   "end_stage": "tts", "input": {"text": text}}
            if pipeline:
                msg["pipeline"] = pipeline
            await ws.send_json(msg)
            speech = url = None
            t0 = time.monotonic()
            while True:
                r = await ws.receive_json()
                if r["type"] == "result" and not r["success"]:
                    raise SystemExit("ERROR " + json.dumps(r.get("error")))
                ev = r.get("event") or {}
                data = ev.get("data") or {}
                if ev.get("type") == "intent-end":
                    speech = data["intent_output"]["response"]["speech"]["plain"]["speech"]
                    print(f"speech ({time.monotonic() - t0:.1f}s):", speech)
                elif ev.get("type") == "tts-end":
                    url = data["tts_output"]["url"]
                elif ev.get("type") == "error":
                    raise SystemExit("ERROR " + json.dumps(data))
                elif ev.get("type") == "run-end":
                    break
            if not url:
                raise SystemExit("no tts output")
            async with s.get(URL + url, headers={"Authorization": "Bearer " + token}) as r:
                path = out_base + "." + url.rsplit(".", 1)[-1]
                open(path, "wb").write(await r.read())
            print(f"audio ({time.monotonic() - t0:.1f}s):", path)


    def main():
        args = sys.argv[1:]
        if args and args[0] == "--check":
            r = asyncio.run(ws_call([{"type": "homeassistant/expose_entity/list"}]))[0]
            exposed = r["result"]["exposed_entities"]
            for eid in args[1:]:
                print(eid, "->", json.dumps(exposed.get(eid, "NOT LISTED")))
        elif args and args[0] == "--ws":
            for r in asyncio.run(ws_call([json.loads(a) for a in args[1:]])):
                print(json.dumps(r))
        elif args and args[0] == "--flow":
            asyncio.run(flow(args[1], [json.loads(a) for a in args[2:]]))
        elif args and args[0] == "--say":
            asyncio.run(say(args[1], args[2] if len(args) > 2 else None))
        elif args and args[0] == "--ask":
            agent = args[2] if len(args) > 2 else None
            payload = {"type": "conversation/process", "text": args[1], "language": "es"}
            if agent:
                payload["agent_id"] = agent
            r = asyncio.run(ws_call([payload]))[0]
            if not r["success"]:
                print("ERROR", json.dumps(r.get("error")))
                return
            resp = r["result"]["response"]
            print("type:", resp["response_type"])
            print("speech:", resp["speech"]["plain"]["speech"])
        else:
            r = asyncio.run(ws_call([{
                "type": "homeassistant/expose_entity",
                "entity_ids": args,
                "assistants": ["conversation"],
                "should_expose": True,
            }]))[0]
            print("expose success:", r["success"], json.dumps(r.get("error", {})))


    main()
