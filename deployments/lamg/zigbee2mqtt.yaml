apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: zigbee2mqtt
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
  annotations:
    keel.sh/pollSchedule: "@every 72h"
  name: zigbee2mqtt
  namespace: lamg
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: zigbee2mqtt
  template:
    metadata:
      labels:
        app: zigbee2mqtt
    spec:
      containers:
        - image: koenkk/zigbee2mqtt:latest
          name: zigbee2mqtt
          env:
            - name: TZ
              value: Europe/Madrid
          volumeMounts:
            - name: config
              mountPath: /app/data
          ports:
            - containerPort: 8080
              name: zigbee2mqtt
              protocol: TCP
          # Liveness measured as "is it talking to the broker", not "is the
          # process alive". The failure this catches: on 2026-09-07 z2m lost
          # MQTT, logged ECONNREFUSED for five seconds and then went silent for
          # twelve minutes while the pod stayed 1/1 Running with 0 restarts. It
          # keeps reading the Zigbee radio perfectly and publishes none of it,
          # so the house looks like a dead dongle. That is why people were
          # unplugging the USB stick: it is the only way anyone had to restart
          # this pod.
          #
          # /proc/net/tcp instead of a health endpoint because 2.14.1 has none
          # (/health, /api/health and /healthcheck all 404). 075B is 1883 and
          # state 01 is ESTABLISHED. mqtt.keepalive is 60 in configuration.yaml,
          # so a connection that has really died stops being ESTABLISHED within
          # about 90s rather than lingering half-open.
          #
          # Thresholds are deliberately slow: 3 min without a connection before
          # a restart, so a broker bounce or a blip does not bounce the
          # domotics. The startup probe gives the adapter 5 min to come up
          # before liveness can fire at all.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - awk '$3 ~ /:075B$/ && $4 == "01" {f=1} END {exit !f}' /proc/net/tcp
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - awk '$3 ~ /:075B$/ && $4 == "01" {f=1} END {exit !f}' /proc/net/tcp
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 5m
              memory: 30Mi
              devices/sonoffzigbeedongle: "1"
            limits:
              devices/sonoffzigbeedongle: "1"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: zigbee2mqtt-config-nfs
      nodeSelector:
        svccontroller.k3s.cattle.io/lbpool: lamg
      dnsConfig:
        options:
          - name: ndots
            value: "1"

---
kind: Service
apiVersion: v1
metadata:
  name: zigbee2mqtt
  namespace: lamg
  labels:
    svccontroller.k3s.cattle.io/lbpool: lamg
spec:
  type: LoadBalancer
  selector:
    app: zigbee2mqtt
  ports:
    - name: zigbee2mqtt
      port: 8080
      protocol: TCP
      targetPort: 8080

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zigbee2mqtt-config
  namespace: lamg
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-ssd
  resources:
    requests:
      storage: 1Gi

---
# Moved off iSCSI on 2026-09-03. Nothing here is a live database (zigbee2mqtt's
# database.db is newline-delimited JSON, not SQLite), so an ext4 journal on a
# network block device was pure downside. NFS has no client-side filesystem;
# nas02's ZFS keeps consistency locally. Old claim kept as the rollback.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zigbee2mqtt-config-nfs
  namespace: lamg
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: truenas-nfs-ssd-lan
  resources:
    requests:
      storage: 1Gi