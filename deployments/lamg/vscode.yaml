# code-server for editing Home Assistant's config.
#
# Was a sidecar in the homeassistant pod until 2026-09-03. That pinned the
# domotics to vscode-config-lan, an RWO iSCSI volume, so every stall of the
# nas01 target took Home Assistant down with it -- even after HA's own config
# had been moved to NFS precisely to escape that. Now it is a pod of its own:
# /config/workspace is the same RWX NFS claim, which is what RWX is for.
#
# replicas: 0 since the 2026-09-03 incident. Its own volume is no longer the
# reason: /config moved to NFS on 2026-09-24, so this can go back to 1 whenever
# Home Assistant's config needs editing from the browser again.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vscode
  namespace: lamg
  labels:
    app.vscode: "true"
spec:
  strategy:
    type: Recreate
  replicas: 0
  selector:
    matchLabels:
      app.vscode: "true"
  template:
    metadata:
      labels:
        app.vscode: "true"
    spec:
      containers:
        # Tag pinned explicitly because keel rewrites the image to
        # ...:latest on every poll. Untagged here meant ArgoCD saw a permanent
        # diff against a value keel would immediately put back -- the two would
        # have fought each other forever once selfHeal came back on.
        - image: ghcr.io/linuxserver/code-server:latest
          name: vscode
          env:
            - name: PUID
              value: '1000'
            - name: PGID
              value: '1000'
            - name: TZ
              value: 'Europe/Madrid'
            - name: SUDO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lamg
                  key: sudoPassword
            - name: DEFAULT_WORKSPACE
              value: '/config/workspace'
          ports:
            - containerPort: 8443
              name: vscode
              protocol: TCP
          volumeMounts:
            - name: vscode-config
              mountPath: /config
            - name: config
              mountPath: /config/workspace
          resources:
            requests:
              cpu: 5m
              memory: 30Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homeassistant-config-nfs
        - name: vscode-config
          persistentVolumeClaim:
            claimName: vscode-config-nfs
      nodeSelector:
        svccontroller.k3s.cattle.io/lbpool: lamg

---
apiVersion: v1
kind: Service
metadata:
  name: vscode
  namespace: lamg
  labels:
    svccontroller.k3s.cattle.io/lbpool: lamg
spec:
  type: LoadBalancer
  ports:
    - name: vscode
      protocol: TCP
      port: 8443
      targetPort: 8443
  selector:
    app.vscode: "true"

---
# Moved off truenas-iscsi-ssd-lan on 2026-09-24. This is code-server's /config:
# extensions and settings. It does carry a state.vscdb, but that is SQLite for
# UI state -- open tabs, command history -- and code-server rebuilds it if it
# goes. Nothing here justified a block device. The old claim stays declared
# until the copy is verified, then it goes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vscode-config-nfs
  namespace: lamg
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-nfs-ssd-lan
  resources:
    requests:
      storage: 5Gi
