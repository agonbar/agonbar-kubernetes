apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: zigbee2mqttassistant
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
  annotations:
    keel.sh/pollSchedule: "@every 72h"
  name: zigbee2mqttassistant
  namespace: lamg
spec:
  # Scaled to 0 on 2026-09-02. It is a read-only web UI over the zigbee2mqtt MQTT
  # topics, so nothing depends on it being up. Set back to 1 to bring it back;
  # note it still carries the 5m/30Mi token request flagged in c6d541a.
  replicas: 0
  selector:
    matchLabels:
      app: zigbee2mqttassistant
  template:
    metadata:
      labels:
        app: zigbee2mqttassistant
    spec:
      containers:
        # Same reason as code-server in homeassistant.yaml: keel manages this
        # image, so pin the tag or the next keel update starts a sync fight.
        - image: carldebilly/zigbee2mqttassistant:latest
          name: zigbee2mqttassistant
          ports:
            - containerPort: 80
              name: z2massistant
              protocol: TCP
          resources:
            requests:
              cpu: 5m
              memory: 30Mi
      nodeSelector:
        svccontroller.k3s.cattle.io/lbpool: lamg

---
kind: Service
apiVersion: v1
metadata:
  name: zigbee2mqttassistant
  namespace: lamg
  labels:
    svccontroller.k3s.cattle.io/lbpool: lamg
spec:
  type: LoadBalancer

  selector:
    app: zigbee2mqttassistant

  ports:
    - protocol: TCP
      port: 8884
      targetPort: 80
      name: z2massistant
