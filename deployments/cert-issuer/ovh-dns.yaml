# ClusterIssuer that proves domain control with a TXT record in the OVH zone
# (DNS-01) instead of HTTP-01 through traefik. Use it for names that resolve to
# tailnet/LAN addresses, e.g. sure.adriangonzalezbarbosa.eu -> nas02-k3s.
#
# The OVH token can only touch the adriangonzalezbarbosa.eu zone. Copy of
# record: dotfiles/nix/secrets/ovh-dns-adriangonzalezbarbosa.age; recreate it
# with scripts/ovh-dns-token-wizard.sh.
---
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ovh-dns-credentials
  namespace: cert-manager
spec:
  encryptedData:
    applicationConsumerKey: 
    applicationKey: 
    applicationSecret: 
  template:
    metadata:
      name: ovh-dns-credentials
      namespace: cert-manager
---
# The webhook only reads credentials it has been granted; the chart creates this
# RBAC solely for issuers it manages itself, and this one is managed here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-webhook-ovh:ovh-dns-credentials
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ovh-dns-credentials"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-webhook-ovh:ovh-dns-credentials
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-webhook-ovh:ovh-dns-credentials
subjects:
  - kind: ServiceAccount
    name: cert-manager-webhook-ovh
    namespace: cert-manager
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns-ovh
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${LETSENCRYPT_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-dns-ovh
    solvers:
      - selector:
          dnsZones:
            - adriangonzalezbarbosa.eu
        dns01:
          webhook:
            groupName: acme.adriangonzalezbarbosa.eu
            solverName: ovh
            config:
              endpoint: ovh-eu
              authenticationMethod: application
              applicationKeyRef:
                name: ovh-dns-credentials
                key: applicationKey
              applicationSecretRef:
                name: ovh-dns-credentials
                key: applicationSecret
              applicationConsumerKeyRef:
                name: ovh-dns-credentials
                key: applicationConsumerKey
