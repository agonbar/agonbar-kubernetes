# ClusterIssuer that proves domain control with a TXT record in the OVH zone
# (DNS-01) instead of HTTP-01 through traefik. Use it for names that resolve to
# tailnet/LAN addresses, e.g. sure.adriangonzalezbarbosa.eu -> nas02-k3s.
#
# Credentials: cert-manager 1.16 hands the webhook the Certificate's namespace,
# not cert-manager's, even for a ClusterIssuer. So each namespace that requests
# a certificate from this issuer needs its own sealed `ovh-dns-credentials`
# Secret plus a Role letting the webhook read it (see deployments/sure/ovh-dns.yaml).
# The OVH token can only touch this zone. Copy of record:
# dotfiles/nix/secrets/ovh-dns-adriangonzalezbarbosa.age; recreate it with
# scripts/ovh-dns-token-wizard.sh.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns-ovh
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${LETSENCRYPT_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-dns-ovh
    solvers:
      - selector:
          dnsZones:
            - adriangonzalezbarbosa.eu
        dns01:
          webhook:
            groupName: acme.adriangonzalezbarbosa.eu
            solverName: ovh
            config:
              endpoint: ovh-eu
              authenticationMethod: application
              applicationKeyRef:
                name: ovh-dns-credentials
                key: applicationKey
              applicationSecretRef:
                name: ovh-dns-credentials
                key: applicationSecret
              applicationConsumerKeyRef:
                name: ovh-dns-credentials
                key: applicationConsumerKey
