# Read-only "is it the server or my connection?" page for the Satisfactory
# players, at https://satisfactory.${BASE_DOMAIN}. Source and build script in
# gitea agonbar/satisfactory-status.
#
# It has to run on the same node as the game: it reads the game container's
# cgroup (CPU used, PSI wait for CPU and disk) through the node's /proc and
# /sys/fs/cgroup, mounted read-only. The podAffinity follows the game wherever
# it goes. It also has to be served from the game's public IP (traefik runs on
# ovh02 and the domain resolves straight to it, no CDN), because the players'
# browsers time /ping to judge their own connection.
#
# The game API needs no secret: the server has no join password, so a
# passwordless login as Client is enough to read the tick rate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: satisfactory-status
  namespace: games
  labels:
    app: satisfactory-status
spec:
  replicas: 1
  selector:
    matchLabels:
      app: satisfactory-status
  template:
    metadata:
      labels:
        app: satisfactory-status
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: satisfactory
              topologyKey: kubernetes.io/hostname
      imagePullSecrets:
        - name: ghcr-agonbar
      containers:
        - name: satisfactory-status
          image: ghcr.io/agonbar/satisfactory-status:62e5ca2
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
        - name: host-cgroup
          hostPath:
            path: /sys/fs/cgroup
---
apiVersion: v1
kind: Service
metadata:
  name: satisfactory-status
  namespace: games
spec:
  selector:
    app: satisfactory-status
  ports:
    - port: 8080
      targetPort: http
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: satisfactory-status
  namespace: games
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: satisfactory.${BASE_DOMAIN}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: satisfactory-status
                port:
                  number: 8080
  tls:
    - secretName: satisfactory.${BASE_DOMAIN}
      hosts:
        - satisfactory.${BASE_DOMAIN}
---
# Same cluster-wide sealed ghcr pull secret as strata's, for the private image.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: ghcr-agonbar
  namespace: games
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      name: ghcr-agonbar
      namespace: games
    type: kubernetes.io/dockerconfigjson

