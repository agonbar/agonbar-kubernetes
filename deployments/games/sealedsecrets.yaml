# Game passwords, rotated 2026-10-20 when they moved out of the manifests
# (the old ones are in public git history). adminPassword is also the
# Palworld RCON/REST password, which games-status uses. serverPassword is the
# join password friends type; read it with
#   kubectl -n games get secret <name> -o jsonpath='{.data.serverPassword}' | base64 -d
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: palworld-passwords
  namespace: games
spec:
  encryptedData:
    adminPassword: 
    serverPassword: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      name: palworld-passwords
      namespace: games
