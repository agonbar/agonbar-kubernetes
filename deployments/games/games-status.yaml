# Status page for the game servers in this namespace, at
# https://juegos.${BASE_DOMAIN} (and the older https://satisfactory.${BASE_DOMAIN}
# the Satisfactory players already have). One column per game: stopped,
# starting or running, players, speed, CPU and PSI waits. Source and build
# script in gitea agonbar/games-status.
#
# It also scales the games: a game running with nobody in for 2h goes to 0
# replicas, and anyone can start a stopped one from the page. That is why it
# has a Role on exactly those four Deployments, and why the games ArgoCD app
# ignores /spec/replicas on Deployments.
#
# Placement: it sits next to traefik, because the players' browsers time
# /ping through it to judge their own connection (the domain resolves straight
# to that node, no CDN). Through the node's /proc and /sys/fs/cgroup, mounted
# read-only, it also reads the cgroup of the games that run on that node.
#
# Satisfactory takes a passwordless Client login. The Palworld admin password
# comes from the palworld-passwords SealedSecret (sealedsecrets.yaml) as env;
# the Role does not let the panel read Secrets through the API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: games-status
  namespace: games
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: games-status
  namespace: games
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [satisfactory, palworld, enshrouded, factorio]
    verbs: [get, list, watch, patch, update]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: [satisfactory, palworld, enshrouded, factorio]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: games-status
  namespace: games
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: games-status
subjects:
  - kind: ServiceAccount
    name: games-status
    namespace: games
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: games-status
  namespace: games
  labels:
    app: games-status
spec:
  replicas: 1
  selector:
    matchLabels:
      app: games-status
  template:
    metadata:
      labels:
        app: games-status
    spec:
      serviceAccountName: games-status
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: traefik
              namespaces: [kube-system]
              topologyKey: kubernetes.io/hostname
      imagePullSecrets:
        - name: ghcr-agonbar
      containers:
        - name: games-status
          image: ghcr.io/agonbar/games-status:7df35d6
          env:
            - name: PALWORLD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: palworld-passwords
                  key: adminPassword
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
        - name: host-cgroup
          hostPath:
            path: /sys/fs/cgroup
---
apiVersion: v1
kind: Service
metadata:
  name: games-status
  namespace: games
spec:
  selector:
    app: games-status
  ports:
    - port: 8080
      targetPort: http
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: games-status
  namespace: games
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: juegos.${BASE_DOMAIN}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: games-status
                port:
                  number: 8080
    - host: satisfactory.${BASE_DOMAIN}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: games-status
                port:
                  number: 8080
  tls:
    - secretName: juegos.${BASE_DOMAIN}
      hosts:
        - juegos.${BASE_DOMAIN}
    - secretName: satisfactory.${BASE_DOMAIN}
      hosts:
        - satisfactory.${BASE_DOMAIN}
---
# Same cluster-wide sealed ghcr pull secret as strata's, for the private image.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: ghcr-agonbar
  namespace: games
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      name: ghcr-agonbar
      namespace: games
    type: kubernetes.io/dockerconfigjson

