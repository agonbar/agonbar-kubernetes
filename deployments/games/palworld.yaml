apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: palworld
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
  annotations:
    keel.sh/pollSchedule: "@every 72h"
  name: palworld
  namespace: games
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: palworld
  template:
    metadata:
      labels:
        app: palworld
    spec:
      containers:
        - image: thijsvanloef/palworld-server-docker:v2.7.1
          name: palworld
          env:
            # v2.0 switched the wrapper's control backend from RCON to the REST
            # API (default). Enable it so broadcasts/graceful-stop keep working.
            # Port 8212/TCP is cluster-internal only — never expose it.
            - name: REST_API_ENABLED
              value: "true"
            - name: REST_API_PORT
              value: "8212"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: PORT
              value: "8211"
            - name: PLAYERS
              value: "12"
            - name: MULTITHREADING
              value: "true"
            - name: RCON_ENABLED
              value: "true"
            - name: RCON_PORT
              value: "25575"
            - name: ADMIN_PASSWORD
              value: "divertriclo"
            - name: COMMUNITY
              value: "true"
            - name: SERVER_NAME
              value: "DivertiJeep"
            - name: SERVER_DESCRIPTION
              value: "Servidor de DivertiJeep"
            - name: SERVER_PASSWORD
              value: "lovamosviendo"
            - name: TZ
              value: "Europe/Madrid"
            - name: PUBLIC_IP
              value: "80.241.214.254"
          ports:
            - containerPort: 8211
              name: steamport
              protocol: UDP
            - containerPort: 27015
              name: gameport
              protocol: UDP
            # REST API (v2.x wrapper backend) — internal only, not in the Service.
            - containerPort: 8212
              name: restapi
              protocol: TCP
          volumeMounts:
            - mountPath: /palworld
              name: palworld
          resources:
            requests:
              cpu: 5m
              memory: 30Mi
            limits:
              cpu: "4"
              memory: 8Gi
      volumes:
        - name: palworld
          persistentVolumeClaim:
            claimName: palworld-data
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: ovh02
---
kind: Service
apiVersion: v1
metadata:
  name: palworld
  namespace: games
spec:
  type: LoadBalancer

  selector:
    app: palworld

  ports:
    - port: 8211
      targetPort: 8211
      name: steamport
      protocol: UDP
    - port: 27015
      targetPort: 27015
      name: gameport
      protocol: UDP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: palworld-data
  namespace: games
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
