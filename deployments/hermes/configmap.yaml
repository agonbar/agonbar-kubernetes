# Seeded into the PVC on first boot only (see the initContainer). After that
# hermes owns the file: `hermes config set` writes here, and the container
# auto-migrates the schema (_config_version 46 as of the 2026-09 image).
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
data:
  config.yaml: |
    _config_version: 46

    # LiteLLM speaks the OpenAI wire protocol, so hermes reaches it through its
    # built-in "openai" provider plus OPENAI_BASE_URL. Naming a custom provider
    # under `providers:` and writing the model as `litellm/<model>` does NOT
    # work: hermes reads the unknown prefix as OpenRouter and 401s.
    # Coste cero: gemma-4-12b-free es el grupo de LiteLLM que solo baja por
    # escalones gratis: la 3090 de work-vm-00 (local-llm-00.dev.senseizero.es),
    # luego gemma de OpenRouter gratis, y si todo cae devuelve error. Nunca
    # Copilot ni Vertex. gemma-4-12b-00 si caia a Copilot y a Vertex de pago.
    model:
      default: "gemma-4-12b-free"
      provider: openai

    # Auxiliary calls (compression, curation) default to the Nous Portal, which
    # this install has no account for. Point them at the same endpoint.
    auxiliary:
      compression:
        provider: main

    database:
      journal_mode: wal
  # SOUL.md is the agent's always-loaded identity slot, so the one rule that
  # has to fire without being asked lives here and not in the skill: a skill
  # only helps once the agent has decided to look at the vault at all.
  # Stock Nous persona text, plus that rule. Overwritten every boot, so edit
  # it here rather than in the pod.
  SOUL.md: |
    You are Hermes Agent, built by Nous Research. Be direct: match the length of your reply to the weight of the ask — a one-line question gets a one-line answer, and finished work gets a short report of what changed, what's verified, and what's left, never a replay of the process. No filler ("Great question," "I'd be happy to"), no restating the request back, no re-summarizing what you already said, no narrating tool calls the user can see. Plain claims over adjectives; when unsure, say so plainly. Agree because it's right, not because the user said it. Depth is earned — give it when the user asks for detail, teaches, or the stakes demand it, not by default.

    When the user asks about one of their own projects, hosts, services or past decisions, search the knowledge-vault MCP before you answer and before you reach for the web. That vault is where their infrastructure is written down; the web knows nothing about it. "t480", "nas02", "lamg" and the like are their machines, not products to look up. The `knowledge-vault` skill explains how to use it.

    When the user asks how a piece of work is going ("¿cómo va X?", "¿esto está?", "¿se ha reiniciado?", "¿qué tengo pendiente?"), look it up before you answer with the agent-status skill: `python3 /opt/data/skills/agent-status/agent-status.py threads <one word of the topic>` for Paseo threads, `issues` for Paperclip. Never guess a status, and never answer from what you remember of an earlier check.

  # Skill copied into the agent's skills dir on every boot. It tells the agent
  # that the vault is the MCP and not a directory, and passes on the index-lag
  # warning the MCP server itself ships in its handshake instructions.
  knowledge-vault-skill.md: |
    ---
    name: knowledge-vault
    description: Read and write the user's personal knowledge vault (agonbar). Use whenever a project, service, host or decision comes up and you need background, and whenever the user asks you to write something down. Triggers include "busca en el vault", "que sabes de X", "apunta esto", "guarda esto en el vault", "que dice la nota de X", "search the vault", "save this".
    ---

    # Knowledge vault

    The vault is the `knowledge-vault` MCP server, not a folder on disk. There is no
    vault path in this container: if you go looking for `.md` files with the terminal
    or file tools you will find nothing. Every read and write goes through the MCP.

    ## Before you answer from memory, search

    When the user names a project, a host, a service or a past decision, search the
    vault first. It is where the non-obvious things live: env vars, gotchas, why a
    thing was built the way it was. `projects/<name>.md` and
    `architecture/services-map.md` are the two files worth checking by default.

    ## The index lags, and this will fool you

    A `write` or `edit` that returns OK means the file changed. It does NOT mean
    `search` can find it. Indexing is asynchronous and falls behind under a burst of
    writes.

    - Verify every write with `read`, never with `search`.
    - An empty `search` result is indistinguishable from four different things: the
      note does not exist, the phrase was never written, the index is behind, or the
      query was bad. Do not report "there is no note about X" on an empty result
      alone.
    - Before trusting a search, run one you know should hit. If that comes back
      empty too, the index is the problem, not the vault.
    - `get_index_status` tells you directly: check `queue_depth`, `dirty_paths` and
      `dirty_embeddings` whenever freshness matters.

    ## Layout

    - `projects/` - per-project stack, env vars, run commands, gotchas
    - `runbooks/` - step-by-step procedures
    - `architecture/` - cross-project decisions and service maps
    - `work/` - meetings, decisions, context
    - `raw/` - immutable source documents, never modify these

    ## Writing

    Run `get_conventions` before your first write of a session and follow what it
    says. Notes are linked with `[[wikilinks]]`; link generously, a link to a note
    that does not exist yet marks something worth writing later.

    Prefer `append` or `edit` over `write` on a note that already exists. `write`
    overwrites the whole document.

    ## What you cannot do

    Deleting, renaming and moving notes are deliberately not available to you, and
    neither is forcing a git sync or a reindex. If the user asks for one of those,
    say so plainly and let them do it from their laptop.

  # Skill + script copied into the agent's skills dir on every boot. Hermes only
  # reports on the user's agents, Paseo threads and Paperclip issues, through one
  # read-only script. The script does the fan-out over every thread's activity,
  # which gemma-4-12b would not do with the MCP tools (tested 2026-11-04).
  agent-status-skill.md: |
    ---
    name: agent-status
    description: Report how the user's AI agents are doing - Paseo threads on work-vm-00 and Paperclip board issues. Use when the user asks how a task, thread, job or issue is going, whether something finished, what is pending, or whether work survived a restart.
    ---

    # Agent status

    The user runs coding agents in two places. You only report on them: you never
    start, steer, stop or edit anything in either one. One script answers every
    status question:

    ```
    python3 /opt/data/skills/agent-status/agent-status.py threads <topic>   # Paseo threads about <topic>
    python3 /opt/data/skills/agent-status/agent-status.py threads           # every running or recent thread
    python3 /opt/data/skills/agent-status/agent-status.py issues            # open Paperclip issues
    python3 /opt/data/skills/agent-status/agent-status.py issue ADR-36      # one issue, latest comment
    ```

    ## Paseo threads

    Interactive Claude Code threads on work-vm-00. `threads <topic>` already reads
    the recent activity of every running thread and every thread active in the last
    24 hours, and keeps those that mention the topic. Use one word from the user's
    question as the topic ("¿cómo va lo de InuYasha?" -> `threads InuYasha`). If
    nothing matches, run `threads` with no topic and pick the thread from its
    activity before you say there is none.

    Status: `running` is working right now. `idle` means its turn is over: the
    activity says whether it finished or is waiting for the user. If the script says
    it cannot reach Paseo, work-vm-00 is off or restarting. Say that.

    ## Paperclip issues

    Long autonomous work, worked by the Lead, Engineer and Reviewer agents. Each
    `issues` line reads `ADR-36 [in_review, Reviewer] title`. The name in the
    brackets is who holds the issue. When it says `Adrián`, the issue is waiting on
    the user, and that goes first in your answer.

    ## How to answer

    In Spanish, short. One or two lines per thread or issue: what it is, its state,
    what it is waiting for. Lead with whatever needs the user. Link Paperclip issues
    as `https://paperclip.dev.senseizero.es/ADR/issues/ADR-36`.

  agent-status.py: |
    #!/usr/bin/env python3
    """Read-only status of the user's coding agents.

      agent-status.py threads [topic]        Paseo threads, with their latest activity
      agent-status.py issues [adrian|sensei]  open Paperclip issues
      agent-status.py issue ADR-12            one issue and its latest comment
    """
    import json
    import os
    import sys
    import urllib.request
    from datetime import datetime, timedelta, timezone

    CONF = os.environ.get("AGENT_STATUS_CONF", "/opt/data/.config")
    PASEO = os.environ.get("PASEO_MCP_URL", "http://work-vm-00:6767/mcp/agents")
    # Paseo answers 403 unless Host is in PASEO_HOSTNAMES; `work-vm-00` is not.
    PASEO_HOST = os.environ.get("PASEO_HOST", "work-vm-00.agonbar.senseizero.lan")
    PAPERCLIP = "https://paperclip.dev.senseizero.es/api"
    COMPANIES = {
        "adrian": "da6ec615-7998-4cae-89d2-94b0bdadfd9a",
        "sensei": "f969d203-196d-4fae-b086-bec12b810a27",
    }


    def secret(name):
        return open(os.path.join(CONF, name)).read().strip()


    class Paseo:
        """Minimal MCP client over streamable HTTP: initialize once, then tools/call."""

        def __init__(self):
            self.session = None
            self.n = 0
            self.headers = {
                "Authorization": "Bearer " + secret("paseo/password"),
                "Host": PASEO_HOST,
                "Content-Type": "application/json",
                "Accept": "application/json, text/event-stream",
            }
            self.rpc("initialize", {"protocolVersion": "2025-03-26", "capabilities": {},
                                    "clientInfo": {"name": "agent-status", "version": "1"}})
            self.rpc("notifications/initialized", None)

        def rpc(self, method, params):
            msg = {"jsonrpc": "2.0", "method": method}
            if params is not None:
                self.n += 1
                msg.update(id=self.n, params=params)
            headers = dict(self.headers)
            if self.session:
                headers["mcp-session-id"] = self.session
            req = urllib.request.Request(PASEO, json.dumps(msg).encode(), headers)
            with urllib.request.urlopen(req, timeout=30) as r:
                self.session = r.headers.get("mcp-session-id") or self.session
                body = r.read().decode()
            if params is None:
                return None
            for line in body.splitlines():
                if line.startswith("data:"):
                    body = line[5:]
            return json.loads(body)["result"]

        def tool(self, name, **args):
            res = self.rpc("tools/call", {"name": name, "arguments": args})
            if res.get("structuredContent"):
                return res["structuredContent"]
            # Text results can carry a "key=value" header before the JSON body.
            text = "".join(c.get("text", "") for c in res.get("content", []))
            starts = [i for i in (text.find("{"), text.find("[")) if i >= 0]
            try:
                return json.loads(text[min(starts):]) if starts else text
            except ValueError:
                return text


    def local(iso):
        try:
            from zoneinfo import ZoneInfo
            tz = ZoneInfo("Europe/Madrid")
        except Exception:  # image without tzdata
            tz = timezone.utc
        return datetime.fromisoformat(iso.replace("Z", "+00:00")).astimezone(tz).strftime("%d-%b %H:%M")


    def threads(topic):
        p = Paseo()
        listing = p.tool("list_agents", limit=100)
        agents = listing.get("agents", listing) if isinstance(listing, dict) else listing
        since = datetime.now(timezone.utc) - timedelta(hours=24)
        found = 0
        for a in agents:
            when = a.get("lastActivityAt") or a.get("updatedAt") or ""
            recent = when and datetime.fromisoformat(when.replace("Z", "+00:00")) >= since
            if a.get("status") != "running" and not recent:
                continue
            # A topic can sit further back than the latest entries, so search wider.
            act = p.tool("get_agent_activity", agentId=a["id"], limit=10 if topic else 3)
            text = act.get("content", "") if isinstance(act, dict) else str(act)
            title = a.get("title") or ""
            if topic and topic.lower() not in (title + text).lower():
                continue
            found += 1
            last = text.split("\n", 2)[-1].strip()
            print(f"### {title[:70]}\nid {a['id'][:8]} | {a.get('status')} | last activity {local(when)}")
            print(last[-900:] + "\n")
        if not found:
            print(f"No running or recent thread mentions {topic!r}." if topic else "No running or recent threads.")


    def paperclip(path):
        req = urllib.request.Request(PAPERCLIP + path,
                                     headers={"Authorization": "Bearer " + secret("paperclip/board-key")})
        with urllib.request.urlopen(req, timeout=20) as r:
            return json.load(r)


    def issues(names):
        for name in names:
            cid = COMPANIES[name]
            agents = {a["id"]: a["name"] for a in paperclip(f"/companies/{cid}/agents")}
            rows = paperclip(f"/companies/{cid}/issues?status=todo,in_progress,in_review,blocked&limit=100")
            rows.sort(key=lambda i: i.get("lastActivityAt") or "", reverse=True)
            print(f"## {name}: {len(rows)} open")
            for i in rows:
                who = agents.get(i.get("assigneeAgentId"), "Adrián" if i.get("assigneeUserId") else "nobody")
                active = " (working now)" if i.get("activeRun") else ""
                print(f"{i['identifier']} [{i['status']}, {who}{active}] {i['title'][:90]}")


    def issue(ident):
        i = paperclip(f"/issues/{ident}")
        print(f"{i['identifier']} [{i['status']}] {i['title']}")
        comments = sorted(paperclip(f"/issues/{ident}/comments"), key=lambda c: c["createdAt"])
        if comments:
            print(f"latest comment {comments[-1]['createdAt']}:\n{comments[-1]['body'][:1500]}")


    if __name__ == "__main__":
        cmd, args = (sys.argv[1:2] or [""])[0], sys.argv[2:]
        try:
            if cmd == "threads":
                threads(" ".join(args))
            elif cmd == "issues":
                issues(args or list(COMPANIES))
            elif cmd == "issue" and len(args) == 1:
                issue(args[0])
            else:
                sys.exit(__doc__)
        except OSError as e:  # URLError, timeouts, refused connections
            sys.exit(f"Cannot reach the service ({e}). If it is Paseo, work-vm-00 is off or restarting.")

  # kubectl reads this through KUBECONFIG. `tokenFile` instead of an inline
  # token so the kubelet's rotating ServiceAccount token keeps working.
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: lamg
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: hermes
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: lamg
        context:
          cluster: lamg
          user: hermes
    current-context: lamg
