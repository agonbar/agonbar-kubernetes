# Seeded into the PVC on first boot only (see the initContainer). After that
# hermes owns the file: `hermes config set` writes here, and the container
# auto-migrates the schema (_config_version 46 as of the 2026-09 image).
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
data:
  config.yaml: |
    _config_version: 46

    # LiteLLM speaks the OpenAI wire protocol, so hermes reaches it through its
    # built-in "openai" provider plus OPENAI_BASE_URL. Naming a custom provider
    # under `providers:` and writing the model as `litellm/<model>` does NOT
    # work: hermes reads the unknown prefix as OpenRouter and 401s.
    # Coste cero: gemma-4-12b-free es el grupo de LiteLLM que solo baja por
    # escalones gratis: la 3090 de work-vm-00 (local-llm-00.dev.senseizero.es),
    # luego gemma de OpenRouter gratis, y si todo cae devuelve error. Nunca
    # Copilot ni Vertex. gemma-4-12b-00 si caia a Copilot y a Vertex de pago.
    model:
      default: "gemma-4-12b-free"
      provider: openai

    # Auxiliary calls (compression, curation) default to the Nous Portal, which
    # this install has no account for. Point them at the same endpoint.
    auxiliary:
      compression:
        provider: main

    database:
      journal_mode: wal
  # SOUL.md is the agent's always-loaded identity slot, so the one rule that
  # has to fire without being asked lives here and not in the skill: a skill
  # only helps once the agent has decided to look at the vault at all.
  # Stock Nous persona text, plus that rule. Overwritten every boot, so edit
  # it here rather than in the pod.
  SOUL.md: |
    You are Hermes Agent, built by Nous Research. Be direct: match the length of your reply to the weight of the ask — a one-line question gets a one-line answer, and finished work gets a short report of what changed, what's verified, and what's left, never a replay of the process. No filler ("Great question," "I'd be happy to"), no restating the request back, no re-summarizing what you already said, no narrating tool calls the user can see. Plain claims over adjectives; when unsure, say so plainly. Agree because it's right, not because the user said it. Depth is earned — give it when the user asks for detail, teaches, or the stakes demand it, not by default.

    When the user asks about one of their own projects, hosts, services or past decisions, search the knowledge-vault MCP before you answer and before you reach for the web. That vault is where their infrastructure is written down; the web knows nothing about it. "t480", "nas02", "lamg" and the like are their machines, not products to look up. The `knowledge-vault` skill explains how to use it.

    When the user asks how a piece of work is going ("¿cómo va X?", "¿esto está?", "¿se ha reiniciado?", "¿qué tengo pendiente?"), look it up before you answer: Paseo threads through the paseo MCP, Paperclip issues through the agent-status skill. Never guess a status, and never answer from what you remember of an earlier check.

  # Skill copied into the agent's skills dir on every boot. It tells the agent
  # that the vault is the MCP and not a directory, and passes on the index-lag
  # warning the MCP server itself ships in its handshake instructions.
  knowledge-vault-skill.md: |
    ---
    name: knowledge-vault
    description: Read and write the user's personal knowledge vault (agonbar). Use whenever a project, service, host or decision comes up and you need background, and whenever the user asks you to write something down. Triggers include "busca en el vault", "que sabes de X", "apunta esto", "guarda esto en el vault", "que dice la nota de X", "search the vault", "save this".
    ---

    # Knowledge vault

    The vault is the `knowledge-vault` MCP server, not a folder on disk. There is no
    vault path in this container: if you go looking for `.md` files with the terminal
    or file tools you will find nothing. Every read and write goes through the MCP.

    ## Before you answer from memory, search

    When the user names a project, a host, a service or a past decision, search the
    vault first. It is where the non-obvious things live: env vars, gotchas, why a
    thing was built the way it was. `projects/<name>.md` and
    `architecture/services-map.md` are the two files worth checking by default.

    ## The index lags, and this will fool you

    A `write` or `edit` that returns OK means the file changed. It does NOT mean
    `search` can find it. Indexing is asynchronous and falls behind under a burst of
    writes.

    - Verify every write with `read`, never with `search`.
    - An empty `search` result is indistinguishable from four different things: the
      note does not exist, the phrase was never written, the index is behind, or the
      query was bad. Do not report "there is no note about X" on an empty result
      alone.
    - Before trusting a search, run one you know should hit. If that comes back
      empty too, the index is the problem, not the vault.
    - `get_index_status` tells you directly: check `queue_depth`, `dirty_paths` and
      `dirty_embeddings` whenever freshness matters.

    ## Layout

    - `projects/` - per-project stack, env vars, run commands, gotchas
    - `runbooks/` - step-by-step procedures
    - `architecture/` - cross-project decisions and service maps
    - `work/` - meetings, decisions, context
    - `raw/` - immutable source documents, never modify these

    ## Writing

    Run `get_conventions` before your first write of a session and follow what it
    says. Notes are linked with `[[wikilinks]]`; link generously, a link to a note
    that does not exist yet marks something worth writing later.

    Prefer `append` or `edit` over `write` on a note that already exists. `write`
    overwrites the whole document.

    ## What you cannot do

    Deleting, renaming and moving notes are deliberately not available to you, and
    neither is forcing a git sync or a reindex. If the user asks for one of those,
    say so plainly and let them do it from their laptop.

  # Skill + script copied into the agent's skills dir on every boot. Hermes only
  # reports on the user's agents: Paseo threads (paseo MCP, read-only tools) and
  # Paperclip issues (this script, GET only).
  agent-status-skill.md: |
    ---
    name: agent-status
    description: Report how the user's AI agents are doing - Paseo threads on work-vm-00 and Paperclip board issues. Use when the user asks how a task, thread, job or issue is going, whether something finished, what is pending, or whether work survived a restart.
    ---

    # Agent status

    The user runs coding agents in two places. You only report on them: you never
    start, steer, stop or edit anything in either one.

    ## Paseo threads (paseo MCP)

    Interactive Claude Code threads on work-vm-00.

    1. `list_agents` gives every recent thread. `title` is the start of the user's
       first message, so match the user's words against it ("lo de InuYasha" is the
       thread whose title or latest activity mentions InuYasha or cruncharr).
    2. `get_agent_activity` with that `agentId` and `limit: 3` gives the latest
       entries, already summarised. Read them before you answer.
    3. Status meaning:
       - `running`: working right now.
       - `idle`: its turn is over. Either it finished, or it is waiting for the
         user. The last entry says which.
       - `error`: it failed. Say so and quote the error.
    4. If the MCP does not answer, work-vm-00 is off or restarting. Tell the user
       that, not "there are no threads".

    ## Paperclip issues (script)

    Long autonomous work: issues worked by the Lead, Engineer and Reviewer agents.

    ```
    python3 /opt/data/skills/agent-status/paperclip-status.py open           # both companies
    python3 /opt/data/skills/agent-status/paperclip-status.py open adrian    # or sensei
    python3 /opt/data/skills/agent-status/paperclip-status.py show ADR-36
    ```

    Each `open` line reads `ADR-36 [in_review, Reviewer] title`. The name in the
    brackets is who holds the issue. When it says `Adrián`, the issue is waiting on
    the user, and that is the part to lead with.

    ## How to answer

    In Spanish, short. One line per thread or issue: what it is, its state, and what
    it is waiting for. Lead with whatever needs the user. Link Paperclip issues as
    `https://paperclip.dev.senseizero.es/ADR/issues/ADR-36`.

  paperclip-status.py: |
    #!/usr/bin/env python3
    """Read-only view of the Paperclip board.

      paperclip-status.py open [adrian|sensei]   open issues, newest activity first
      paperclip-status.py show ADR-12            status, title and latest comment
    """
    import json
    import os
    import sys
    import urllib.request

    API = "https://paperclip.dev.senseizero.es/api"
    KEY_FILE = os.environ.get("PAPERCLIP_BOARD_KEY_FILE", "/opt/data/.config/paperclip/board-key")
    COMPANIES = {
        "adrian": "da6ec615-7998-4cae-89d2-94b0bdadfd9a",
        "sensei": "f969d203-196d-4fae-b086-bec12b810a27",
    }
    OPEN = "todo,in_progress,in_review,blocked"


    def get(path):
        key = open(KEY_FILE).read().strip()
        req = urllib.request.Request(API + path, headers={"Authorization": "Bearer " + key})
        with urllib.request.urlopen(req, timeout=20) as r:
            return json.load(r)


    def show_open(names):
        for name in names:
            cid = COMPANIES[name]
            agents = {a["id"]: a["name"] for a in get(f"/companies/{cid}/agents")}
            issues = get(f"/companies/{cid}/issues?status={OPEN}&limit=100")
            issues.sort(key=lambda i: i.get("lastActivityAt") or "", reverse=True)
            print(f"## {name}: {len(issues)} open")
            for i in issues:
                who = agents.get(i.get("assigneeAgentId"), "Adrián" if i.get("assigneeUserId") else "nobody")
                active = " (working now)" if i.get("activeRun") else ""
                print(f"{i['identifier']} [{i['status']}, {who}{active}] {i['title'][:90]}")


    def show_one(ident):
        i = get(f"/issues/{ident}")
        print(f"{i['identifier']} [{i['status']}] {i['title']}")
        comments = sorted(get(f"/issues/{ident}/comments"), key=lambda c: c["createdAt"])
        if comments:
            print(f"latest comment {comments[-1]['createdAt']}:\n{comments[-1]['body'][:1500]}")


    if __name__ == "__main__":
        args = sys.argv[1:]
        if args[:1] == ["open"]:
            show_open(args[1:] or list(COMPANIES))
        elif args[:1] == ["show"] and len(args) == 2:
            show_one(args[1])
        else:
            sys.exit(__doc__)

  # kubectl reads this through KUBECONFIG. `tokenFile` instead of an inline
  # token so the kubelet's rotating ServiceAccount token keeps working.
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: lamg
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: hermes
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: lamg
        context:
          cluster: lamg
          user: hermes
    current-context: lamg
