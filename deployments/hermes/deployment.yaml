# hermes — Nous Research's agent, replacing the openclaw install that died with
# work-vm-01 in 2026-09. Talks to you over Telegram (polling, so no ingress and
# no webhook) and can host several named bots that message each other.
#
# The image is s6-supervised: the entrypoint syncs bundled skills, reconciles
# profiles and then starts the gateway. Two things learned the hard way while
# rehearsing this on ovh02:
#   - the command must be `gateway run`. With no arguments the container boots,
#     finds nothing to supervise and exits 0.
#   - the API server binds 127.0.0.1 unless API_SERVER_HOST is set, so without
#     it every kubelet probe fails while curl inside the pod returns 200.
#
# openclaw died in this cluster from `:latest` + keel auto-pulls and from TCP
# probes firing before the gateway was up. Hence the digest pin and a
# startupProbe with five minutes of slack.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  labels:
    app: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate          # one RWO volume with a SQLite store; never two writers
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      serviceAccountName: hermes
      # `workload: agents` marks a node as an always-on home for stateful
      # agents. local-path binds the volume to whichever node is picked first
      # and keeps it there, so the choice wants to be deliberate rather than
      # whatever the scheduler felt like. Set with:
      #   kubectl label node ovh02 workload=agents
      nodeSelector:
        workload: agents
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: config-seed
          configMap:
            name: hermes-config
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
      initContainers:
        # Runs on the hermes image itself: it is already on the node and it has
        # both a shell and curl, which the distroless kubectl image does not.
        - name: seed-data
          image: nousresearch/hermes-agent@sha256:fdf7ab656e9c80ed490958c4733778d8bb33396ed7ddf7e4d0a1b69635bcc8d1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /opt/data/.local/bin /opt/data/.kube

              # config.yaml is seeded once and then belongs to hermes, which
              # rewrites it on `hermes config set` and on schema migrations.
              # Editing the ConfigMap changes nothing until you delete the file.
              [ -f /opt/data/config.yaml ] || cp /config/config.yaml /opt/data/config.yaml

              # The kubeconfig is derived, so it is refreshed every boot.
              cp /config/kubeconfig /opt/data/.kube/config

              # The image ships no kubectl, which would leave the ClusterRoles
              # in rbac.yaml doing nothing. /opt/data/.local/bin is already on
              # the image's PATH. Version tracks the k3s server (v1.36.4).
              if [ ! -x /opt/data/.local/bin/kubectl ]; then
                curl -fsSL -o /opt/data/.local/bin/kubectl \
                  https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl
                chmod +x /opt/data/.local/bin/kubectl
              fi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config-seed
              mountPath: /config
      containers:
        - name: hermes
          image: nousresearch/hermes-agent@sha256:fdf7ab656e9c80ed490958c4733778d8bb33396ed7ddf7e4d0a1b69635bcc8d1
          args: ["gateway", "run"]
          env:
            - name: OPENAI_BASE_URL
              value: https://litellm.senseivision.ai/v1
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-env
                  key: LITELLM_API_KEY
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-env
                  key: TELEGRAM_BOT_TOKEN
            # Without an allowlist the gateway denies every sender it does not
            # recognise, which reads exactly like a bot that ignores you.
            - name: TELEGRAM_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: hermes-env
                  key: TELEGRAM_ALLOWED_USERS
            - name: KUBECONFIG
              value: /opt/data/.kube/config
            # Dashboard web: lista de bots, chats y ficheros. El servicio de s6
            # sale con 0 en silencio si HERMES_DASHBOARD no esta puesto, y se
            # niega a arrancar sin auth cuando no escucha en loopback.
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: "0.0.0.0"
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hermes-env
                  key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-env
                  key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
            - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-env
                  key: HERMES_DASHBOARD_BASIC_AUTH_SECRET
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-env
                  key: API_SERVER_KEY
          ports:
            - name: gateway
              containerPort: 8642
            - name: dashboard
              containerPort: 9119
          startupProbe:
            httpGet:
              path: /health
              port: 8642
            periodSeconds: 10
            failureThreshold: 30     # 5 min; bundled-skill sync alone takes ~40s
          livenessProbe:
            httpGet:
              path: /health
              port: 8642
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8642
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 6Gi          # bundled Chromium is the reason for the headroom
          volumeMounts:
            - name: data
              mountPath: /opt/data
            # The terminal tool sanitises the environment before running a
            # command, so /opt/data/.local/bin drops off PATH even though the
            # image ships it and an interactive bash still has it. The agent
            # then reports `kubectl: command not found` and gives up. Bind the
            # same binary where a bare PATH will find it. The init container
            # creates the file first, so this never mounts as a directory.
            - name: data
              mountPath: /usr/local/bin/kubectl
              subPath: .local/bin/kubectl
            - name: dshm
              mountPath: /dev/shm
