apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ps4-host
  name: ps4-host
  namespace: ps4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ps4-host
  template:
    metadata:
      labels:
        app: ps4-host
    spec:
      containers:
        - image: ghcr.io/agonbar/ps4-host:latest
          name: web
          # Mutable :latest tag: always resolve against the registry on pod start.
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
      # ghcr.io/agonbar is private: pull needs credentials on every node.
      imagePullSecrets:
        - name: ghcr-pull
      # Static site served by nginx; pinned to the always-on NAS node.
      nodeSelector:
        egress-site: lamg
